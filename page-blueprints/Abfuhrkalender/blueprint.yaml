"blueprint":
  "name": "Waste Collection"
  "name_de": "Abfuhrkalender"
  "description": "Configure any number of waste types with names, entity IDs and optional icons."
  "description_de": "Beliebig viele Müllarten mit Name, Entität und optionalem Icon anlegen."
  "type": "page"
  "version": "1.0.0"
  "icon": "mdi:trash-can-outline"
  "author": "makeflori"
  "custom_cards":
    - "button-card"
    - "layout-card"
  "input":
    "waste_types":
      "name": "Waste types"
      "name_de": "Müllarten"
      "description": "Add one entry for each waste type. Entity date formats must be supported by your sensor."
      "description_de": "Für jede Müllart einen Eintrag anlegen. Das Datumsformat muss vom Sensor unterstützt werden."
      "type": "entity-list"
      "suggest": "waste"
      "entity_domain": "sensor"
      "default_icon": "mdi:trash-can-outline"
      "default": []
"card":
  "type": "vertical-stack"
  "cards":
    -
      "type": "custom:button-card"
      "show_icon": false
      "show_name": true
      "name":
        "i18n":
          "de": "Nächste Abholungen"
          "en": "Upcoming collections"
      "styles":
        "card":
          -
            "background": "transparent"
          -
            "border": "0"
          -
            "box_shadow": "none"
          -
            "padding": "8px 4px"
        "name":
          -
            "justify-self": "start"
          -
            "font-size": "24px"
          -
            "font-weight": "500"
    -
      "type": "custom:layout-card"
      "layout_type": "custom:grid-layout"
      "layout":
        "grid-template-columns": "repeat(4,minmax(0,1fr))"
        "grid-gap": "12px"
        "mediaquery":
          "(max-width: 850px)":
            "grid-template-columns": "repeat(2,minmax(0,1fr))"
            "grid-gap": "8px"
      "cards":
        -
          "repeat": "waste_types"
          "template":
            "type": "custom:button-card"
            "entity": "$item.entity$"
            "name": "$item.name$"
            "icon": "$item.icon$"
            "show_icon": true
            "show_name": true
            "show_state": true
            "show_label": true
            "label": "[[[ const s=states[entity.entity_id];if(!s)return '—';const d=s.attributes?.next_date||s.attributes?.date||s.state; return String(d??'—'); ]]]"
            "styles":
              "card":
                -
                  "border-radius": "14px"
                -
                  "padding": "12px"
                -
                  "min-height": "110px"
              "grid":
                -
                  "grid-template-areas": "\"i\" \"n\" \"s\" \"l\""
                -
                  "grid-template-columns": "1fr"
              "icon":
                -
                  "width": "26px"
                -
                  "color": "var(--primary-color)"
              "name":
                -
                  "font-size": "14px"
                -
                  "font-weight": "600"
              "state":
                -
                  "font-size": "13px"
              "label":
                -
                  "font-size": "12px"
            "tap_action":
              "action": "more-info"
