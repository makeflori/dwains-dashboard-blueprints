blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Compact and consistent energy and costs dashboard with native interactive charts."
  description_de: "Kompakte Energie- und Kostenübersicht mit einheitlichen, interaktiven Diagrammen."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    base_fee_month:
      name: "Monthly electricity standing charge"
      name_de: "Stromgrundpreis / Monat"
      type: "entity-picker"
      entity_domain: "input_number"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []

card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst rd=id=>{const o=states[id];const v=Number(o?.state);return o&&![\"unavailable\",\"unknown\"].includes(o.state)&&Number.isFinite(v)?v:null;};\nconst num=x=>x===null?\"–\":x.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst meters=$json.monthly_consumption$;\nconst total=rd(\"$total_energy_month$\");\nconst data=[\n{title:\"Verbrauch · Monat\",val:total===null?meters.reduce((s,m)=>s+(rd(m.entity)??0),0):total,unit:\"kWh\",icon:\"energy\"},\n{title:\"Verbrauch · Jahr\",val:rd(\"$total_energy_year$\"),unit:\"kWh\",icon:\"energy\"},\n{title:\"Kosten · Monat\",val:rd(\"$total_cost_month$\"),unit:\"€\",icon:\"cost\"},\n{title:\"Kosten · Jahr\",val:rd(\"$total_cost_year$\"),unit:\"€\",icon:\"cost\"}\n];\nconst icons={\n energy:'<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4.5 13H11l-1 9L19.5 10H13V2Z\"/></svg>',\n cost:'<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"/><path d=\"M16 12h5\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/></svg>'\n};\nconst tile=x=>'<section style=\"box-sizing:border-box;min-width:0;min-height:102px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 17px;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;color:var(--primary-text-color);font-family:inherit\"><div style=\"display:flex;align-items:center;gap:9px;min-width:0\"><span aria-hidden=\"true\" style=\"color:'+(x.icon===\"cost\"?\"#c9952b\":\"var(--primary-color)\")+';flex-shrink:0\">'+icons[x.icon]+'</span><span style=\"font-size:12px;line-height:1.3;font-weight:650;color:var(--secondary-text-color);overflow-wrap:normal\">'+x.title+'</span></div><div style=\"display:flex;align-items:baseline;gap:4px;flex-shrink:0;text-align:right\"><strong style=\"font-size:clamp(21px,1.9vw,28px);line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums\">'+num(x.val)+'</strong><span style=\"font-size:11px;color:var(--secondary-text-color)\">'+x.unit+'</span></div></section>';\nreturn '<div style=\"box-sizing:border-box;padding:0 9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\">'+data.map(tile).join(\"\")+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '"panel"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:apexcharts-card"
          requires_input: "historical_consumption_meters"
          graph_span: "184d"
          span:
            end: "month"
          update_interval: "10min"
          cache: true
          experimental:
            hidden_by_default: true
          header: {"show":true,"title":"Verbrauch · Monatsverlauf","standard_format":true,"show_states":false}
          color_list: ["#ca2b76","#388cce","#dfaa22","#43ad93","#9674c6","#db7950","#6c86a6","#ad62a0"]
          yaxis: [{"min":0,"max":"auto","decimals":0,"apex_config":{"tickAmount":4,"title":{"text":"","style":{"fontSize":"11px","fontWeight":400}},"labels":{"style":{"fontSize":"11px","fontWeight":400}}}}]
          all_series_config: {"type":"column","statistics":{"type":"change","period":"month","align":"middle"},"transform":"return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"}
          apex_config: {"chart":{"height":268,"fontFamily":"inherit","toolbar":{"show":false},"animations":{"enabled":false}},"legend":{"show":true,"position":"bottom","fontSize":"11px","itemMargin":{"horizontal":8,"vertical":4}},"plotOptions":{"bar":{"columnWidth":"65%","borderRadius":2}},"tooltip":{"shared":false,"intersect":true,"x":{"format":"MMMM yyyy"}},"xaxis":{"type":"datetime","tickAmount":6,"labels":{"show":true,"datetimeUTC":false,"format":"MMM yy","rotate":0,"hideOverlappingLabels":true,"style":{"fontSize":"11px"}},"axisTicks":{"show":false}},"grid":{"padding":{"top":8,"bottom":4,"left":4,"right":6}},"dataLabels":{"enabled":false}}
          card_mod: {"style":"ha-card {box-sizing:border-box;min-width:0;min-height:370px;height:100%;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;box-shadow:none;overflow:hidden;} ha-card .card-header {font-size:16px;font-weight:650;}"}
          series:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
                unit: "kWh"
                float_precision: 1
                show:
                  legend_value: false
                  in_legend: true
                  hidden_by_default: "$item.hidden_by_default$"
        -
          type: "custom:apexcharts-card"
          chart_type: "donut"
          update_interval: "1min"
          cache: true
          header: {"show":true,"title":"Kostenverteilung · aktueller Monat","standard_format":true,"show_states":false}
          color_list: ["#ca2b76","#388cce","#dfaa22","#43ad93","#9674c6","#db7950","#6c86a6","#ad62a0","#9ea4ac"]
          apex_config: {"chart":{"height":310,"fontFamily":"inherit","toolbar":{"show":false},"animations":{"enabled":true,"speed":240}},"legend":{"show":true,"position":"right","horizontalAlign":"left","fontSize":"12px","itemMargin":{"horizontal":3,"vertical":7},"markers":{"width":10,"height":10,"radius":2}},"dataLabels":{"enabled":false},"plotOptions":{"pie":{"expandOnClick":true,"offsetY":0,"donut":{"size":"67%","labels":{"show":true,"name":{"show":false},"value":{"show":false},"total":{"show":true,"showAlways":true,"label":"€ / Monat","fontSize":"13px","fontWeight":500,"formatter":"EVAL:function(w){const n=w.globals.seriesTotals.reduce((a,b)=>a+(Number(b)||0),0);return n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});}"}}}}},"states":{"hover":{"filter":{"type":"lighten","value":0.12}},"active":{"filter":{"type":"darken","value":0.05}}},"tooltip":{"enabled":true,"fillSeriesColor":false,"theme":"auto"},"stroke":{"width":1,"colors":["var(--card-background-color)"]}}
          card_mod: {"style":"ha-card {box-sizing:border-box;min-width:0;min-height:370px;height:100%;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;box-shadow:none;overflow:hidden;} ha-card .card-header {font-size:16px;font-weight:650;}"}
          series:
            -
              repeat: "monthly_costs"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
                unit: "€"
                float_precision: 2
                show:
                  legend_value: true
                  in_legend: true
                  datalabels: false
            -
              entity: "$base_fee_month$"
              name: "Grundpreis"
              unit: "€"
              float_precision: 2
              show:
                legend_value: true
                in_legend: true
                datalabels: false
    -
      type: "conditional"
      conditions:
        -
          condition: "screen"
          media_query: "(max-width: 767px)"
      card:
        type: "custom:button-card"
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: "none"
        styles:
          card:
            -
              height: "calc(76px + env(safe-area-inset-bottom, 0px))"
            -
              background: "transparent"
            -
              box-shadow: "none"
            -
              border: "none"
            -
              padding: "0"
