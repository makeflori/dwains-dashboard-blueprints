blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Unified energy and cost dashboard with interactive cost ring and monthly consumption comparison."
  description_de: "Kennzahlen, Verbrauchsverlauf und interaktive Kostenverteilung mit Grundpreis, ohne redundante Raumkacheln."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    base_fee_month:
      name: "Monthly electricity standing charge"
      name_de: "Stromgrundpreis / Monat"
      type: "entity-picker"
      entity_domain: "input_number"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []

card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst list=$json.monthly_consumption$;\nconst m=read(\"$total_energy_month$\");\nconst measured=m===null?list.reduce((sum,x)=>sum+(read(x.entity)??0),0):m;\nconst data=[\n {title:\"Verbrauch · Monat\",value:measured,unit:\"kWh\",type:\"energy\"},\n {title:\"Verbrauch · Jahr\",value:read(\"$total_energy_year$\"),unit:\"kWh\",type:\"energy\"},\n {title:\"Kosten · Monat\",value:read(\"$total_cost_month$\"),unit:\"€\",type:\"cost\"},\n {title:\"Kosten · Jahr\",value:read(\"$total_cost_year$\"),unit:\"€\",type:\"cost\"}\n];\nconst symbols={energy:'<svg viewBox=\"0 0 24 24\" width=\"31\" height=\"31\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4.5 13H11l-1 9L19.5 10H13V2Z\"/></svg>',cost:'<svg viewBox=\"0 0 24 24\" width=\"31\" height=\"31\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"5\" width=\"19\" height=\"14\" rx=\"3\"/><path d=\"M15.5 11.5h6\"/><circle cx=\"15.5\" cy=\"11.5\" r=\"1\"/></svg>'};\nconst tile=r=>{const hue=r.type===\"energy\"?\"var(--primary-color)\":\"#c9952b\";return '<section style=\"box-sizing:border-box;min-width:0;padding:16px 17px;min-height:105px;display:flex;align-items:center;gap:13px;border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));font-family:inherit;color:var(--primary-text-color)\"><div aria-hidden=\"true\" style=\"color:'+hue+';flex:0 0 36px;display:flex;align-items:center;justify-content:center\">'+symbols[r.type]+'</div><div style=\"min-width:0;flex:1;text-align:right\"><div style=\"font-size:12px;font-weight:650;color:var(--secondary-text-color);margin-bottom:12px\">'+r.title+'</div><div style=\"display:flex;justify-content:flex-end;align-items:baseline;gap:5px;flex-wrap:wrap\"><strong style=\"font-size:clamp(22px,2.1vw,30px);font-variant-numeric:tabular-nums;font-weight:720;letter-spacing:-.35px;line-height:1.05\">'+fmt(r.value)+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color)\">'+r.unit+'</span></div></div></section>';};\nreturn '<div style=\"box-sizing:border-box;padding:0 9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,218px),1fr));gap:12px\">'+data.map(tile).join(\"\")+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '"panel"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:apexcharts-card"
          requires_input: "historical_consumption_meters"
          graph_span: "6month"
          span:
            end: "month"
          update_interval: "10min"
          cache: true
          experimental:
            hidden_by_default: true
          header:
            show: false
            title: "Verbrauch · Monatsverlauf"
            standard_format: false
          color_list:
            - "#ca2b76"
            - "#388cce"
            - "#dfaa22"
            - "#43ad93"
            - "#9674c6"
            - "#db7950"
            - "#6c86a6"
            - "#ad62a0"
          yaxis:
            - min: 0
              max: "auto"
              decimals: 0
              apex_config:
                tickAmount: 5
                title:
                  text: "kWh"
                  style:
                    fontSize: "12px"
          all_series_config:
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "middle"
            transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
          apex_config:
            chart:
              height: 325
              fontFamily: "inherit"
            yaxis:
              -
                labels:
                  show: true
                title:
                  text: "kWh"
                  style:
                    fontSize: "12px"
            xaxis:
              type: "category"
              tickPlacement: "on"
              labels:
                show: true
                rotate: 0
                hideOverlappingLabels: false
                trim: false
                formatter: "EVAL:function(value){const n=Number(value);return Number.isFinite(n)?new Date(n).toLocaleDateString(\"de-DE\",{month:\"short\",year:\"2-digit\"}):String(value);}"
              axisTicks:
                show: false
            legend:
              show: true
              position: "bottom"
              fontSize: "11px"
              itemMargin:
                horizontal: 7
                vertical: 5
            plotOptions:
              bar:
                columnWidth: "68%"
            tooltip:
              shared: true
              x:
                formatter: "EVAL:function(value){const n=Number(value);return Number.isFinite(n)?new Date(n).toLocaleDateString(\"de-DE\",{month:\"long\",year:\"numeric\"}):String(value);}"
          card_mod:
            style: "ha-card { box-sizing:border-box; height:100%; border:1px solid var(--divider-color); border-radius:12px; box-shadow:none; background:var(--ha-card-background,var(--card-background-color)); overflow:hidden; } ha-card::before { content:\"Verbrauch · Monatsverlauf\"; display:block; padding:16px 18px 0; font-size:16px; font-weight:600; line-height:1.25; color:var(--primary-text-color); text-align:left; }"
          series:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
                unit: "kWh"
                float_precision: 1
                show:
                  legend_value: false
                  in_legend: true
                  hidden_by_default: "$item.hidden_by_default$"
        -
          type: "custom:button-card"
          show_name: false
          show_icon: false
          show_state: false
          show_label: false
          tap_action:
            action: "none"
          triggers_update:
            - "$base_fee_month$"
            - "$total_cost_month$"
            -
              repeat: "monthly_consumption"
              template: "$item.entity$"
            -
              repeat: "monthly_costs"
              template: "$item.entity$"
          custom_fields:
            panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst costs=$json.monthly_costs$,usage=$json.monthly_consumption$,history=$json.historical_consumption_meters$;\nconst palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"],standing=read(\"$base_fee_month$\"),overall=read(\"$total_cost_month$\");\nconst elements=costs.map(x=>{const i=history.findIndex(h=>h.name===x.name);const source=usage.find(u=>u.name===x.name);return {name:x.name,cost:read(x.entity),kwh:source?read(source.entity):null,color:palette[Math.max(i,0)%palette.length]};});\nconst deviceCost=elements.reduce((n,x)=>n+(x.cost??0),0);\nif(standing!==null)elements.push({name:\"Grundpreis\",cost:standing,kwh:null,color:\"#a6a6a6\"});\nconst assigned=elements.reduce((n,x)=>n+(x.cost??0),0);\nif(overall!==null&&overall>assigned+.06)elements.push({name:\"Weitere Kosten\",cost:overall-assigned,kwh:null,color:\"#6c7582\"});\nconst total=elements.reduce((n,x)=>n+(x.cost??0),0);\nconst ring=2*Math.PI*64;let cursor=0;\nconst slices=elements.filter(x=>x.cost!==null&&x.cost>0).map(x=>{const width=x.cost/total*ring;const out='<circle tabindex=\"0\" class=\"energy-cost-segment\" cx=\"106\" cy=\"106\" r=\"64\" fill=\"none\" stroke=\"'+x.color+'\" stroke-width=\"25\" stroke-dasharray=\"'+width+' '+ring+'\" stroke-dashoffset=\"'+(-cursor)+'\" transform=\"rotate(-90 106 106)\"><title>'+esc(x.name)+': '+fmt(x.cost)+' €'+(x.kwh===null?'':' · '+fmt(x.kwh)+' kWh')+'</title></circle>';cursor+=width;return out;}).join(\"\");\nconst svg='<svg viewBox=\"0 0 212 212\" style=\"display:block;width:100%;max-width:220px;height:auto;margin:0 auto;overflow:visible\" role=\"img\" aria-label=\"Interaktive monatliche Kostenverteilung\"><circle cx=\"106\" cy=\"106\" r=\"64\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"25\"/>'+slices+'<text x=\"106\" y=\"101\" font-size=\"29\" font-weight=\"720\" text-anchor=\"middle\" fill=\"var(--primary-text-color)\">'+fmt(total)+'</text><text x=\"106\" y=\"123\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--secondary-text-color)\">€ / Monat</text></svg>';\nconst css='<style>.energy-cost-segment{transition:stroke-width .18s ease,opacity .18s ease,filter .18s ease;cursor:pointer;outline:none}.energy-cost-segment:hover,.energy-cost-segment:focus{stroke-width:36;filter:brightness(1.12)}.energy-cost-segment:focus-visible{stroke-width:36;stroke-dasharray:3 3}</style>';\nconst layout='grid-template-columns:9px minmax(0,1fr) 49px 43px 57px;';\nconst heading='<div style=\"display:grid;'+layout+'gap:5px;align-items:center;padding:0 0 8px;border-bottom:1px solid var(--divider-color);font-size:11px;font-weight:650;color:var(--secondary-text-color)\"><span></span><span>Gerät</span><span style=\"text-align:right\">kWh</span><span style=\"text-align:right\">Anteil</span><span style=\"text-align:right\">Kosten</span></div>';\nconst rows=elements.map(x=>'<div style=\"display:grid;'+layout+'gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid var(--divider-color);font-size:11px;line-height:1.2\"><span style=\"width:8px;height:8px;border-radius:2px;background:'+x.color+'\"></span><span style=\"min-width:0;overflow-wrap:anywhere;text-align:left\">'+esc(x.name)+'</span><span style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+(x.kwh===null?\"–\":x.kwh.toLocaleString(\"de-DE\",{maximumFractionDigits:1}))+'</span><span style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+(x.cost===null||total<=0?\"–\":(100*x.cost/total).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+' %')+'</span><strong style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+fmt(x.cost)+' €</strong></div>').join(\"\");\nreturn '<section style=\"box-sizing:border-box;min-width:0;height:100%;padding:16px 18px;border:1px solid var(--divider-color);background:var(--ha-card-background,var(--card-background-color));border-radius:12px;color:var(--primary-text-color);font-family:inherit;text-align:left\">'+css+'<div style=\"font-size:16px;font-weight:600;line-height:1.25;margin-bottom:14px\">Kostenverteilung · aktueller Monat</div><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:15px;justify-content:space-around\"><div style=\"flex:0 1 205px;min-width:168px\">'+(total>0?svg:'<div>Keine Kostendaten</div>')+'</div><div style=\"min-width:min(100%,285px);flex:1\">'+heading+rows+'</div></div></section>';\n]]]"
          styles:
            card:
              - border: "none"
              - box-shadow: "none"
              - padding: "0"
              - background: "transparent"
            grid:
              - grid-template-areas: '"panel"'
              - grid-template-columns: "minmax(0,1fr)"
            custom_fields:
              panel:
                - width: "100%"
                - min-width: "0"

    -
      type: "conditional"
      conditions:
        -
          condition: "screen"
          media_query: "(max-width: 767px)"
      card:
        type: "custom:button-card"
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: "none"
        styles:
          card:
            -
              height: "calc(76px + env(safe-area-inset-bottom, 0px))"
            -
              background: "transparent"
            -
              box-shadow: "none"
            -
              border: "none"
            -
              padding: "0"
