blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Consistent consumption/cost dashboard with monthly statistics, matching device colors and compact grouped cards."
  description_de: "Verbrauch links, Kosten rechts; Monatsverlauf mit dynamischer Achse, einheitliche Gerätefarben und kompakte Kacheln."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
    kitchen:
      name: "Devices in Küche"
      name_de: "Geräte Küche"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:fridge-outline"
      default: []
    office:
      name: "Devices in Büro"
      name_de: "Geräte Büro"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:desktop-classic"
      default: []
    living:
      name: "Devices in Wohnzimmer"
      name_de: "Geräte Wohnzimmer"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:sofa-outline"
      default: []
    bathroom:
      name: "Devices in Bad"
      name_de: "Geräte Bad"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:washing-machine"
      default: []
    other:
      name: "Devices in Raumübergreifend"
      name_de: "Geräte Raumübergreifend"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightbulb-group-outline"
      default: []
card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst devices=$json.monthly_consumption$;\nconst usage=devices.reduce((sum,item)=>sum+(read(item.entity)??0),0);\nconst measured=read(\"$total_energy_month$\");\nconst specs=[\n {label:\"Monat\",value:measured===null?usage:measured,unit:\"kWh\"},\n {label:\"Jahr\",value:read(\"$total_energy_year$\"),unit:\"kWh\"},\n {label:\"Monat\",value:read(\"$total_cost_month$\"),unit:\"€\"},\n {label:\"Jahr\",value:read(\"$total_cost_year$\"),unit:\"€\"}\n];\nconst muted=\"var(--secondary-text-color)\";\nconst tile=c=>'<div style=\"min-width:0;padding:13px 15px;border:1px solid var(--divider-color);border-radius:11px;background:var(--ha-card-background,var(--card-background-color))\"><div style=\"font-size:12px;font-weight:500;color:'+muted+';margin-bottom:10px\">'+c.label+'</div><div style=\"display:flex;align-items:baseline;gap:5px;flex-wrap:wrap\"><strong style=\"font-size:clamp(22px,2.3vw,30px);font-weight:690;letter-spacing:-.25px;line-height:1.1;font-variant-numeric:tabular-nums\">'+fmt(c.value)+'</strong><span style=\"font-size:12px;color:'+muted+'\">'+c.unit+'</span></div></div>';\nconst group=(name,items)=>'<section style=\"min-width:0\"><div style=\"font-size:13px;letter-spacing:.5px;font-weight:650;margin:0 0 9px 2px\">'+name+'</div><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">'+items.map(tile).join(\"\")+'</div></section>';\nreturn '<div style=\"color:var(--primary-text-color);font-family:inherit;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:14px;align-items:start\">'+group(\"Verbrauch\",specs.slice(0,2))+group(\"Kosten\",specs.slice(2,4))+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '"panel"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "start"
      cards:
        -
          type: "custom:apexcharts-card"
          requires_input: "historical_consumption_meters"
          graph_span: "210d"
          span:
            end: "month"
          update_interval: "10min"
          cache: true
          header:
            show: true
            title: "Monatsverlauf"
            standard_format: true
          color_list:
            - "#ca2b76"
            - "#388cce"
            - "#dfaa22"
            - "#43ad93"
            - "#9674c6"
            - "#db7950"
            - "#6c86a6"
            - "#ad62a0"
          yaxis:
            - min: 0
              max: "auto"
              decimals: 0
              apex_config:
                title:
                  text: "kWh"
          all_series_config:
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "middle"
            transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
          apex_config:
            chart:
              height: 286
            legend:
              show: true
              position: "bottom"
              fontSize: "11px"
              itemMargin:
                horizontal: 6
                vertical: 3
            plotOptions:
              bar:
                columnWidth: "68%"
            tooltip:
              shared: true
          series:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
        -
          type: "custom:button-card"
          show_name: false
          show_icon: false
          show_state: false
          show_label: false
          tap_action:
            action: "none"
          triggers_update:
            -
              repeat: "monthly_consumption"
              template: "$item.entity$"
            -
              repeat: "monthly_costs"
              template: "$item.entity$"
          custom_fields:
            panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst usage=$json.monthly_consumption$;\nconst prices=$json.monthly_costs$;\nconst history=$json.historical_consumption_meters$;\nconst palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst colored=name=>{const i=history.findIndex(h=>h.name===name);return palette[(i<0?usage.findIndex(r=>r.name===name):i)%palette.length]??\"var(--primary-color)\";};\nconst sorted=usage.map(r=>{const price=prices.find(p=>p.name===r.name);return {name:r.name,entity:r.entity,value:read(r.entity),cost:price?read(price.entity):null,color:colored(r.name)};}).sort((a,b)=>(b.value??-1)-(a.value??-1));\nconst positive=sorted.filter(r=>r.value!==null&&r.value>0);\nconst sum=positive.reduce((s,r)=>s+r.value,0);\nconst circumference=2*Math.PI*49;let offset=0;\nconst arcs=positive.map(r=>{const size=r.value/sum*circumference;const html='<circle cx=\"90\" cy=\"90\" r=\"49\" fill=\"none\" stroke=\"'+r.color+'\" stroke-width=\"23\" stroke-dasharray=\"'+size+' '+circumference+'\" stroke-dashoffset=\"'+(-offset)+'\" transform=\"rotate(-90 90 90)\"><title>'+esc(r.name)+': '+fmt(r.value)+' kWh</title></circle>';offset+=size;return html;}).join(\"\");\nconst chart='<svg viewBox=\"0 0 180 180\" style=\"width:100%;max-width:250px;height:auto;display:block;margin:0 auto\" role=\"img\" aria-label=\"Anteile der erfassten Monatsverbräuche\"><circle cx=\"90\" cy=\"90\" r=\"49\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"23\"/>'+arcs+'<text x=\"90\" y=\"86\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"var(--primary-text-color)\">'+fmt(sum)+'</text><text x=\"90\" y=\"105\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--secondary-text-color)\">kWh / Monat</text></svg>';\nconst cols='<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 48px 68px;gap:6px;font-size:11px;color:var(--secondary-text-color);font-weight:600;padding:0 0 7px;border-bottom:1px solid var(--divider-color)\"><span>Gerät</span><span style=\"text-align:right\">Anteil</span><span style=\"text-align:right\">Kosten</span></div>';\nconst legend=sorted.map(r=>'<div style=\"display:grid;grid-template-columns:10px minmax(0,1fr) 48px 68px;gap:6px;align-items:center;font-size:11px;padding:6px 0;border-bottom:1px solid var(--divider-color)\"><span style=\"width:9px;height:9px;border-radius:3px;background:'+r.color+'\"></span><span style=\"min-width:0;overflow-wrap:anywhere\">'+esc(r.name)+'</span><span style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+(r.value!==null&&sum>0?(100*r.value/sum).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" %\":\"–\")+'</span><span style=\"font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+fmt(r.cost)+' €</span></div>').join(\"\");\nconst totalCosts=sorted.reduce((s,r)=>s+(r.cost??0),0);\nreturn '<section style=\"box-sizing:border-box;min-width:0;color:var(--primary-text-color);font-family:inherit;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;padding:15px 17px\"><div style=\"font-size:16px;font-weight:600;text-align:left;margin:0 0 5px\">Verbrauchsanteile & Kosten</div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:12px\">Erfasste Geräte · aktueller Monat</div><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;align-items:center\">'+(sum>0?chart:'<div style=\"font-size:12px;color:var(--secondary-text-color)\">Keine Verbrauchswerte</div>')+'<div style=\"min-width:0\">'+cols+legend+'<div style=\"display:flex;justify-content:space-between;font-size:12px;font-weight:650;margin-top:9px\"><span>Erfasste Kosten</span><span>'+fmt(totalCosts)+' €</span></div></div></div></section>';\n]]]"
          styles:
            card:
              - border: "none"
              - box-shadow: "none"
              - padding: "0"
              - background: "transparent"
            grid:
              - grid-template-areas: '"panel"'
              - grid-template-columns: "minmax(0,1fr)"
            custom_fields:
              panel:
                - width: "100%"
                - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,215px),1fr))"
        grid-gap: "10px"
        align-items: "start"
      cards:
        -
          type: "vertical-stack"
          cards:
