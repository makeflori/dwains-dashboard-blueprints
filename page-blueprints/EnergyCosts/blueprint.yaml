blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Compact energy dashboard with monthly statistics and device-level consumption and costs."
  description_de: "Kompakte Energieübersicht mit Monatsverlauf sowie Verbrauch und Kosten je Gerät."
  type: "page"
  author: "makeflori"
  version: "1.0"
  icon: "mdi:lightning-bolt-circle"
  custom_cards:
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Total monthly energy"
      name_de: "Verbrauch Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Total monthly cost"
      name_de: "Kosten Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Total yearly energy"
      name_de: "Verbrauch Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Total yearly cost"
      name_de: "Kosten Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Monthly device consumption"
      name_de: "Verbrauch je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Monthly device costs"
      name_de: "Kosten je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    cumulative_meters:
      name: "Lifetime energy meters for monthly trend"
      name_de: "Gesamtverbrauchszähler für Monatsverlauf"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "minmax(0,1.15fr) minmax(0,0.85fr)"
    grid-template-areas: "\"summary summary\" \"trend devices\""
    grid-gap: "12px"
    align-items: "start"
    max-width: "1240px"
    margin: "0 auto"
    mediaquery:
      "(max-width: 900px)":
        grid-template-columns: "minmax(0,1fr)"
        grid-template-areas: "\"summary\" \"trend\" \"devices\""
        grid-gap: "10px"
  cards:
    -
      type: "markdown"
      view_layout:
        grid-area: "summary"
      content: "| Zeitraum | Verbrauch | Kosten |\n|:--|--:|--:|\n| **Monat** | **{{ ('%.2f' | format(states('$total_energy_month$') | float)) | replace('.', ',') if is_number(states('$total_energy_month$')) else '–' }} kWh** | **{{ ('%.2f' | format(states('$total_cost_month$') | float)) | replace('.', ',') if is_number(states('$total_cost_month$')) else '–' }} €** |\n| **Jahr** | **{{ ('%.2f' | format(states('$total_energy_year$') | float)) | replace('.', ',') if is_number(states('$total_energy_year$')) else '–' }} kWh** | **{{ ('%.2f' | format(states('$total_cost_year$') | float)) | replace('.', ',') if is_number(states('$total_cost_year$')) else '–' }} €** |"
      card_mod:
        style: "ha-card { border:1px solid var(--divider-color);border-radius:14px;box-shadow:none; } ha-markdown { font-variant-numeric:tabular-nums; }"
    -
      type: "custom:apexcharts-card"
      view_layout:
        grid-area: "trend"
      header:
        show: true
        title: "Verbrauch · 12 Monate"
        show_states: false
      graph_span: "365d"
      now:
        show: false
      locale: "de"
      stacked: true
      color_list:
        - "#559FD4"
        - "#65BBA6"
        - "#F2B570"
        - "#9685D0"
        - "#DE8982"
        - "#69B8C7"
        - "#D19ABB"
        - "#A9B6C6"
      yaxis:
        -
          min: 0
          decimals: 0
          apex_config:
            title:
              text: "kWh"
      series:
        -
          repeat: "cumulative_meters"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "start"
            fill_raw: "null"
            transform: "return x == null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
            show:
              legend_value: false
      apex_config:
        chart:
          height: 300
          stacked: true
          toolbar:
            show: false
        xaxis:
          type: "datetime"
          labels:
            format: "MMM yy"
            datetimeUTC: false
            hideOverlappingLabels: true
          tickAmount: 12
        tooltip:
          x:
            format: "MMMM yyyy"
          shared: true
        plotOptions:
          bar:
            columnWidth: "60%"
            borderRadius: 2
        legend:
          show: false
        dataLabels:
          enabled: false
        grid:
          borderColor: "var(--divider-color)"
          strokeDashArray: 3
        stroke:
          width: 0
      requires_input: "cumulative_meters"
    -
      type: "markdown"
      view_layout:
        grid-area: "devices"
      content: "{% set energy = $json.monthly_consumption$ -%}\n{% set costs = $json.monthly_costs$ -%}\n{% set ns = namespace(entries=[]) -%}\n{% for e in energy -%}\n{% set value = states(e.entity) | float(-1) -%}\n{% set cost = namespace(text='–') -%}\n{% for c in costs -%}\n{% if c.name == e.name and is_number(states(c.entity)) -%}\n{% set cost.text = ('%.2f' | format(states(c.entity)|float)) | replace('.', ',') -%}\n{% endif -%}\n{% endfor -%}\n{% set ns.entries = ns.entries + [dict(name=e.name, value=value, cost=cost.text)] -%}\n{% endfor -%}\n| Gerät · Monat | kWh | € |\n|:--|--:|--:|\n{% for e in ns.entries | sort(attribute='value', reverse=true) -%}\n| {{ e.name }} | {{ (('%.2f' | format(e.value)) | replace('.', ',')) if e.value >= 0 else '–' }} | {{ e.cost }} |\n{% endfor %}"
      card_mod:
        style: "ha-card { border:1px solid var(--divider-color);border-radius:14px;box-shadow:none; } ha-markdown { font-variant-numeric:tabular-nums; }"
      requires_input: "monthly_consumption"
