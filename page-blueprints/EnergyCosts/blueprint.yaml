blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Energy and cost shares this month and trustworthy monthly trends using native Home Assistant cards."
  description_de: "Verbrauchs- und Kostenanteile im Monat sowie verlässliche Monatsverläufe mit nativen Home-Assistant-Karten."
  type: "page"
  icon: "mdi:lightning-bolt-circle"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "mushroom-template-card"
    - "layout-card"
  input:
    total_energy_month:
      name: "Monthly electricity consumption"
      name_de: "Verbrauch Monat"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly electricity costs"
      name_de: "Kosten Monat"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly electricity consumption"
      name_de: "Verbrauch Jahr"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly electricity costs"
      name_de: "Kosten Jahr"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Device consumption this month"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Device costs this month"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative energy meters with valid statistics"
      name_de: "Gesamtverbrauchszähler mit gültiger Historie"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
    historical_cost_meters:
      name: "Cumulative cost meters (optional)"
      name_de: "Kumulative Kostenzähler mit Historie (optional)"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,158px),1fr))"
        grid-gap: "9px"
      cards:
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_energy_month"
          entity: "$total_energy_month$"
          primary: "Verbrauch · Monat"
          secondary: "{% set v=states('$total_energy_month$') %}{{ (('%.2f'|format(v|float))|replace('.',',')) ~ ' kWh' if is_number(v) else '–' }}"
          icon: "mdi:lightning-bolt"
          color: "teal"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_cost_month"
          entity: "$total_cost_month$"
          primary: "Kosten · Monat"
          secondary: "{% set v=states('$total_cost_month$') %}{{ (('%.2f'|format(v|float))|replace('.',',')) ~ ' €' if is_number(v) else '–' }}"
          icon: "mdi:currency-eur"
          color: "amber"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_energy_year"
          entity: "$total_energy_year$"
          primary: "Verbrauch · Jahr"
          secondary: "{% set v=states('$total_energy_year$') %}{{ (('%.2f'|format(v|float))|replace('.',',')) ~ ' kWh' if is_number(v) else '–' }}"
          icon: "mdi:calendar-month-outline"
          color: "blue"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_cost_year"
          entity: "$total_cost_year$"
          primary: "Kosten · Jahr"
          secondary: "{% set v=states('$total_cost_year$') %}{{ (('%.2f'|format(v|float))|replace('.',',')) ~ ' €' if is_number(v) else '–' }}"
          icon: "mdi:wallet-outline"
          color: "purple"
          tap_action:
            action: "more-info"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,350px),1fr))"
        grid-gap: "12px"
        align-items: "start"
      cards:
        -
          type: "distribution"
          requires_input: "monthly_consumption"
          title: "Verbrauchsanteile · Monat"
          entities:
            -
              repeat: "monthly_consumption"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
        -
          type: "distribution"
          requires_input: "monthly_costs"
          title: "Gerätekostenanteile · Monat"
          entities:
            -
              repeat: "monthly_costs"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
    -
      type: "statistics-graph"
      requires_input: "historical_consumption_meters"
      title: "Monatsverlauf · ausgewählte Geräte"
      entities:
        -
          repeat: "historical_consumption_meters"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
      days_to_show: 365
      period: "month"
      chart_type: "bar"
      stat_types:
        - "change"
      min_y_axis: 0
      hide_legend: false
    -
      type: "statistics-graph"
      requires_input: "historical_cost_meters"
      title: "Historische Gerätekosten · Monat"
      entities:
        -
          repeat: "historical_cost_meters"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
      days_to_show: 365
      period: "month"
      chart_type: "bar"
      stat_types:
        - "change"
      min_y_axis: 0
      hide_legend: false
    -
      type: "conditional"
      conditions:
        -
          condition: "screen"
          media_query: "(max-width: 767px)"
      card:
        type: "custom:button-card"
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: "none"
        styles:
          card:
            -
              height: "calc(76px + env(safe-area-inset-bottom, 0px))"
            -
              background: "transparent"
            -
              box-shadow: "none"
            -
              border: "none"
            -
              padding: "0"
