blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Four energy/cost KPIs, monthly history for all configured devices, an enlarged consumption donut and grouped device costs."
  description_de: "Energie- und Kostenkennzahlen, Monatsverlauf aller Geräte, großes Kreisdiagramm und kompakte Gerätekarten."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "card-mod"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
    kitchen:
      name: "Devices in Küche"
      name_de: "Geräte Küche"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:fridge-outline"
      default: []
    office:
      name: "Devices in Büro"
      name_de: "Geräte Büro"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:desktop-classic"
      default: []
    living:
      name: "Devices in Wohnzimmer"
      name_de: "Geräte Wohnzimmer"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:sofa-outline"
      default: []
    bathroom:
      name: "Devices in Bad"
      name_de: "Geräte Bad"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:washing-machine"
      default: []
    other:
      name: "Devices in Raumübergreifend"
      name_de: "Geräte Raumübergreifend"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightbulb-group-outline"
      default: []
card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_cost_month$"
        - "$total_energy_year$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst devices=$json.monthly_consumption$;\nconst used=devices.reduce((total,x)=>total+(read(x.entity)??0),0);\nconst month=read(\"$total_energy_month$\");\nconst cards=[\n {label:\"Verbrauch · Monat\",value:month===null?used:month,unit:\"kWh\",color:\"#369ed0\"},\n {label:\"Kosten · Monat\",value:read(\"$total_cost_month$\"),unit:\"€\",color:\"#dea81d\"},\n {label:\"Verbrauch · Jahr\",value:read(\"$total_energy_year$\"),unit:\"kWh\",color:\"#43ab96\"},\n {label:\"Kosten · Jahr\",value:read(\"$total_cost_year$\"),unit:\"€\",color:\"#9572ce\"}\n];\nconst muted=\"var(--secondary-text-color)\";\nreturn '<div style=\"box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;font-family:inherit\">'+cards.map(c=>'<div style=\"min-width:0;padding:18px 19px;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-top:3px solid '+c.color+';border-radius:11px;text-align:left\"><div style=\"color:'+muted+';font-size:13px;margin-bottom:12px\">'+c.label+'</div><div style=\"font-size:clamp(23px,2.6vw,34px);font-weight:700;line-height:1.1;white-space:nowrap;letter-spacing:-.3px;font-variant-numeric:tabular-nums\">'+fmt(c.value)+' <span style=\"font-size:13px;font-weight:500;color:'+muted+'\">'+c.unit+'</span></div></div>').join(\"\")+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '\"panel\"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "start"
      cards:

        -
          type: "statistics-graph"
          title: "Monatsverlauf · alle Geräte"
          requires_input: "historical_consumption_meters"
          entities:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
          days_to_show: 180
          period: "month"
          chart_type: "bar"
          stat_types:
            - "change"
          min_y_axis: 0
          hide_legend: false
          card_mod:
            style: "ha-card { box-sizing: border-box; height: 325px; min-height: 0; overflow: hidden; border: 1px solid var(--divider-color); border-radius: 12px; }"
        -
          type: "custom:button-card"
          show_name: false
          show_icon: false
          show_state: false
          show_label: false
          tap_action:
            action: "none"
          triggers_update:
            - "$total_energy_month$"
            - "$total_cost_month$"
            - "$total_energy_year$"
            - "$total_cost_year$"
            -
              repeat: "monthly_consumption"
              template: "$item.entity$"
          custom_fields:
            panel: "[[[\nconst rows=$json.monthly_consumption$;\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst all=rows.map(r=>({name:r.name,value:read(r.entity)}));\nconst arr=all.filter(r=>r.value!==null&&r.value>0).sort((a,b)=>b.value-a.value);\nconst total=arr.reduce((n,r)=>n+r.value,0);\nconst colors=[\"#d42b79\",\"#388dd0\",\"#e1af22\",\"#43b59b\",\"#a27cce\",\"#d67b4c\",\"#6c829f\",\"#ad5f9d\",\"#4e9db0\",\"#b6a45d\"];\nconst circle=2*Math.PI*43;\nlet offset=0;\nconst svgParts=arr.map((r,i)=>{const len=r.value/total*circle;const out='<circle cx=\"85\" cy=\"85\" r=\"43\" fill=\"none\" stroke=\"'+colors[i%colors.length]+'\" stroke-width=\"22\" stroke-dasharray=\"'+len+' '+circle+'\" stroke-dashoffset=\"'+(-offset)+'\" transform=\"rotate(-90 85 85)\"><title>'+esc(r.name)+': '+fmt(r.value)+' kWh ('+(r.value/total*100).toFixed(1)+' %)</title></circle>';offset+=len;return out;}).join(\"\");\nconst svg='<svg viewBox=\"0 0 170 170\" role=\"img\" aria-label=\"Monatliche Verbrauchsanteile aller erfassten Geräte\" style=\"width:min(100%,220px);height:auto;display:block;margin:auto\"><circle cx=\"85\" cy=\"85\" r=\"43\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"22\"/>'+svgParts+'<text x=\"85\" y=\"82\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"var(--primary-text-color)\">'+fmt(total)+'</text><text x=\"85\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--secondary-text-color)\">kWh erfasst</text></svg>';\nconst legend=arr.map((r,i)=>'<div style=\"display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;padding:5px 0\"><span style=\"width:9px;height:9px;background:'+colors[i%colors.length]+';border-radius:3px\"></span><span style=\"min-width:0;overflow-wrap:anywhere\">'+esc(r.name)+'</span><span style=\"font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650\">'+(r.value/total*100).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+' %</span></div>').join(\"\");\nreturn '<section style=\"box-sizing:border-box;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;padding:16px 18px;color:var(--primary-text-color);font-family:inherit\"><div style=\"font-size:16px;font-weight:650;margin-bottom:4px\">Verbrauchsanteile</div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:12px\">Erfasste Geräte · aktueller Monat</div>'+(total?'<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,175px),1fr));gap:12px;align-items:center\">'+svg+'<div style=\"min-width:0\">'+legend+'</div></div>':'<p>Keine Verbrauchsdaten verfügbar</p>')+(all.length!==arr.length?'<div style=\"font-size:11px;margin-top:8px;color:var(--secondary-text-color)\">'+(all.length-arr.length)+' Geräte ohne positiven aktuellen Verbrauch</div>':\"\")+'</section>';\n]]]"
          styles:
            card:
              - border: "none"
              - box-shadow: "none"
              - padding: "0"
              - background: "transparent"
            grid:
              - grid-template-areas: '\"panel\"'
              - grid-template-columns: "minmax(0,1fr)"
            custom_fields:
              panel:
                - width: "100%"
                - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,330px),1fr))"
        grid-gap: "12px"
        align-items: "start"
      cards:
        -
          type: "vertical-stack"
          cards:
            -
