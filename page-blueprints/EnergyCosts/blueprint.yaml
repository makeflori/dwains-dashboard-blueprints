blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Compact energy dashboard with clear KPIs, consumption trends and device costs."
  description_de: "Kompakte Energieübersicht mit Kennzahlen, Verbrauchsverlauf und Gerätekosten."
  type: "page"
  author: "makeflori"
  version: "1.0"
  icon: "mdi:lightning-bolt-circle"
  custom_cards:
    - "mushroom-template-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Total monthly energy"
      name_de: "Verbrauch Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Total monthly cost"
      name_de: "Kosten Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Total yearly energy"
      name_de: "Verbrauch Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Total yearly cost"
      name_de: "Kosten Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Monthly device consumption"
      name_de: "Verbrauch je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Monthly device costs"
      name_de: "Kosten je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    cumulative_meters:
      name: "Lifetime energy meters for monthly trend"
      name_de: "Gesamtverbrauchszähler für Monatsverlauf"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "minmax(0,1fr)"
    grid-template-areas: "\"summary\" \"trendHead\" \"trend\" \"devicesHead\" \"devices\""
    grid-gap: "8px"
    align-items: "start"
    max-width: "1240px"
    margin: "0 auto"
  cards:
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      view_layout:
        grid-area: "summary"
      layout:
        grid-template-columns: "repeat(4,minmax(0,1fr))"
        grid-gap: "9px"
        mediaquery:
          "(max-width: 680px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
            grid-gap: "8px"
      cards:
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_energy_month"
          entity: "$total_energy_month$"
          primary: "Verbrauch · Monat"
          secondary: "{% set s = states('$total_energy_month$') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' kWh' if is_number(s) else '–' }}"
          icon: "mdi:lightning-bolt"
          color: "blue"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_cost_month"
          entity: "$total_cost_month$"
          primary: "Kosten · Monat"
          secondary: "{% set s = states('$total_cost_month$') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' €' if is_number(s) else '–' }}"
          icon: "mdi:currency-eur"
          color: "amber"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_energy_year"
          entity: "$total_energy_year$"
          primary: "Verbrauch · Jahr"
          secondary: "{% set s = states('$total_energy_year$') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' kWh' if is_number(s) else '–' }}"
          icon: "mdi:calendar-month"
          color: "teal"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          requires_input: "total_cost_year"
          entity: "$total_cost_year$"
          primary: "Kosten · Jahr"
          secondary: "{% set s = states('$total_cost_year$') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' €' if is_number(s) else '–' }}"
          icon: "mdi:wallet-outline"
          color: "purple"
          tap_action:
            action: "more-info"
    -
      type: "heading"
      heading: "Verbrauchsverlauf"
      view_layout:
        grid-area: "trendHead"
    -
      type: "custom:apexcharts-card"
      requires_input: "cumulative_meters"
      locale: "de"
      header:
        show: false
      graph_span: "365d"
      now:
        show: false
      stacked: true
      color_list:
        - "#559FD4"
        - "#65BBA6"
        - "#F2B570"
        - "#9685D0"
        - "#DE8982"
        - "#69B8C7"
        - "#D19ABB"
        - "#A9B6C6"
      series:
        -
          repeat: "cumulative_meters"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "start"
            fill_raw: "null"
            transform: "return x == null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
            show:
              legend_value: false
      yaxis:
        -
          min: 0
          decimals: 0
          apex_config:
            title:
              text: "kWh"
      apex_config:
        chart:
          height: 315
          stacked: true
          toolbar:
            show: false
        xaxis:
          type: "datetime"
          labels:
            format: "MMM yy"
            datetimeUTC: false
            hideOverlappingLabels: true
          tickAmount: 12
        tooltip:
          x:
            format: "MMMM yyyy"
          shared: true
        plotOptions:
          bar:
            columnWidth: "60%"
            borderRadius: 2
        legend:
          show: true
          position: "bottom"
          fontSize: "11px"
          onItemClick:
            toggleDataSeries: true
        dataLabels:
          enabled: false
        grid:
          borderColor: "var(--divider-color)"
          strokeDashArray: 3
        stroke:
          width: 0
      view_layout:
        grid-area: "trend"
    -
      type: "heading"
      heading: "Geräte · aktueller Monat"
      view_layout:
        grid-area: "devicesHead"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      requires_input: "monthly_consumption"
      view_layout:
        grid-area: "devices"
      layout:
        grid-template-columns: "repeat(4,minmax(0,1fr))"
        grid-gap: "9px"
        mediaquery:
          "(max-width: 1050px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
          "(max-width: 530px)":
            grid-template-columns: "minmax(0,1fr)"
      cards:
        -
          repeat: "monthly_consumption"
          template:
            type: "custom:mushroom-template-card"
            entity: "$item.entity$"
            primary: "$item.name$"
            secondary: "{% set value = states('$item.entity$') %}\n{% set prices = $json.monthly_costs$ %}\n{% set result = namespace(cost='– €') %}\n{% for c in prices %}\n  {% if c.name == '$item.name$' and is_number(states(c.entity)) %}\n    {% set result.cost = (('%.2f' | format(states(c.entity)|float)) | replace('.', ',')) ~ ' €' %}\n  {% endif %}\n{% endfor %}\n{{ (('%.2f' | format(value|float)) | replace('.', ',')) ~ ' kWh' if is_number(value) else '– kWh' }} · {{ result.cost }}"
            icon: "$item.icon$"
            color: "blue"
            tap_action:
              action: "more-info"
