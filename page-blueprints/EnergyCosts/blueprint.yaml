      custom_fields:
        content: "[[[\n const rows=$json.monthly_consumption$;\n const colors=[\"#4E9FE9\",\"#6BC7AD\",\"#F0B66B\",\"#9C8CE6\",\"#E78584\",\"#62B8D5\",\"#D6A0CB\",\"#9EACB6\"];\n const valid=rows.map((r,i)=>{const s=states[r.entity]; const num=Number(s?.state);return {name:r.name||s?.attributes?.friendly_name||r.entity,v:s&&!['unknown','unavailable'].includes(s.state)&&Number.isFinite(num)&&num>=0?num:null,color:colors[i%colors.length],entity:r.entity};}).filter(r=>r.v!==null);\n const data=[...valid].sort((a,b)=>b.v-a.v);\n const sum=data.reduce((a,r)=>a+r.v,0); const max=Math.max(0,...data.map(r=>r.v));\n const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});\n let position=0;\n const arcs=data.map(r=>{const p=sum>0?r.v/sum*100:0;const start=position;position+=p;return r.color+' '+start.toFixed(2)+'% '+position.toFixed(2)+'%';}).join(',');\n const ring=sum>0?'conic-gradient('+arcs+')':'var(--divider-color)';\n const donut='<div style=\"position:relative;width:155px;height:155px;border-radius:50%;background:'+ring+';flex-shrink:0;display:grid;place-items:center\">'+\n '<div style=\"width:107px;height:107px;background:var(--ha-card-background,var(--card-background-color));border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary-text-color)\">'+\n '<div style=\"font-weight:800;font-size:20px;line-height:1.15\">'+fmt(sum)+'</div><div style=\"font-size:12px;color:var(--secondary-text-color)\">kWh</div></div></div>';\n const items=data.map(r=>{const share=sum>0?100*r.v/sum:0;const width=max>0?100*r.v/max:0;return '<div style=\"margin-top:15px\">'+\n '<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px\"><div style=\"display:flex;align-items:center;gap:9px;min-width:0\">'+\n '<span style=\"width:8px;height:8px;border-radius:3px;flex-shrink:0;background:'+r.color+'\"></span><span style=\"font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--primary-text-color)\">'+r.name+'</span></div>'+\n '<span style=\"font-size:13px;font-weight:700;white-space:nowrap;color:var(--primary-text-color)\">'+fmt(r.v)+' kWh <span style=\"font-size:11px;font-weight:400;color:var(--secondary-text-color)\">('+Math.round(share)+' %)</span></span></div>'+\n '<div style=\"height:8px;background:var(--divider-color);border-radius:10px;overflow:hidden\"><div style=\"height:100%;width:'+width.toFixed(2)+'%;background:'+r.color+';border-radius:10px\"></div></div></div>';}).join('');\n return '<div style=\"padding:23px 22px 26px;box-sizing:border-box\">'+\n '<div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\"><div><div style=\"font-size:18px;font-weight:750;letter-spacing:-.25px;color:var(--primary-text-color)\">Verbrauchsverteilung</div>'+\n '<div style=\"font-size:12px;color:var(--secondary-text-color);margin-top:5px\">Monat · alle ausgewählten Verbraucher</div></div>'+\n '<ha-icon icon=\"mdi:chart-donut\" style=\"color:#4E9FE9;--mdc-icon-size:25px\"></ha-icon></div>'+\n '<div style=\"display:flex;justify-content:center;align-items:center;margin:25px 0 4px\">'+donut+'</div>'+\n '<div style=\"font-size:11px;text-align:center;color:var(--secondary-text-color);margin-bottom:13px\">Summe der ausgewählten Monatswerte</div>'+\n (items||'<div style=\"color:var(--secondary-text-color)\">Keine gültigen Daten vorhanden.</div>')+\n '</div>';\n]]]"
