                    entity: "$item.entity$"
                    show_name: false
                    show_icon: false
                    show_state: false
                    show_label: false
                    triggers_update:
                      -
                        repeat: "monthly_consumption"
                        template: "$item.entity$"
                      -
                        repeat: "monthly_costs"
                        template: "$item.entity$"
                    tap_action:
                      action: "more-info"
                    custom_fields:
                      panel: "[[[\nconst prices=$json.monthly_costs$;\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst itemName=\"$item.name$\",costEntry=prices.find(p=>p.name===itemName),cost=costEntry?read(costEntry.entity):null;\nreturn '<div style=\"box-sizing:border-box;min-height:112px;padding:17px 18px;border:1px solid var(--divider-color);background:var(--ha-card-background,var(--card-background-color));border-radius:11px;color:var(--primary-text-color);text-align:left;font-family:inherit\"><div style=\"font-size:14px;font-weight:600;margin-bottom:13px;overflow-wrap:anywhere\">'+esc(itemName)+'</div><div style=\"display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:9px\"><strong style=\"font-size:29px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums\">'+fmt(read(\"$item.entity$\"))+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color)\">kWh · Monat</span></div><div style=\"font-size:13px;color:var(--secondary-text-color)\">Kosten <strong style=\"font-size:14px;color:var(--primary-text-color);font-variant-numeric:tabular-nums\">'+fmt(cost)+' €</strong> / Monat</div></div>';\n]]]"
