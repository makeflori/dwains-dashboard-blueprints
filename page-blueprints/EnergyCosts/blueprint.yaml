blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Unified energy and cost dashboard with monthly top-five history, cost allocation and compact five-column device cards."
  description_de: "Einheitliche Verbrauchs- und Kostenübersicht, Monatsverlauf mit fünf aktiven Geräten, Kostenverteilung und kompakte Gerätekarten."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
    kitchen:
      name: "Devices in Küche"
      name_de: "Geräte Küche"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:fridge-outline"
      default: []
    office:
      name: "Devices in Büro"
      name_de: "Geräte Büro"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:desktop-classic"
      default: []
    living:
      name: "Devices in Wohnzimmer"
      name_de: "Geräte Wohnzimmer"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:sofa-outline"
      default: []
    bathroom:
      name: "Devices in Bad"
      name_de: "Geräte Bad"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:washing-machine"
      default: []
    other:
      name: "Devices in Raumübergreifend"
      name_de: "Geräte Raumübergreifend"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightbulb-group-outline"
      default: []
card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst devices=$json.monthly_consumption$;\nconst used=devices.reduce((n,x)=>n+(read(x.entity)??0),0);\nconst m=read(\"$total_energy_month$\");\nconst stats=[\n {label:\"Verbrauch · Monat\",value:m===null?used:m,unit:\"kWh\"},\n {label:\"Verbrauch · Jahr\",value:read(\"$total_energy_year$\"),unit:\"kWh\"},\n {label:\"Kosten · Monat\",value:read(\"$total_cost_month$\"),unit:\"€\"},\n {label:\"Kosten · Jahr\",value:read(\"$total_cost_year$\"),unit:\"€\"}\n];\nconst card=x=>'<div style=\"box-sizing:border-box;min-width:0;border:1px solid var(--divider-color);background:var(--ha-card-background,var(--card-background-color));border-radius:12px;padding:17px 18px;text-align:left;min-height:106px\"><div style=\"font-size:13px;font-weight:600;color:var(--secondary-text-color);margin-bottom:13px\">'+x.label+'</div><div style=\"display:flex;align-items:baseline;flex-wrap:wrap;gap:6px\"><strong style=\"font-size:clamp(22px,2.2vw,30px);line-height:1.1;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums\">'+fmt(x.value)+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color)\">'+x.unit+'</span></div></div>';\nreturn '<div style=\"box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:12px;color:var(--primary-text-color);font-family:inherit\">'+stats.map(card).join(\"\")+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '"panel"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:apexcharts-card"
          requires_input: "historical_consumption_meters"
          graph_span: "210d"
          span:
            end: "month"
          update_interval: "10min"
          cache: true
          experimental:
            hidden_by_default: true
          header:
            show: true
            title: "Monatsverlauf"
            standard_format: false
          color_list:
            - "#ca2b76"
            - "#388cce"
            - "#dfaa22"
            - "#43ad93"
            - "#9674c6"
            - "#db7950"
            - "#6c86a6"
            - "#ad62a0"
          yaxis:
            - min: 0
              max: "auto"
              decimals: 0
              apex_config:
                tickAmount: 4
          all_series_config:
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "end"
            transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
          apex_config:
            chart:
              height: 288
              fontFamily: "inherit"
            xaxis:
              type: "datetime"
              labels:
                show: true
                rotate: 0
                hideOverlappingLabels: true
                formatter: "EVAL:function(value,timestamp){if(!Number.isFinite(Number(timestamp)))return value;const d=new Date(Number(timestamp));d.setDate(1);d.setMonth(d.getMonth()-1);return d.toLocaleDateString(\"de-DE\",{month:\"short\",year:\"2-digit\"});}"
              axisTicks:
                show: false
            legend:
              show: true
              position: "bottom"
              fontSize: "11px"
              itemMargin:
                horizontal: 7
                vertical: 5
            plotOptions:
              bar:
                columnWidth: "68%"
            tooltip:
              shared: true
          card_mod:
            style: "ha-card { box-sizing: border-box; min-height: 410px; height: 100%; border-radius: 12px; border: 1px solid var(--divider-color); box-shadow: none; background: var(--ha-card-background, var(--card-background-color)); overflow: hidden; }"
          series:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
                unit: "kWh"
                float_precision: 1
                show:
                  legend_value: true
                  in_legend: true
                  hidden_by_default: "$item.hidden_by_default$"
        -
          type: "custom:button-card"
          show_name: false
          show_icon: false
          show_state: false
          show_label: false
          tap_action:
            action: "none"
          triggers_update:
            -
              repeat: "monthly_consumption"
              template: "$item.entity$"
            -
              repeat: "monthly_costs"
              template: "$item.entity$"
          custom_fields:
            panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst names=$json.monthly_costs$,usage=$json.monthly_consumption$,hist=$json.historical_consumption_meters$;\nconst palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst overall=read(\"$total_cost_month$\");\nconst costData=names.map(item=>({name:item.name,price:read(item.entity),color:palette[Math.max(0,hist.findIndex(h=>h.name===item.name))%palette.length]}));\nconst sum=costData.reduce((n,x)=>n+(x.price??0),0);\nconst overallValid=overall!==null&&overall>=sum-0.01;\nconst remainder=overallValid?Math.max(0,overall-sum):0;\nconst total=overallValid?overall:sum;\nconst entries=costData.map(x=>({...x,value:x.price??0,unknown:x.price===null}));\nif(remainder>=.01)entries.push({name:\"Nicht zugeordnet\",value:remainder,color:\"var(--disabled-text-color,#8d9199)\",unknown:false});\nconst available=entries.filter(x=>x.value>0),circle=2*Math.PI*46;let cursor=0;\nconst arcs=available.map(x=>{const part=x.value/total*circle;const p='<circle cx=\"86\" cy=\"86\" r=\"46\" fill=\"none\" stroke=\"'+x.color+'\" stroke-width=\"23\" stroke-dasharray=\"'+part+' '+circle+'\" stroke-dashoffset=\"'+(-cursor)+'\" transform=\"rotate(-90 86 86)\"><title>'+esc(x.name)+': '+fmt(x.value)+' €</title></circle>';cursor+=part;return p;}).join(\"\");\nconst graph='<svg viewBox=\"0 0 172 172\" style=\"width:100%;max-width:212px;height:auto;display:block;margin:0 auto\" role=\"img\" aria-label=\"Monatliche Kostenverteilung\"><circle cx=\"86\" cy=\"86\" r=\"46\" fill=\"none\" stroke=\"var(--divider-color)\" stroke-width=\"23\"/>'+arcs+'<text x=\"86\" y=\"81\" text-anchor=\"middle\" fill=\"var(--primary-text-color)\" font-weight=\"700\" font-size=\"21\">'+fmt(total)+' €</text><text x=\"86\" y=\"101\" text-anchor=\"middle\" fill=\"var(--secondary-text-color)\" font-size=\"11\">Kosten / Monat</text></svg>';\nconst rows=entries.map(x=>'<div style=\"display:grid;grid-template-columns:9px minmax(0,1fr) 44px 58px;align-items:center;column-gap:6px;font-size:11px;border-bottom:1px solid var(--divider-color);padding:5px 0\"><span style=\"background:'+x.color+';width:8px;height:8px;border-radius:2px\"></span><span style=\"min-width:0;overflow-wrap:anywhere;text-align:left\">'+esc(x.name)+'</span><span style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+(x.unknown||total===0?\"–\":(100*x.value/total).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" %\")+'</span><strong style=\"text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">'+fmt(x.unknown?null:x.value)+' €</strong></div>').join(\"\");\nconst table='<div style=\"min-width:0\"><div style=\"display:grid;grid-template-columns:9px minmax(0,1fr) 44px 58px;column-gap:6px;font-size:11px;color:var(--secondary-text-color);padding-bottom:7px;border-bottom:1px solid var(--divider-color);font-weight:650\"><span></span><span style=\"text-align:left\">Gerät</span><span style=\"text-align:right\">Anteil</span><span style=\"text-align:right\">Kosten</span></div>'+rows+'</div>';\nconst note=overallValid&&remainder>=.01?'<p style=\"font-size:11px;color:var(--secondary-text-color);margin:10px 0 0\">Nicht zugeordnet: Differenz zwischen Gesamtkosten und erfassten Geräten, z. B. Grundpreis oder weitere Verbraucher.</p>':'';\nreturn '<section style=\"box-sizing:border-box;min-width:0;min-height:410px;height:100%;background:var(--ha-card-background,var(--card-background-color));color:var(--primary-text-color);border:1px solid var(--divider-color);border-radius:12px;padding:16px 18px;font-family:inherit;text-align:left\"><div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Kostenverteilung</div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:14px\">Aktueller Monat · Geräte und Gesamtkosten</div><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:14px;align-items:center\">'+(total>0?graph:'<div>Keine Kostendaten</div>')+table+'</div>'+note+'</section>';\n]]]"
          styles:
            card:
              - border: "none"
              - box-shadow: "none"
              - padding: "0"
              - background: "transparent"
            grid:
              - grid-template-areas: '"panel"'
              - grid-template-columns: "minmax(0,1fr)"
            custom_fields:
              panel:
                - width: "100%"
                - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(5,minmax(0,1fr))"
        grid-gap: "10px"
        align-items: "start"
        mediaquery:
          "(max-width: 460px)":
            grid-template-columns: "minmax(0,1fr)"
          "(max-width: 740px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
          "(max-width: 1100px)":
            grid-template-columns: "repeat(3,minmax(0,1fr))"
        align-items: "start"
      cards:
        -
          type: "vertical-stack"
          cards:
            -
              type: "heading"
              heading: "Küche"
