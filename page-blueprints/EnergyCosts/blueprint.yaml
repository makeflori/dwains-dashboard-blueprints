blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Responsive energy KPIs, six-month trend and interactive pie with usage, costs and shares."
  description_de: "Responsive Energiekennzahlen, sechs Monate Verbrauch und interaktive Verteilung mit Verbrauch, Kosten und Anteil."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    base_fee_month:
      name: "Monthly electricity standing charge"
      name_de: "Stromgrundpreis / Monat"
      type: "entity-picker"
      entity_domain: "input_number"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []

card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const st=states[id];const v=Number(st?.state);return st&&![\"unknown\",\"unavailable\"].includes(st.state)&&Number.isFinite(v)?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst meters=$json.monthly_consumption$,measured=read(\"$total_energy_month$\");\nconst data=[\n{title:\"Verbrauch · Monat\",value:measured===null?meters.reduce((s,a)=>s+(read(a.entity)??0),0):measured,unit:\"kWh\",kind:\"energy\"},\n{title:\"Verbrauch · Jahr\",value:read(\"$total_energy_year$\"),unit:\"kWh\",kind:\"energy\"},\n{title:\"Kosten · Monat\",value:read(\"$total_cost_month$\"),unit:\"€\",kind:\"cost\"},\n{title:\"Kosten · Jahr\",value:read(\"$total_cost_year$\"),unit:\"€\",kind:\"cost\"}\n];\nconst symbols={\nenergy:'<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4.5 13H11l-1 9L19.5 10H13V2Z\"/></svg>',\ncost:'<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"/><path d=\"M16 12h5\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/></svg>'\n};\nconst tile=r=>'<section style=\"box-sizing:border-box;min-width:0;height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:7px;padding:14px 17px 15px;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;color:var(--primary-text-color)\"><div style=\"display:flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:26px;flex-shrink:0;display:flex;color:'+(r.kind===\"cost\"?\"#c9952b\":\"var(--primary-color)\")+'\">'+symbols[r.kind]+'</span><span style=\"font-size:13px;font-weight:650;line-height:1.3;white-space:nowrap\">'+r.title+'</span></div><div style=\"display:flex;justify-content:flex-end;align-items:baseline;gap:5px;min-width:0\"><strong style=\"font-size:clamp(24px,2.4vw,32px);font-weight:700;line-height:1.1;letter-spacing:-.4px;font-variant-numeric:tabular-nums\">'+fmt(r.value)+'</strong><span style=\"font-size:12px;white-space:nowrap;color:var(--secondary-text-color)\">'+r.unit+'</span></div></section>';\nreturn '<style>.ec-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;box-sizing:border-box;padding:0 9px}@media(max-width:770px){.ec-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 3px}.ec-summary section{height:100px!important;padding:11px 12px!important}.ec-summary strong{font-size:clamp(19px,5.5vw,26px)!important}.ec-summary span{font-size:11px}}</style><div class=\"ec-summary\" style=\"font-family:inherit\">'+data.map(tile).join(\"\")+'</div>';\n]]]"
      styles:
        card:
          -
            border: "none"
          -
            box-shadow: "none"
          -
            padding: "0"
          -
            background: "transparent"
        grid:
          -
            grid-template-areas: "\"panel\""
          -
            grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            -
              width: "100%"
            -
              min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:vertical-stack-in-card"
          cards:
            -
              type: "custom:button-card"
              name: "Verbrauch · Monatsverlauf"
              show_icon: false
              show_name: true
              show_state: false
              tap_action:
                action: "none"
              styles:
                card:
                  -
                    border: "none"
                  -
                    box-shadow: "none"
                  -
                    background: "transparent"
                  -
                    padding: "15px 18px 7px"
                  -
                    borderRadius: "0px"
                name:
                  -
                    fontSize: "16px"
                  -
                    fontWeight: "650"
                  -
                    color: "var(--primary-text-color)"
                  -
                    textAlign: "left"
            -
              type: "custom:apexcharts-card"
              graph_span: "184d"
              span:
                end: "month"
              update_interval: "10min"
              cache: true
              header:
                show: false
              color_list:
                - "#ca2b76"
                - "#388cce"
                - "#dfaa22"
                - "#43ad93"
                - "#9674c6"
                - "#db7950"
                - "#6c86a6"
                - "#ad62a0"
              all_series_config:
                type: "column"
                statistics:
                  type: "change"
                  period: "month"
                  align: "middle"
                transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
              apex_config:
                chart:
                  height: 290
                  fontFamily: "inherit"
                  toolbar:
                    show: false
                  animations:
                    enabled: false
                  events:
                    mounted: "EVAL:function(ctx){const rows=$json.historical_consumption_meters$;if(ctx&&typeof ctx.hideSeries==='function'){rows.filter(r=>r.hidden_by_default).forEach(r=>ctx.hideSeries(r.name));}}"
                legend:
                  show: true
                  position: "bottom"
                  fontSize: "11px"
                  itemMargin:
                    horizontal: 7
                    vertical: 5
                  onItemClick:
                    toggleDataSeries: true
                plotOptions:
                  bar:
                    columnWidth: "72%"
                    borderRadius: 2
                tooltip:
                  enabled: true
                  shared: false
                  intersect: true
                  x:
                    format: "MMMM yyyy"
                xaxis:
                  type: "datetime"
                  labels:
                    show: false
                  axisTicks:
                    show: false
                  tooltip:
                    enabled: false
                  crosshairs:
                    show: false
                grid:
                  borderColor: "var(--divider-color)"
                  strokeDashArray: 3
                  padding:
                    top: 4
                    bottom: 35
                    left: 7
                    right: 7
                dataLabels:
                  enabled: false
                annotations:
                  xaxis:
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+-5,1),b=new Date(n.getFullYear(),n.getMonth()+-4,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-5,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+-4,1),b=new Date(n.getFullYear(),n.getMonth()+-3,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-4,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-4,1).getTime()})()"
                      borderColor: "var(--divider-color)"
                      strokeDashArray: 3
                      opacity: 0.35
                      label:
                        text: ""
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+-3,1),b=new Date(n.getFullYear(),n.getMonth()+-2,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-3,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-3,1).getTime()})()"
                      borderColor: "var(--divider-color)"
                      strokeDashArray: 3
                      opacity: 0.35
                      label:
                        text: ""
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+-2,1),b=new Date(n.getFullYear(),n.getMonth()+-1,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-2,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-2,1).getTime()})()"
                      borderColor: "var(--divider-color)"
                      strokeDashArray: 3
                      opacity: 0.35
                      label:
                        text: ""
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+-1,1),b=new Date(n.getFullYear(),n.getMonth()+0,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-1,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+-1,1).getTime()})()"
                      borderColor: "var(--divider-color)"
                      strokeDashArray: 3
                      opacity: 0.35
                      label:
                        text: ""
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                    -
                      x: "EVAL:(()=>{const n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+0,1),b=new Date(n.getFullYear(),n.getMonth()+1,1);return Math.round((a.getTime()+b.getTime())/2)})()"
                      borderColor: "transparent"
                      label:
                        text: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+0,1).toLocaleDateString(\"de-DE\",{month:\"short\"})})()"
                        position: "bottom"
                        orientation: "horizontal"
                        offsetY: 20
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                          color: "var(--secondary-text-color)"
                          fontSize: "11px"
                          fontWeight: 400
                          padding:
                            left: 0
                            right: 0
                            top: 0
                            bottom: 0
                    -
                      x: "EVAL:(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+0,1).getTime()})()"
                      borderColor: "var(--divider-color)"
                      strokeDashArray: 3
                      opacity: 0.35
                      label:
                        text: ""
                        borderColor: "transparent"
                        style:
                          background: "transparent"
                yaxis:
                  min: 0
                  forceNiceScale: true
                  showAlways: true
                  showForNullSeries: true
                  tickAmount: 4
                  labels:
                    style:
                      fontSize: "11px"
                      fontWeight: 400
                  title:
                    text: "kWh"
                    style:
                      fontSize: "11px"
                      fontWeight: 400
              series:
                -
                  repeat: "historical_consumption_meters"
                  template:
                    entity: "$item.entity$"
                    name: "$item.name$"
                    unit: "kWh"
                    float_precision: 1
                    show:
                      legend_value: false
                      in_legend: true
              card_mod:
                style: "ha-card {background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;} .apexcharts-xaxistooltip {display:none!important;} .apexcharts-xaxis-annotations text {transform:rotate(-35deg);transform-box:fill-box;transform-origin:center!important;} .apexcharts-tooltip {background:var(--ha-card-background,var(--card-background-color))!important;color:var(--primary-text-color)!important;opacity:1!important;border:1px solid var(--divider-color)!important;}"
          card_mod:
            style: "ha-card {border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));box-shadow:none;overflow:hidden;min-height:420px;}"
        -
          type: "custom:vertical-stack-in-card"
          cards:
            -
              type: "custom:button-card"
              name: "Verbrauch & Kosten · aktueller Monat"
              show_icon: false
              show_name: true
              show_state: false
              tap_action:
                action: "none"
              styles:
                card:
                  -
                    border: "none"
                  -
                    box-shadow: "none"
                  -
                    background: "transparent"
                  -
                    padding: "15px 18px 7px"
                  -
                    borderRadius: "0px"
                name:
                  -
                    fontSize: "16px"
                  -
                    fontWeight: "650"
                  -
                    color: "var(--primary-text-color)"
                  -
                    textAlign: "left"
            -
              type: "custom:layout-card"
              layout_type: "custom:grid-layout"
              layout:
                grid-template-columns: "repeat(auto-fit,minmax(min(100%,260px),1fr))"
                grid-gap: "0px"
                align-items: "center"
              cards:
                -
                  type: "custom:apexcharts-card"
                  chart_type: "pie"
                  update_interval: "1min"
                  cache: true
                  header:
                    show: false
                  color_list:
                    - "#ca2b76"
                    - "#388cce"
                    - "#dfaa22"
                    - "#43ad93"
                    - "#9674c6"
                    - "#db7950"
                    - "#6c86a6"
                    - "#ad62a0"
                    - "#9ea4ac"
                  series:
                    -
                      repeat: "monthly_costs"
                      template:
                        entity: "$item.entity$"
                        name: "$item.name$"
                        unit: "€"
                        float_precision: 2
                        show:
                          in_legend: false
                          legend_value: false
                          datalabels: false
                    -
                      entity: "$base_fee_month$"
                      name: "Grundpreis"
                      unit: "€"
                      float_precision: 2
                      show:
                        in_legend: false
                        legend_value: false
                        datalabels: false
                  apex_config:
                    chart:
                      height: 250
                      fontFamily: "inherit"
                      toolbar:
                        show: false
                      animations:
                        enabled: true
                        speed: 200
                    legend:
                      show: false
                    dataLabels:
                      enabled: false
                    plotOptions:
                      pie:
                        expandOnClick: true
                        customScale: 0.9
                    states:
                      hover:
                        filter:
                          type: "lighten"
                          value: 0.12
                      active:
                        filter:
                          type: "none"
                    tooltip:
                      enabled: true
                      fillSeriesColor: false
                      custom: "EVAL:function({series,seriesIndex,w}){const name=String(w.globals.labels[seriesIndex]||\"\");const value=Number(series[seriesIndex])||0;const total=series.reduce((n,x)=>n+(Number(x)||0),0);const refs=$json.monthly_consumption$;const r=refs.find(x=>x.name===name);const hass=typeof document!==\"undefined\"?document.querySelector(\"home-assistant\")?.hass:null;const raw=r?hass?.states?.[r.entity]?.state:null;const kwh=raw!==null&&raw!==undefined&&raw!==\"\"&&Number.isFinite(Number(raw))?Number(raw).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" kWh\":\"–\";const costs=value.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2})+\" €\";const pct=total>0?(100*value/total).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" %\":\"–\";const clean=x=>String(x).replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\");return '<div style=\"background:var(--ha-card-background,var(--card-background-color));color:var(--primary-text-color);border:1px solid var(--divider-color);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;min-width:145px\"><strong style=\"display:block;margin-bottom:7px\">'+clean(name)+'</strong><div>Verbrauch: '+kwh+'</div><div>Kosten: '+costs+'</div><div>Anteil: '+pct+'</div></div>';}"
                    stroke:
                      width: 1
                      colors:
                        - "var(--card-background-color)"
                  card_mod:
                    style: "ha-card {background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;} .apexcharts-tooltip {opacity:1!important;background:var(--ha-card-background,var(--card-background-color))!important;}"
                -
                  type: "custom:button-card"
                  show_name: false
                  show_icon: false
                  show_state: false
                  show_label: false
                  tap_action:
                    action: "none"
                  triggers_update:
                    -
                      repeat: "monthly_costs"
                      template: "$item.entity$"
                    -
                      repeat: "monthly_consumption"
                      template: "$item.entity$"
                    - "$base_fee_month$"
                    - "$total_cost_month$"
                  custom_fields:
                    panel: "[[[\nconst read=id=>{const st=states[id];const v=Number(st?.state);return st&&![\"unknown\",\"unavailable\"].includes(st.state)&&Number.isFinite(v)?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst usage=$json.monthly_consumption$,costs=$json.monthly_costs$,history=$json.historical_consumption_meters$;\nconst palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\",\"#9ea4ac\"],fixed=read(\"$base_fee_month$\"),sum=read(\"$total_cost_month$\");\nconst items=costs.map(c=>{const i=history.findIndex(h=>h.name===c.name),u=usage.find(x=>x.name===c.name);return {name:c.name,kwh:u?read(u.entity):null,cost:read(c.entity),color:palette[Math.max(0,i)%palette.length]};});\nconst deviceCosts=items.reduce((n,r)=>n+(r.cost??0),0);\nif(fixed!==null)items.push({name:\"Grundpreis\",kwh:null,cost:fixed,color:palette[8]});\nconst assigned=items.reduce((n,r)=>n+(r.cost??0),0);\nif(sum!==null&&sum>assigned+.06)items.push({name:\"Weitere Kosten\",kwh:null,cost:sum-assigned,color:\"#727b88\"});\nconst total=items.reduce((s,r)=>s+(r.cost??0),0);\nconst layout=\"10px minmax(0,1fr) 55px 56px 44px\";\nconst line=(x,head)=>'<div style=\"display:grid;grid-template-columns:'+layout+';gap:6px;align-items:center;padding:'+(head?\"0 0 8px\":\"6px 0\")+';border-bottom:1px solid var(--divider-color);font-size:11px;line-height:1.3\"><span>'+(head?'':'<span style=\"display:block;height:8px;width:8px;border-radius:3px;background:'+x.color+'\"></span>')+'</span><span style=\"text-align:left;min-width:0;overflow-wrap:anywhere\">'+(head?\"Gerät\":esc(x.name))+'</span><span style=\"text-align:right;font-variant-numeric:tabular-nums\">'+(head?\"Verbrauch\":x.kwh===null?\"–\":x.kwh.toLocaleString(\"de-DE\",{maximumFractionDigits:1})+' kWh')+'</span><span style=\"text-align:right;font-variant-numeric:tabular-nums\">'+(head?\"Kosten\":fmt(x.cost)+' €')+'</span><span style=\"text-align:right;font-variant-numeric:tabular-nums\">'+(head?\"Anteil\":x.cost===null||total<=0?\"–\":(100*x.cost/total).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+' %')+'</span></div>';\nreturn '<div style=\"box-sizing:border-box;padding:0 14px 14px 0;font-family:inherit;color:var(--primary-text-color);width:100%;min-width:0\"><div style=\"font-weight:650;color:var(--secondary-text-color)\">'+line({},true)+'</div>'+items.map(x=>line(x,false)).join(\"\")+'</div>';\n]]]"
                  styles:
                    card:
                      -
                        border: "none"
                      -
                        box-shadow: "none"
                      -
                        background: "transparent"
                      -
                        padding: "0"
