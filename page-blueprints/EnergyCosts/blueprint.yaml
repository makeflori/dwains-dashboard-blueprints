                    triggers_update:
                      -
                        repeat: "monthly_consumption"
                        template: "$item.entity$"
                      -
                        repeat: "monthly_costs"
                        template: "$item.entity$"
                    custom_fields:
                      panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst name=\"$item.name$\",costs=$json.monthly_costs$,history=$json.historical_consumption_meters$,palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst color=palette[Math.max(0,history.findIndex(x=>x.name===name))%palette.length];\nconst costItem=costs.find(x=>x.name===name),cost=costItem?read(costItem.entity):null;\nreturn '<div style=\"box-sizing:border-box;min-width:0;min-height:97px;padding:12px 13px;border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));color:var(--primary-text-color);text-align:left;font-family:inherit\"><div style=\"display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:650;margin-bottom:9px\"><span style=\"flex-shrink:0;background:'+color+';width:8px;height:8px;border-radius:2px\"></span><span style=\"overflow-wrap:anywhere\">'+esc(name)+'</span></div><div style=\"display:flex;align-items:baseline;gap:5px;flex-wrap:wrap\"><strong style=\"font-size:22px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums\">'+fmt(read(\"$item.entity$\"))+'</strong><span style=\"font-size:11px;color:var(--secondary-text-color)\">kWh / Monat</span></div><div style=\"margin-top:9px;font-size:11px;color:var(--secondary-text-color)\">Kosten <strong style=\"font-size:12px;color:var(--primary-text-color);font-variant-numeric:tabular-nums\">'+fmt(cost)+' €</strong> / Monat</div></div>';\n]]]"
                    styles:
                      card:
                        - border: "none"
                        - box-shadow: "none"
                        - padding: "0"
                        - background: "transparent"
                      grid:
                        - grid-template-areas: '"panel"'
                        - grid-template-columns: "minmax(0,1fr)"
                      custom_fields:
                        panel:
                          - width: "100%"
                          - min-width: "0"
        -
          type: "vertical-stack"
          cards:
            -
              type: "heading"
              heading: "Büro"
