blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Device energy shares and monthly device costs without slow history queries."
  description_de: "Verbrauchsanteile und Gerätekosten ohne langsame Historienabfragen."
  type: "page"
  author: "makeflori"
  version: "1.0"
  icon: "mdi:lightning-bolt-circle"
  custom_cards:
    - "mushroom-template-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Total monthly energy"
      name_de: "Verbrauch Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Total monthly cost"
      name_de: "Kosten Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Total yearly energy"
      name_de: "Verbrauch Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Total yearly cost"
      name_de: "Kosten Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Monthly device consumption"
      name_de: "Verbrauch je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Monthly device costs"
      name_de: "Kosten je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "minmax(0,0.92fr) minmax(0,1.08fr)"
    grid-template-areas: "\"summary summary\" \"chart devices\""
    grid-gap: "11px"
    align-items: "start"
    max-width: "1240px"
    margin: "0 auto"
    mediaquery:
      "(max-width: 860px)":
        grid-template-columns: "minmax(0,1fr)"
        grid-template-areas: "\"summary\" \"chart\" \"devices\""
        grid-gap: "9px"
  cards:
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      view_layout:
        grid-area: "summary"
      layout:
        grid-template-columns: "repeat(4,minmax(0,1fr))"
        grid-gap: "9px"
        mediaquery:
          "(max-width: 680px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
            grid-gap: "8px"
      cards:
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.energy_month_total"
          primary: "Verbrauch · Monat"
          secondary: "{% set s = states('sensor.energy_month_total') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' kWh' if is_number(s) else '–' }}"
          icon: "mdi:lightning-bolt"
          color: "blue"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.cost_month_total"
          primary: "Kosten · Monat"
          secondary: "{% set s = states('sensor.cost_month_total') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' €' if is_number(s) else '–' }}"
          icon: "mdi:currency-eur"
          color: "amber"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.energy_year_total"
          primary: "Verbrauch · Jahr"
          secondary: "{% set s = states('sensor.energy_year_total') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' kWh' if is_number(s) else '–' }}"
          icon: "mdi:calendar-month"
          color: "teal"
          tap_action:
            action: "more-info"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.cost_year_total"
          primary: "Kosten · Jahr"
          secondary: "{% set s = states('sensor.cost_year_total') %}{{ (('%.2f' | format(s|float)) | replace('.', ',')) ~ ' €' if is_number(s) else '–' }}"
          icon: "mdi:wallet-outline"
          color: "purple"
          tap_action:
            action: "more-info"
    -
      type: "custom:apexcharts-card"
      requires_input: "monthly_consumption"
      chart_type: "donut"
      locale: "de"
      graph_span: "1h"
      update_interval: "5min"
      header:
        show: true
        title: "Verbrauchsanteile · Monat"
        show_states: false
      color_list:
        - "#559FD4"
        - "#65BBA6"
        - "#F2B570"
        - "#9685D0"
        - "#DE8982"
        - "#69B8C7"
        - "#D19ABB"
        - "#A9B6C6"
      series:
        -
          repeat: "monthly_consumption"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
            data_generator: "const n = Number(entity.state); return [[Date.now(), Number.isFinite(n) && n >= 0 ? n : 0]];"
            show:
              legend_value: false
      apex_config:
        chart:
          height: 330
          toolbar:
            show: false
        legend:
          show: true
          position: "bottom"
          fontSize: "11px"
          itemMargin:
            horizontal: 7
            vertical: 4
        dataLabels:
          enabled: false
        plotOptions:
          pie:
            donut:
              size: "64%"
        stroke:
          width: 0
        tooltip:
          x:
            show: false
      view_layout:
        grid-area: "chart"
    -
      type: "vertical-stack"
      cards:
        -
          type: "heading"
          heading: "Geräte · Monat"
        -
          type: "custom:layout-card"
          layout_type: "custom:grid-layout"
          requires_input: "monthly_consumption"
          layout:
            grid-template-columns: "repeat(2,minmax(0,1fr))"
            grid-gap: "8px"
            mediaquery:
              "(max-width: 510px)":
                grid-template-columns: "minmax(0,1fr)"
          cards:
            -
              repeat: "monthly_consumption"
              template:
                type: "custom:mushroom-template-card"
                entity: "$item.entity$"
                primary: "$item.name$"
                secondary: "{% set value = states('$item.entity$') %}\n{% set prices = $json.monthly_costs$ %}\n{% set result = namespace(cost='–') %}\n{% for c in prices %}\n  {% if c.name == '$item.name$' and is_number(states(c.entity)) %}\n    {% set result.cost = (('%.2f' | format(states(c.entity)|float)) | replace('.', ',')) %}\n  {% endif %}\n{% endfor %}\n{{ (('%.2f' | format(value|float)) | replace('.', ',')) if is_number(value) else '–' }} kWh · {{ result.cost }} €"
                icon: "$item.icon$"
                color: "blue"
                tap_action:
                  action: "more-info"
                card_mod:
                  style: "ha-card {border-radius:13px; border:1px solid var(--divider-color);box-shadow:none;}"
      view_layout:
        grid-area: "devices"
