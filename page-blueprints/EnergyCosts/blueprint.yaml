blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Responsive native Home Assistant energy and cost cards with click-to-open entity history."
  description_de: "Responsive Energie- und Kostenkarten mit nativen Entitätsdialogen und Monatsverlauf."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    base_fee_month:
      name: "Monthly electricity standing charge"
      name_de: "Stromgrundpreis / Monat"
      type: "entity-picker"
      entity_domain: "input_number"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []

card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(4,minmax(0,1fr))"
        grid-gap: "12px"
        mediaquery:
          (max-width: 770px):
            grid-template-columns: "repeat(2,minmax(0,1fr))"
            grid-gap: "10px"
      cards:
        -
          type: "custom:button-card"
          entity: "$total_energy_month$"
          name: "Verbrauch · Monat"
          icon: "mdi:lightning-bolt-outline"
          show_name: true
          show_icon: true
          show_state: false
          show_label: false
          tap_action:
            action: "more-info"
            entity: "$total_energy_month$"
          hold_action:
            action: "more-info"
            entity: "$total_energy_month$"
          custom_fields:
            value: "[[[const x=Number(entity?.state);const n=entity&&entity.state!==\"unknown\"&&entity.state!==\"unavailable\"&&Number.isFinite(x)?x.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2}):\"–\";return '<div style=\"white-space:nowrap\"><strong style=\"font-size:clamp(22px,2.2vw,32px);font-weight:720;letter-spacing:-.4px\">'+n+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color);margin-left:6px\">kWh</span></div>';]]]"
          styles:
            card:
              -
                border: "1px solid var(--divider-color)"
              -
                box-shadow: "none"
              -
                border-radius: "12px"
              -
                background: "var(--ha-card-background,var(--card-background-color))"
              -
                height: "108px"
              -
                padding: "12px 15px"
              -
                cursor: "pointer"
            grid:
              -
                grid-template-areas: "\"i n\" \"value value\""
              -
                grid-template-columns: "30px minmax(0,1fr)"
              -
                grid-template-rows: "34px 1fr"
            icon:
              -
                color: "var(--primary-color)"
              -
                width: "25px"
            name:
              -
                justify-self: "start"
              -
                text-align: "left"
              -
                font-size: "13px"
              -
                font-weight: "650"
              -
                white-space: "normal"
              -
                line-height: "1.15"
              -
                color: "var(--primary-text-color)"
            custom_fields:
              value:
                -
                  justify-self: "end"
                -
                  align-self: "end"
                -
                  text-align: "right"
        -
          type: "custom:button-card"
          entity: "$total_energy_year$"
          name: "Verbrauch · Jahr"
          icon: "mdi:lightning-bolt-outline"
          show_name: true
          show_icon: true
          show_state: false
          show_label: false
          tap_action:
            action: "more-info"
            entity: "$total_energy_year$"
          hold_action:
            action: "more-info"
            entity: "$total_energy_year$"
          custom_fields:
            value: "[[[const x=Number(entity?.state);const n=entity&&entity.state!==\"unknown\"&&entity.state!==\"unavailable\"&&Number.isFinite(x)?x.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2}):\"–\";return '<div style=\"white-space:nowrap\"><strong style=\"font-size:clamp(22px,2.2vw,32px);font-weight:720;letter-spacing:-.4px\">'+n+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color);margin-left:6px\">kWh</span></div>';]]]"
          styles:
            card:
              -
                border: "1px solid var(--divider-color)"
              -
                box-shadow: "none"
              -
                border-radius: "12px"
              -
                background: "var(--ha-card-background,var(--card-background-color))"
              -
                height: "108px"
              -
                padding: "12px 15px"
              -
                cursor: "pointer"
            grid:
              -
                grid-template-areas: "\"i n\" \"value value\""
              -
                grid-template-columns: "30px minmax(0,1fr)"
              -
                grid-template-rows: "34px 1fr"
            icon:
              -
                color: "var(--primary-color)"
              -
                width: "25px"
            name:
              -
                justify-self: "start"
              -
                text-align: "left"
              -
                font-size: "13px"
              -
                font-weight: "650"
              -
                white-space: "normal"
              -
                line-height: "1.15"
              -
                color: "var(--primary-text-color)"
            custom_fields:
              value:
                -
                  justify-self: "end"
                -
                  align-self: "end"
                -
                  text-align: "right"
        -
          type: "custom:button-card"
          entity: "$total_cost_month$"
          name: "Kosten · Monat"
          icon: "mdi:wallet-outline"
          show_name: true
          show_icon: true
          show_state: false
          show_label: false
          tap_action:
            action: "more-info"
            entity: "$total_cost_month$"
          hold_action:
            action: "more-info"
            entity: "$total_cost_month$"
          custom_fields:
            value: "[[[const x=Number(entity?.state);const n=entity&&entity.state!==\"unknown\"&&entity.state!==\"unavailable\"&&Number.isFinite(x)?x.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2}):\"–\";return '<div style=\"white-space:nowrap\"><strong style=\"font-size:clamp(22px,2.2vw,32px);font-weight:720;letter-spacing:-.4px\">'+n+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color);margin-left:6px\">€</span></div>';]]]"
          styles:
            card:
              -
                border: "1px solid var(--divider-color)"
              -
                box-shadow: "none"
              -
                border-radius: "12px"
              -
                background: "var(--ha-card-background,var(--card-background-color))"
              -
                height: "108px"
              -
                padding: "12px 15px"
              -
                cursor: "pointer"
            grid:
              -
                grid-template-areas: "\"i n\" \"value value\""
              -
                grid-template-columns: "30px minmax(0,1fr)"
              -
                grid-template-rows: "34px 1fr"
            icon:
              -
                color: "#c9952b"
              -
                width: "25px"
            name:
              -
                justify-self: "start"
