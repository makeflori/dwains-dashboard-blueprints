blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Live power distribution and device-group energy costs, inspired by Madelena's Home Assistant Energy view."
  description_de: "Leistungsverteilung und nach Bereichen geordnete Verbrauchs- und Kostendaten, gestalterisch angelehnt an Madelenas Energieansicht."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "mushroom-template-card"
    - "layout-card"
    - "apexcharts-card"
    - "button-card"
  input:
    total_energy_month:
      name: "Monthly energy total"
      name_de: "Gesamtverbrauch Monat"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly total cost"
      name_de: "Gesamtkosten Monat"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total cost"
      name_de: "Gesamtkosten Jahr"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_costs:
      name: "Monthly costs per device"
      name_de: "Gerätekosten im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    current_power:
      name: "Current power by device (W)"
      name_de: "Momentanleistung je Gerät (W)"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:flash"
      default: []
    kitchen:
      name: "Kitchen devices"
      name_de: "Geräte Küche"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:fridge"
      default: []
    office:
      name: "Office devices"
      name_de: "Geräte Büro"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:desktop-classic"
      default: []
    living:
      name: "Living room devices"
      name_de: "Geräte Wohnbereich"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:sofa"
      default: []
    other:
      name: "Other and multi-room devices"
      name_de: "Weitere und raumübergreifende Geräte"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightbulb"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "repeat(4,minmax(0,1fr))"
    grid-template-areas: "\"flow flow flow flow\" \"stats stats stats donut\" \"kitchen office living other\""
    grid-gap: "11px"
    align-items: "start"
    max-width: "1400px"
    margin: "0 auto"
    mediaquery:
      "(max-width:1050px)":
        grid-template-columns: "repeat(2,minmax(0,1fr))"
        grid-template-areas: "\"flow flow\" \"stats stats\" \"donut donut\" \"kitchen office\" \"living other\""
      "(max-width:620px)":
        grid-template-columns: "minmax(0,1fr)"
        grid-template-areas: "\"flow\" \"stats\" \"donut\" \"kitchen\" \"office\" \"living\" \"other\""
  cards:
    -
      type: "custom:button-card"
      view_layout:
        grid-area: "flow"
      show_icon: false
      show_name: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "sensor.power_current_multimedia_calibrated"
        - "sensor.power_current_kuehlgefrierschrank"
        - "sensor.power_current_hue_total"
        - "sensor.power_current_3d_drucker_steckdose"
        - "sensor.power_current_siebtraeger"
        - "sensor.power_current_schreibtisch_steckdose"
        - "sensor.power_current_waschmaschine"
        - "sensor.power_current_testaufbau"
      custom_fields:
        flow: "[[[\nconst data=$json.current_power$;\nconst names=[\"Küche\",\"Büro\",\"Wohnbereich\",\"Weitere\"],colors=[\"#56b89f\",\"#d34b80\",\"#709cdb\",\"#d9ad5a\"];\nconst group=n=>[\"Kühlgefrierschrank\",\"Siebträger\"].includes(n)?0:[\"3D-Drucker\",\"Schreibtisch-Technik\",\"Testaufbau\"].includes(n)?1:n===\"Multimedia\"?2:3;\nconst rows=data.map(d=>{const s=states[d.entity],v=Number(s?.state);return {name:d.name,group:group(d.name),watts:s&&Number.isFinite(v)&&![\"unknown\",\"unavailable\"].includes(s.state)?Math.max(0,v):0}});\nconst groups=names.map((name,i)=>({name,color:colors[i],list:rows.filter(d=>d.group===i),y:76+i*96}));\nconst sum=rows.reduce((s,r)=>s+r.watts,0),fmt=n=>Math.round(n).toLocaleString(\"de-DE\"),esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\");\nconst heading='<div style=\"color:#d5a8c0;font-size:12px;letter-spacing:1.2px;font-weight:700;margin-bottom:8px\">LEISTUNGSVERTEILUNG · JETZT</div>';\nif(window.innerWidth<770){\nlet html=groups.map(g=>{let n=g.list.reduce((s,r)=>s+r.watts,0);return '<div style=\"display:grid;grid-template-columns:100px 1fr 60px;gap:10px;align-items:center;margin-top:14px;font-size:12px\"><span>'+g.name+'</span><div style=\"height:8px;background:#34323a;border-radius:4px\"><div style=\"height:8px;border-radius:4px;background:'+g.color+';width:'+(sum?100*n/sum:0)+'%\"></div></div><span style=\"text-align:right\">'+fmt(n)+' W</span></div>'}).join('');\nreturn '<div style=\"padding:20px;background:#131217;color:#f6f3f7;border-radius:12px\">'+heading+'<div style=\"font-size:32px;font-weight:750\">'+fmt(sum)+' W</div>'+html+'</div>';\n}\nconst all=groups.flatMap(g=>g.list),ys=[68,106,153,191,229,279,334,372];\nall.forEach((r,i)=>r.y=ys[i]??60+i*40);\nlet paths=\"\",labels=\"\";\nfor(const g of groups){\nlet value=g.list.reduce((s,r)=>s+r.watts,0);\nif(value>0)paths+='<path d=\"M214 229 C320 229 386 '+g.y+' 505 '+g.y+'\" fill=\"none\" stroke=\"'+g.color+'\" stroke-width=\"'+Math.max(2,32*value/Math.max(1,sum))+'\" stroke-opacity=\".65\"/>';\nlabels+='<rect x=\"513\" y=\"'+(g.y-18)+'\" width=\"6\" height=\"36\" rx=\"2\" fill=\"'+g.color+'\"/><text x=\"532\" y=\"'+(g.y-4)+'\" fill=\"#f8f5fa\" font-size=\"15\">'+g.name+'</text><text x=\"532\" y=\"'+(g.y+14)+'\" fill=\"#aba8b4\" font-size=\"12\">'+fmt(value)+' W</text>';\nfor(const d of g.list){\nif(d.watts>0)paths+='<path d=\"M644 '+g.y+' C745 '+g.y+' 765 '+d.y+' 875 '+d.y+'\" fill=\"none\" stroke=\"'+g.color+'\" stroke-opacity=\".7\" stroke-width=\"'+Math.max(2,15*d.watts/Math.max(1,value))+'\"/>';\nlabels+='<rect x=\"880\" y=\"'+(d.y-8)+'\" width=\"5\" height=\"16\" rx=\"2\" fill=\"'+(d.watts?g.color:\"#45444e\")+'\"/><text x=\"895\" y=\"'+(d.y-2)+'\" fill=\"#f3eff5\" font-size=\"13\">'+esc(d.name)+'</text><text x=\"895\" y=\"'+(d.y+14)+'\" fill=\"#a9a6b2\" font-size=\"11\">'+fmt(d.watts)+' W</text>';\n}\n}\nreturn '<div style=\"background:#131217;border:1px solid #34303b;border-radius:13px;padding:16px 21px;box-sizing:border-box;overflow:hidden\">'+heading+'<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1170 415\" width=\"100%\" role=\"img\" aria-label=\"Aufteilung der erfassten Leistung\"><text x=\"52\" y=\"30\" fill=\"#a9a6b2\" font-size=\"12\">ERFASSTE LEISTUNG</text><text x=\"510\" y=\"30\" fill=\"#a9a6b2\" font-size=\"12\">BEREICHE</text><text x=\"880\" y=\"30\" fill=\"#a9a6b2\" font-size=\"12\">GERÄTE</text>'+paths+'<rect x=\"207\" y=\"195\" width=\"8\" height=\"64\" rx=\"2\" fill=\"#d34b80\"/><text x=\"50\" y=\"218\" fill=\"#fff\" font-size=\"36\" font-weight=\"750\">'+fmt(sum)+'</text><text x=\"52\" y=\"239\" fill=\"#aaa7b3\" font-size=\"14\">W aktuell</text>'+labels+'</svg></div>';\n]]]"
      styles:
        card:
          -
            background: "transparent"
          -
            border: "none"
          -
            box-shadow: "none"
          -
            padding: "0"
        grid:
          -
            grid-template-areas: "\"flow\""
          -
            grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          flow:
            -
              width: "100%"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      view_layout:
        grid-area: "stats"
      layout:
        grid-template-columns: "repeat(2,minmax(0,1fr))"
        grid-gap: "9px"
      cards:
        -
          type: "custom:mushroom-template-card"
          primary: "Jetzt · Leistung"
          secondary: "{% set ids=[{\"name\":\"Multimedia\",\"entity\":\"sensor.power_current_multimedia_calibrated\",\"icon\":\"mdi:television\"},{\"name\":\"Kühlgefrierschrank\",\"entity\":\"sensor.power_current_kuehlgefrierschrank\",\"icon\":\"mdi:fridge-outline\"},{\"name\":\"Hue-Beleuchtung\",\"entity\":\"sensor.power_current_hue_total\",\"icon\":\"mdi:lightbulb-group-outline\"},{\"name\":\"3D-Drucker\",\"entity\":\"sensor.power_current_3d_drucker_steckdose\",\"icon\":\"mdi:printer-3d\"},{\"name\":\"Siebträger\",\"entity\":\"sensor.power_current_siebtraeger\",\"icon\":\"mdi:coffee-maker\"},{\"name\":\"Schreibtisch-Technik\",\"entity\":\"sensor.power_current_schreibtisch_steckdose\",\"icon\":\"mdi:desktop-classic\"},{\"name\":\"Waschmaschine\",\"entity\":\"sensor.power_current_waschmaschine\",\"icon\":\"mdi:washing-machine\"},{\"name\":\"Testaufbau\",\"entity\":\"sensor.power_current_testaufbau\",\"icon\":\"mdi:flask-outline\"}] %}{% set ns=namespace(sum=0,seen=0) %}{% for p in ids %}{% if is_number(states(p.entity)) %}{% set ns.sum=ns.sum+(states(p.entity)|float) %}{% set ns.seen=ns.seen+1 %}{% endif %}{% endfor %}{{ ('%.0f'|format(ns.sum)) ~ ' W' if ns.seen>0 else '–' }}"
          icon: "mdi:flash"
          color: "pink"
          tap_action:
            action: "none"
          card_mod:
            style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #d34b80;border-radius:10px;box-shadow:none;}"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.energy_month_total"
          primary: "Monat · Verbrauch"
          secondary: "{% set raw=states('sensor.energy_month_total') %}{{ (('%.2f'|format(raw|float))|replace('.', ',')) ~ ' kWh' if is_number(raw) else '–' }}"
          icon: "mdi:lightning-bolt"
          color: "teal"
          tap_action:
            action: "more-info"
          card_mod:
            style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #56b89f;border-radius:10px;box-shadow:none;}"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.cost_month_total"
          primary: "Monat · Kosten"
          secondary: "{% set raw=states('sensor.cost_month_total') %}{{ (('%.2f'|format(raw|float))|replace('.', ',')) ~ ' €' if is_number(raw) else '–' }}"
          icon: "mdi:currency-eur"
          color: "amber"
          tap_action:
            action: "more-info"
          card_mod:
            style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #d9ad5a;border-radius:10px;box-shadow:none;}"
        -
          type: "custom:mushroom-template-card"
          entity: "sensor.cost_year_total"
          primary: "Jahr · Kosten"
          secondary: "{% set raw=states('sensor.cost_year_total') %}{{ (('%.2f'|format(raw|float))|replace('.', ',')) ~ ' €' if is_number(raw) else '–' }}"
          icon: "mdi:calendar-check-outline"
          color: "purple"
          tap_action:
            action: "more-info"
          card_mod:
            style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #997fc7;border-radius:10px;box-shadow:none;}"
    -
      type: "custom:apexcharts-card"
      chart_type: "donut"
      locale: "de"
      graph_span: "1h"
      update_interval: "1min"
      header:
        show: true
        title: "ANTEILE · JETZT"
        show_states: false
      color_list: []
      series:
        -
          entity: "sensor.power_current_multimedia_calibrated"
          name: "Multimedia"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_kuehlgefrierschrank"
          name: "Kühlgefrierschrank"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_hue_total"
          name: "Hue-Beleuchtung"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_3d_drucker_steckdose"
          name: "3D-Drucker"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_siebtraeger"
          name: "Siebträger"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_schreibtisch_steckdose"
          name: "Schreibtisch-Technik"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_waschmaschine"
          name: "Waschmaschine"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
        -
          entity: "sensor.power_current_testaufbau"
          name: "Testaufbau"
          data_generator: "const n=Number(entity.state);return [[Date.now(),Number.isFinite(n)&&n>0?n:0]];"
          show:
            legend_value: false
      apex_config:
        chart:
          height: 260
          toolbar:
            show: false
        legend:
          show: true
          position: "right"
          fontSize: "11px"
        plotOptions:
          pie:
            donut:
              size: "66%"
              labels:
                show: true
                name:
                  show: true
                value:
                  show: true
                  formatter: "EVAL:function(v){return Number(v).toFixed(0)+' W';}"
                total:
                  show: true
                  label: "Erfasste Leistung"
                  formatter: "EVAL:function(w){return Math.round(w.globals.seriesTotals.reduce((a,b)=>a+b,0))+' W';}"
        dataLabels:
          enabled: false
        stroke:
          width: 0
      card_mod:
        style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #d34b80;border-radius:10px;box-shadow:none;}"
      view_layout:
        grid-area: "donut"
    -
      type: "vertical-stack"
      cards:
        -
          type: "custom:button-card"
          name: "KÜCHE"
          show_icon: false
          show_state: false
          tap_action:
            action: "none"
          styles:
            card:
              -
                background: "transparent"
              -
                border: "none"
              -
                box-shadow: "none"
              -
                padding: "11px 2px 5px"
            name:
              -
                justify-self: "start"
              -
                font-size: "12px"
              -
                font-weight: "750"
              -
                letter-spacing: "1px"
              -
                color: "#56b89f"
        -
          type: "custom:layout-card"
          layout_type: "custom:grid-layout"
          layout:
            grid-template-columns: "minmax(0,1fr)"
            grid-gap: "7px"
          cards:
            -
              type: "custom:mushroom-template-card"
              entity: "sensor.verbrauch_monat_kuehlgefrierschrank"
              primary: "Kühlgefrierschrank"
              secondary: "{% set energy=states('sensor.verbrauch_monat_kuehlgefrierschrank') %}{% set costItems=[{\"name\":\"Multimedia\",\"entity\":\"sensor.cost_month_multimedia\",\"icon\":\"mdi:television\"},{\"name\":\"Kühlgefrierschrank\",\"entity\":\"sensor.cost_month_kuehlgefrierschrank\",\"icon\":\"mdi:fridge-outline\"},{\"name\":\"Hue-Beleuchtung\",\"entity\":\"sensor.cost_month_huetotal\",\"icon\":\"mdi:lightbulb-group-outline\"},{\"name\":\"3D-Drucker\",\"entity\":\"sensor.cost_month_3ddrucker\",\"icon\":\"mdi:printer-3d\"},{\"name\":\"Siebträger\",\"entity\":\"sensor.cost_month_siebtraeger\",\"icon\":\"mdi:coffee-maker\"},{\"name\":\"Schreibtisch-Technik\",\"entity\":\"sensor.cost_month_schreibtisch\",\"icon\":\"mdi:desktop-classic\"},{\"name\":\"Waschmaschine\",\"entity\":\"sensor.cost_month_waschmaschine\",\"icon\":\"mdi:washing-machine\"},{\"name\":\"Testaufbau\",\"entity\":\"sensor.cost_month_testaufbau\",\"icon\":\"mdi:flask-outline\"}] %}{% set powerItems=[{\"name\":\"Multimedia\",\"entity\":\"sensor.power_current_multimedia_calibrated\",\"icon\":\"mdi:television\"},{\"name\":\"Kühlgefrierschrank\",\"entity\":\"sensor.power_current_kuehlgefrierschrank\",\"icon\":\"mdi:fridge-outline\"},{\"name\":\"Hue-Beleuchtung\",\"entity\":\"sensor.power_current_hue_total\",\"icon\":\"mdi:lightbulb-group-outline\"},{\"name\":\"3D-Drucker\",\"entity\":\"sensor.power_current_3d_drucker_steckdose\",\"icon\":\"mdi:printer-3d\"},{\"name\":\"Siebträger\",\"entity\":\"sensor.power_current_siebtraeger\",\"icon\":\"mdi:coffee-maker\"},{\"name\":\"Schreibtisch-Technik\",\"entity\":\"sensor.power_current_schreibtisch_steckdose\",\"icon\":\"mdi:desktop-classic\"},{\"name\":\"Waschmaschine\",\"entity\":\"sensor.power_current_waschmaschine\",\"icon\":\"mdi:washing-machine\"},{\"name\":\"Testaufbau\",\"entity\":\"sensor.power_current_testaufbau\",\"icon\":\"mdi:flask-outline\"}] %}{% set ns=namespace(cost='–',power='–') %}{% for c in costItems %}{% if c.name == 'Kühlgefrierschrank' and is_number(states(c.entity)) %}{% set ns.cost=('%.2f'|format(states(c.entity)|float))|replace('.',',') %}{% endif %}{% endfor %}{% for p in powerItems %}{% if p.name == 'Kühlgefrierschrank' and is_number(states(p.entity)) %}{% set ns.power=('%.0f'|format(states(p.entity)|float)) %}{% endif %}{% endfor %}{{ ns.power }} W jetzt · {{ (('%.2f'|format(energy|float))|replace('.',',')) if is_number(energy) else '–' }} kWh / {{ ns.cost }} € im Monat"
              icon: "mdi:fridge-outline"
              color: "teal"
              multiline_secondary: true
              tap_action:
                action: "more-info"
              card_mod:
                style: "ha-card {background:#191a20!important;color:#f5f3f7!important;--primary-text-color:#f5f3f7;--secondary-text-color:#a8a5b2;border:1px solid #34323b;border-top:2px solid #56b89f;border-radius:10px;box-shadow:none;}"
            -
              type: "custom:mushroom-template-card"
              entity: "sensor.verbrauch_monat_siebtraeger"
              primary: "Siebträger"
              secondary: "{% set energy=states('sensor.verbrauch_monat_siebtraeger') %}{% set costItems=[{\"name\":\"Multimedia\",\"entity\":\"sensor.cost_month_multimedia\",\"icon\":\"mdi:television\"},{\"name\":\"Kühlgefrierschrank\",\"entity\":\"sensor.cost_month_kuehlgefrierschrank\",\"icon\":\"mdi:fridge-outline\"},{\"name\":\"Hue-Beleuchtung\",\"entity\":\"sensor.cost_month_huetotal\",\"icon\":\"mdi:lightbulb-group-outline\"},{\"name\":\"3D-Drucker\",\"entity\":\"sensor.cost_month_3ddrucker\",\"icon\":\"mdi:printer-3d\"},{\"name\":\"Siebträger\",\"entity\":\"sensor.cost_month_siebtraeger\",\"icon\":\"mdi:coffee-maker\"},{\"name\":\"Schreibtisch-Technik\",\"entity\":\"sensor.cost_month_schreibtisch\",\"icon\":\"mdi:desktop-classic\"},{\"name\":\"Waschmaschine\",\"entity\":\"sensor.cost_month_waschmaschine\",\"icon\":\"mdi:washing-machine\"},{\"name\":\"Testaufbau\",\"entity\":\"sensor.cost_month_testaufbau\",\"icon\":\"mdi:flask-outline\"}] %}{% set powerItems=[{\"name\":\"Multimedia\",\"entity\":\"sensor.power_current_multimedia_calibrated\",\"icon\":\"mdi:television\"},{\"name\":\"Kühlgefrierschrank\",\"entity\":\"sensor.power_current_kuehlgefrierschrank\",\"icon\":\"mdi:fridge-outline\"},{\"name\":\"Hue-Beleuchtung\",\"entity\":\"sensor.power_current_hue_total\",\"icon\":\"mdi:lightbulb-group-outline\"},{\"name\":\"3D-Drucker\",\"entity\":\"sensor.power_current_3d_drucker_steckdose\",\"icon\":\"mdi:printer-3d\"},{\"name\":\"Siebträger\",\"entity\":\"sensor.power_current_siebtraeger\",\"icon\":\"mdi:coffee-maker\"},{\"name\":\"Schreibtisch-Technik\",\"entity\":\"sensor.power_current_schreibtisch_steckdose\",\"icon\":\"mdi:desktop-classic\"},{\"name\":\"Waschmaschine\",\"entity\":\"sensor.power_current_waschmaschine\",\"icon\":\"mdi:washing-machine\"},{\"name\":\"Testaufbau\",\"entity\":\"sensor.power_current_testaufbau\",\"icon\":\"mdi:flask-outline\"}] %}{% set ns=namespace(cost='–',power='–') %}{% for c in costItems %}{% if c.name == 'Siebträger' and is_number(states(c.entity)) %}{% set ns.cost=('%.2f'|format(states(c.entity)|float))|replace('.',',') %}{% endif %}{% endfor %}{% for p in powerItems %}{% if p.name == 'Siebträger' and is_number(states(p.entity)) %}{% set ns.power=('%.0f'|format(states(p.entity)|float)) %}{% endif %}{% endfor %}{{ ns.power }} W jetzt · {{ (('%.2f'|format(energy|float))|replace('.',',')) if is_number(energy) else '–' }} kWh / {{ ns.cost }} € im Monat"
              icon: "mdi:coffee-maker"
              color: "teal"
