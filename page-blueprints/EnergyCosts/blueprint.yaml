                text-align: "left"
              -
                font-size: "13px"
              -
                font-weight: "650"
              -
                white-space: "normal"
              -
                line-height: "1.15"
              -
                color: "var(--primary-text-color)"
            custom_fields:
              value:
                -
                  justify-self: "end"
                -
                  align-self: "end"
                -
                  text-align: "right"
        -
          type: "custom:button-card"
          entity: "$total_cost_year$"
          name: "Kosten · Jahr"
          icon: "mdi:wallet-outline"
          show_name: true
          show_icon: true
          show_state: false
          show_label: false
          tap_action:
            action: "more-info"
            entity: "$total_cost_year$"
          hold_action:
            action: "more-info"
            entity: "$total_cost_year$"
          custom_fields:
            value: "[[[const x=Number(entity?.state);const n=entity&&entity.state!==\"unknown\"&&entity.state!==\"unavailable\"&&Number.isFinite(x)?x.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2}):\"–\";return '<div style=\"white-space:nowrap\"><strong style=\"font-size:clamp(22px,2.2vw,32px);font-weight:720;letter-spacing:-.4px\">'+n+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color);margin-left:6px\">€</span></div>';]]]"
          styles:
            card:
              -
                border: "1px solid var(--divider-color)"
              -
                box-shadow: "none"
              -
                border-radius: "12px"
              -
                background: "var(--ha-card-background,var(--card-background-color))"
              -
                height: "108px"
              -
                padding: "12px 15px"
              -
                cursor: "pointer"
            grid:
              -
                grid-template-areas: "\"i n\" \"value value\""
              -
                grid-template-columns: "30px minmax(0,1fr)"
              -
                grid-template-rows: "34px 1fr"
            icon:
              -
                color: "#c9952b"
              -
                width: "25px"
            name:
              -
                justify-self: "start"
              -
                text-align: "left"
              -
                font-size: "13px"
              -
                font-weight: "650"
              -
                white-space: "normal"
              -
                line-height: "1.15"
              -
                color: "var(--primary-text-color)"
            custom_fields:
              value:
                -
                  justify-self: "end"
                -
                  align-self: "end"
                -
                  text-align: "right"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:vertical-stack-in-card"
          cards:
            -
              type: "custom:button-card"
              name: "Verbrauch · Monatsverlauf"
              show_icon: false
              show_name: true
              show_state: false
              tap_action:
                action: "none"
              styles:
                card:
                  -
                    border: "none"
                  -
                    box-shadow: "none"
                  -
                    background: "transparent"
                  -
                    padding: "15px 18px 7px"
                  -
                    borderRadius: "0px"
                name:
                  -
                    fontSize: "16px"
                  -
                    fontWeight: "650"
                  -
                    color: "var(--primary-text-color)"
                  -
                    textAlign: "left"
            -
              type: "custom:apexcharts-card"
              graph_span: "6month"
              span:
                end: "month"
                offset: "-1month"
              update_interval: "10min"
              cache: true
              header:
                show: false
              color_list:
                - "#ca2b76"
                - "#388cce"
                - "#dfaa22"
                - "#43ad93"
                - "#9674c6"
                - "#db7950"
                - "#6c86a6"
                - "#ad62a0"
              all_series_config:
                type: "column"
                statistics:
                  type: "change"
                  period: "month"
                  align: "start"
                transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
              apex_config:
                chart:
                  height: 290
                  fontFamily: "inherit"
                  toolbar:
                    show: false
                  animations:
                    enabled: false
                  events:
                    mounted: "EVAL:function(ctx){const rows=$json.historical_consumption_meters$;if(ctx&&typeof ctx.hideSeries==='function'){rows.filter(r=>r.hidden_by_default).forEach(r=>ctx.hideSeries(r.name));}}"
                    mouseLeave: "EVAL:function(event,context){const node=context?.el?.querySelector('.apexcharts-tooltip');if(node){node.style.opacity='0';node.style.visibility='hidden';}}"
                    dataPointMouseLeave: "EVAL:function(event,context){const node=context?.el?.querySelector('.apexcharts-tooltip');if(node){node.style.opacity='0';node.style.visibility='hidden';}}"
                legend:
                  show: true
                  position: "top"
                  fontSize: "11px"
                  itemMargin:
                    horizontal: 7
                    vertical: 5
                  onItemClick:
                    toggleDataSeries: true
                plotOptions:
                  bar:
                    columnWidth: "86%"
                    borderRadius: 2
                tooltip:
                  enabled: true
                  shared: false
                  intersect: true
                  followCursor: false
                  hideDelay: 0
                  x:
                    format: "MMMM yyyy"
                xaxis:
                  type: "datetime"
                  tickAmount: 6
                  labels:
                    show: true
                    rotate: -28
                    rotateAlways: true
                    hideOverlappingLabels: true
                    format: "MMM yy"
                    datetimeUTC: false
                    style:
                      fontSize: "11px"
                      fontWeight: 400
                  axisTicks:
                    show: false
                  crosshairs:
                    show: false
                  tooltip:
                    enabled: false
                grid:
                  borderColor: "var(--divider-color)"
                  strokeDashArray: 3
                  padding:
                    top: 4
                    bottom: 5
                    left: 2
                    right: 2
                dataLabels:
                  enabled: false
                yaxis:
                  min: 0
                  forceNiceScale: false
                  tickAmount: 4
                  max: "EVAL:function(max){return Number.isFinite(max)&&max>0?Math.ceil(max*1.1*10)/10:1;}"
                  labels:
                    style:
                      fontSize: "11px"
                      fontWeight: 400
                  title:
                    text: "kWh"
                    style:
                      fontSize: "11px"
                      fontWeight: 400
              series:
                -
                  repeat: "historical_consumption_meters"
                  template:
                    entity: "$item.entity$"
                    name: "$item.name$"
                    unit: "kWh"
                    float_precision: 1
                    show:
                      legend_value: false
                      in_legend: true
              card_mod:
                style: "ha-card{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}.apexcharts-xaxistooltip{display:none!important}.apexcharts-tooltip{pointer-events:none!important;background:var(--ha-card-background,var(--card-background-color))!important;color:var(--primary-text-color)!important;border:1px solid var(--divider-color)!important;box-shadow:0 3px 12px rgba(0,0,0,.13)!important}"
          card_mod:
            style: "ha-card {border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));box-shadow:none;overflow:hidden;min-height:420px;}"
        -
          type: "custom:vertical-stack-in-card"
          cards:
            -
              type: "custom:button-card"
              name: "Verbrauch & Kosten · aktueller Monat"
              show_icon: false
              show_name: true
              show_state: false
              tap_action:
                action: "none"
              styles:
                card:
                  -
                    border: "none"
                  -
                    box-shadow: "none"
                  -
                    background: "transparent"
                  -
                    padding: "15px 18px 7px"
                  -
                    borderRadius: "0px"
                name:
                  -
                    fontSize: "16px"
                  -
                    fontWeight: "650"
                  -
                    color: "var(--primary-text-color)"
                  -
                    textAlign: "left"
            -
              type: "custom:layout-card"
              layout_type: "custom:grid-layout"
              layout:
                grid-template-columns: "minmax(0, 34%) minmax(0, 1fr)"
                grid-gap: "14px"
                align-items: "center"
                mediaquery:
                  (max-width: 980px):
                    grid-template-columns: "minmax(0,1fr)"
              cards:
                -
                  type: "custom:apexcharts-card"
                  chart_type: "pie"
                  update_interval: "1min"
                  cache: true
                  header:
                    show: false
                  color_list:
                    - "#ca2b76"
                    - "#388cce"
                    - "#dfaa22"
                    - "#43ad93"
                    - "#9674c6"
                    - "#db7950"
                    - "#6c86a6"
                    - "#ad62a0"
                    - "#9ea4ac"
                  series:
                    -
                      repeat: "monthly_costs"
                      template:
                        entity: "$item.entity$"
                        name: "$item.name$"
                        unit: "€"
                        float_precision: 2
                        show:
                          legend_value: false
                          in_legend: false
                          datalabels: false
                    -
                      entity: "$base_fee_month$"
                      name: "Grundpreis"
                      unit: "€"
                      float_precision: 2
                      show:
                        legend_value: false
                        in_legend: false
                        datalabels: false
                  apex_config:
                    chart:
                      height: 185
                      fontFamily: "inherit"
                      toolbar:
                        show: false
                      animations:
                        enabled: true
                        speed: 200
                      events:
                        dataPointSelection: "EVAL:function(event,chartContext,config){const index=config&&Number.isInteger(config.dataPointIndex)?config.dataPointIndex:-1;if(index<0)return;const matched=[];const visited=new WeakSet();function crawl(root){if(!root||visited.has(root))return;visited.add(root);if(typeof root.querySelectorAll!==\"function\")return;root.querySelectorAll('[data-ec-cost-index]').forEach(el=>matched.push(el));root.querySelectorAll('*').forEach(el=>{if(el.shadowRoot)crawl(el.shadowRoot);});}crawl(document);for(const el of matched){el.dataset.ecSelected=String(Number(el.dataset.ecCostIndex)===index);}const chosen=matched.find(el=>el.dataset?.ecCostIndex===String(index));if(chosen&&typeof chosen.scrollIntoView===\"function\")chosen.scrollIntoView({behavior:\"smooth\",block:\"nearest\"});}"
                      width: "100%"
                    legend:
                      show: false
                    dataLabels:
                      enabled: false
                    plotOptions:
                      pie:
                        expandOnClick: false
                        customScale: 0.72
                    states:
                      hover:
                        filter:
                          type: "lighten"
                          value: 0.1
                      active:
                        filter:
                          type: "none"
                    tooltip:
                      enabled: false
                    stroke:
                      width: 1
                      colors:
                        - "var(--card-background-color)"
                  card_mod:
                    style: "ha-card{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;border:0!important;box-shadow:none!important;background:transparent!important}.apexcharts-canvas,.apexcharts-svg{max-width:100%!important;}"
                -
                  type: "vertical-stack"
                  cards:
                    -
                      type: "custom:button-card"
                      show_name: true
                      name: "Gerät"
                      show_icon: false
                      show_state: false
                      tap_action:
                        action: "none"
                      custom_fields:
                        dot: ""
                        kwh: "kWh"
                        cost: "€"
                        share: "%"
                      styles:
                        card:
                          -
                            background: "transparent"
                          -
                            border: "none"
                          -
                            border-bottom: "1px solid var(--divider-color)"
                          -
                            border-radius: "0px"
                          -
                            box-shadow: "none"
                          -
                            padding: "5px 0 8px"
                          -
                            height: "auto"
                        grid:
                          -
                            grid-template-areas: "\"dot n kwh cost share\""
                          -
                            grid-template-columns: "9px minmax(0,1fr) 43px 55px 42px"
                          -
                            grid-template-rows: "minmax(19px,auto)"
                          -
                            column-gap: "6px"
                        name:
                          -
                            justify-self: "start"
                          -
                            font-weight: "650"
                          -
                            font-size: "11px"
                          -
                            color: "var(--secondary-text-color)"
                        custom_fields:
                          dot:

                          kwh:
                            -
                              justify-self: "end"
                            -
                              font-weight: "650"
                            -
                              font-size: "11px"
                            -
                              color: "var(--secondary-text-color)"
                          cost:
                            -
                              justify-self: "end"
                            -
                              font-weight: "650"
                            -
                              font-size: "11px"
                            -
                              color: "var(--secondary-text-color)"
                          share:
                            -
                              justify-self: "end"
                            -
                              font-weight: "650"
                            -
                              font-size: "11px"
                            -
                              color: "var(--secondary-text-color)"
                    -
                      repeat: "monthly_consumption"
                      template:
                        type: "custom:button-card"
                        entity: "$item.entity$"
                        name: "$item.name$"
                        show_icon: false
                        show_name: true
                        show_state: false
                        show_label: false
                        tap_action:
                          action: "more-info"
                          entity: "$item.entity$"
                        hold_action:
                          action: "more-info"
                          entity: "$item.entity$"
                        triggers_update:
                          -
                            repeat: "monthly_costs"
                            template: "$item.entity$"
                          - "$total_cost_month$"
                        custom_fields:
                          dot: "[[[const palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\",\"#9ea4ac\"];const items=$json.monthly_consumption$;const i=items.findIndex(x=>x.entity===entity?.entity_id);return '<span data-ec-cost-index=\"'+i+'\" style=\"width:8px;height:8px;border-radius:2px;display:block;background:'+palette[Math.max(0,i)%palette.length]+'\"></span>';]]]"
                          kwh: "[[[const n=Number(entity?.state);return entity&&![\"unknown\",\"unavailable\"].includes(entity.state)&&Number.isFinite(n)?n.toLocaleString(\"de-DE\",{maximumFractionDigits:1}):\"–\";]]]"
                          cost: "[[[const items=$json.monthly_costs$;const found=items.find(x=>x.name===\"$item.name$\");const s=found?states[found.entity]:null;const n=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(n)?n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2})+\" €\":\"–\";]]]"
                          share: "[[[const items=$json.monthly_costs$;const found=items.find(x=>x.name===\"$item.name$\");const s=found?states[found.entity]:null;const total=Number(states[\"$total_cost_month$\"]?.state),n=Number(s?.state);return s&&Number.isFinite(n)&&Number.isFinite(total)&&total>0?(n/total*100).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" %\":\"–\";]]]"
                        styles:
                          card:
                            -
                              background: "transparent"
                            -
                              border: "none"
                            -
                              border-bottom: "1px solid var(--divider-color)"
                            -
                              box-shadow: "none"
                            -
                              border-radius: "0px"
                            -
                              padding: "6px 0"
                            -
