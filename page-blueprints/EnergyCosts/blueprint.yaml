                    styles:
                      card:
                        - border: "none"
                        - box-shadow: "none"
                        - padding: "0"
                        - background: "transparent"
                      grid:
                        - grid-template-areas: '"panel"'
                        - grid-template-columns: "minmax(0,1fr)"
                      custom_fields:
                        panel:
                          - width: "100%"
                          - min-width: "0"
        -
