blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Responsive energy overview with comparison charts and carefully selected long-term data."
  description_de: "Übersicht über Stromverbrauch, Kosten, Geräteanteile und geprüfte Langzeitverläufe."
  icon: "mdi:lightning-bolt-circle"
  author: "makeflori"
  version: "1.1.0"
  type: "page"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    title:
      name: "Page title"
      name_de: "Seitentitel"
      type: "text-field"
      default: "Energie & Kosten"
    total_energy_month:
      name: "Monthly device energy total"
      name_de: "Verbrauch Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Monthly device costs including base fee"
      name_de: "Kosten Monat inkl. Grundpreis"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly device energy total"
      name_de: "Verbrauch Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly device costs including base fee"
      name_de: "Kosten Jahr inkl. Grundpreis"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current monthly energy by device"
      name_de: "Monatsverbrauch nach Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current monthly cost by device"
      name_de: "Monatliche Gerätekosten"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    cumulative_meters:
      name: "Verified cumulative energy meters for history"
      name_de: "Geprüfte Gesamtverbrauchszähler für Verlauf"
      description: "Only include meters with verified nonnegative monthly long-term statistics."
      description_de: "Nur Zähler mit geprüften, nichtnegativen Monatsstatistiken auswählen."
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-timeline-variant"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "minmax(0,1fr) minmax(0,1fr)"
    grid-template-areas: "\"hero hero\" \"summary summary\" \"energy costs\" \"history history\" \"note note\""
    grid-gap: "14px"
    align-items: "start"
    max-width: "1540px"
    margin: "0 auto"
    mediaquery:
      "(max-width: 950px)":
        grid-template-columns: "minmax(0,1fr)"
        grid-template-areas: "\"hero\" \"summary\" \"energy\" \"costs\" \"history\" \"note\""
        grid-gap: "11px"
  cards:
    -
      type: "custom:button-card"
      show_icon: false
      show_name: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update: "$entities.monthly_consumption$"
      custom_fields:
        content: "[[[\n const count=$json.monthly_consumption$.length;\n return '<div style=\"box-sizing:border-box;padding:clamp(22px,4vw,34px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(125deg,rgba(62,145,218,.15),rgba(98,192,175,.07) 65%,transparent)\">'+\n '<div style=\"min-width:0\"><div style=\"font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--secondary-text-color);font-weight:700;margin-bottom:9px\">HOME ASSISTANT · ENERGIE</div>'+\n '<div style=\"font-size:clamp(26px,4vw,39px);line-height:1.15;letter-spacing:-.8px;font-weight:750;color:var(--primary-text-color)\">Energie im Blick</div>'+\n '<div style=\"font-size:14px;line-height:1.6;color:var(--secondary-text-color);margin-top:10px\">Verbrauch, Kosten und die größten Stromverbraucher an einem Ort.</div></div>'+\n '<div style=\"display:flex;align-items:center;gap:10px;background:rgba(77,159,233,.12);padding:12px 16px;border-radius:14px;color:var(--primary-text-color)\"><ha-icon icon=\"mdi:lightning-bolt\" style=\"color:#4E9FE9;--mdc-icon-size:26px\"></ha-icon>'+\n '<div style=\"font-size:12px;line-height:1.35\"><strong style=\"font-size:18px\">'+count+'</strong><br><span style=\"color:var(--secondary-text-color)\">erfasste Verbraucher</span></div></div></div>';\n]]]"
      styles:
        card:
          -
            background: "var(--ha-card-background,var(--card-background-color))"
          -
            border: "1px solid var(--divider-color)"
          -
            border-radius: "20px"
          -
            box-shadow: "none"
          -
            padding: "0"
          -
            overflow: "hidden"
          -
            color: "var(--primary-text-color)"
        grid:
          -
            grid-template-areas: "\"content\""
          -
            grid-template-columns: "1fr"
          -
            grid-template-rows: "1fr"
        custom_fields:
          content:
            -
              width: "100%"
            -
              height: "100%"
      view_layout:
        grid-area: "hero"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      view_layout:
        grid-area: "summary"
      layout:
        grid-template-columns: "repeat(4,minmax(0,1fr))"
        grid-gap: "12px"
        mediaquery:
          "(max-width: 800px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
            grid-gap: "9px"
      cards:
        -
          type: "custom:button-card"
          show_icon: false
          show_name: false
          show_state: false
          show_label: false
          tap_action:
            action: "more-info"
          triggers_update: "$total_energy_month$"
          custom_fields:
            content: "[[[\n const src=states['$total_energy_month$'];\n const val=Number(src?.state);\n const valid=src&&src.state!=='unknown'&&src.state!=='unavailable'&&Number.isFinite(val);\n const unit=src?.attributes?.unit_of_measurement || \"kWh\";\n const text=valid?val.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+unit:'–';\n return '<div style=\"padding:20px 18px 18px;box-sizing:border-box;min-height:142px\">'+\n '<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\"><div style=\"font-size:12px;font-weight:600;color:var(--secondary-text-color)\">Verbrauch · Monat</div>'+\n '<div style=\"width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#4E9FE922;color:#4E9FE9\"><ha-icon icon=\"mdi:lightning-bolt\" style=\"--mdc-icon-size:21px\"></ha-icon></div></div>'+\n '<div style=\"font-size:clamp(23px,2.4vw,30px);font-weight:760;letter-spacing:-.7px;margin-top:17px;white-space:nowrap;color:var(--primary-text-color)\">'+text+'</div>'+\n '<div style=\"font-size:11px;color:var(--secondary-text-color);margin-top:5px\">Erfasste Geräte</div></div>';\n]]]"
