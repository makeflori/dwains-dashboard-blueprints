blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Compact energy dashboard with monthly statistics and device-level consumption and costs."
  description_de: "Kompakte Energieübersicht mit Monatsverlauf sowie Verbrauch und Kosten je Gerät."
  type: "page"
  author: "makeflori"
  version: "1.0"
  icon: "mdi:lightning-bolt-circle"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Total monthly energy"
      name_de: "Verbrauch Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_month:
      name: "Total monthly cost"
      name_de: "Kosten Monat gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Total yearly energy"
      name_de: "Verbrauch Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Total yearly cost"
      name_de: "Kosten Jahr gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Monthly device consumption"
      name_de: "Verbrauch je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Monthly device costs"
      name_de: "Kosten je Gerät im Monat"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    cumulative_meters:
      name: "Lifetime energy meters for monthly trend"
      name_de: "Gesamtverbrauchszähler für Monatsverlauf"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
card:
  type: "custom:layout-card"
  layout_type: "custom:grid-layout"
  layout:
    grid-template-columns: "minmax(0,1.15fr) minmax(0,0.85fr)"
    grid-template-areas: "\"summary summary\" \"trend devices\""
    grid-gap: "12px"
    align-items: "start"
    max-width: "1240px"
    margin: "0 auto"
    mediaquery:
      "(max-width: 900px)":
        grid-template-columns: "minmax(0,1fr)"
        grid-template-areas: "\"summary\" \"trend\" \"devices\""
        grid-gap: "10px"
  cards:
    -
      type: "custom:button-card"
      view_layout:
        grid-area: "summary"
      show_icon: false
      show_name: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_cost_month$"
        - "$total_energy_year$"
        - "$total_cost_year$"
      custom_fields:
        body: "[[[\n const src=[\n {label:'Monat · Verbrauch',id:'$total_energy_month$',unit:'kWh'},\n {label:'Monat · Kosten',id:'$total_cost_month$',unit:'€'},\n {label:'Jahr · Verbrauch',id:'$total_energy_year$',unit:'kWh'},\n {label:'Jahr · Kosten',id:'$total_cost_year$',unit:'€'}\n ];\n const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});\n const html=src.map((item,i)=>{\n const s=states[item.id];\n const n=Number(s?.state);\n const value=s&&!['unknown','unavailable'].includes(s.state)&&Number.isFinite(n)?fmt(n):'–';\n return '<div style=\"min-width:0;padding:17px 19px;box-sizing:border-box;border-right:'+(i===3?'none':'1px solid var(--divider-color)')+'\">'+\n '<div style=\"font-size:11px;letter-spacing:.1px;color:var(--secondary-text-color);white-space:nowrap\">'+item.label+'</div>'+\n '<div style=\"margin-top:6px;display:flex;align-items:baseline;gap:5px;white-space:nowrap;color:var(--primary-text-color)\">'+\n '<span style=\"font-size:clamp(19px,2vw,24px);font-weight:720;letter-spacing:-.3px;font-variant-numeric:tabular-nums\">'+value+'</span>'+\n '<span style=\"font-size:12px;font-weight:500;color:var(--secondary-text-color)\">'+item.unit+'</span></div></div>';\n }).join('');\n return '<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-width:0\" class=\"ec-stats\">'+html+\n '<style>@media(max-width:690px){.ec-stats{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.ec-stats>div:nth-child(2){border-right:0 !important}.ec-stats>div:nth-child(-n+2){border-bottom:1px solid var(--divider-color)}}@media(max-width:370px){.ec-stats>div{padding:14px 11px !important}.ec-stats>div span{font-size:18px}}</style></div>';\n]]]"
      styles:
        card:
          -
            background: "var(--ha-card-background,var(--card-background-color))"
          -
            border: "1px solid var(--divider-color)"
          -
            border-radius: "14px"
          -
            box-shadow: "none"
          -
            padding: "0"
          -
            overflow: "hidden"
        grid:
          -
            grid-template-areas: "\"body\""
          -
            grid-template-columns: "1fr"
          -
            grid-template-rows: "auto"
        custom_fields:
          body:
            -
              width: "100%"
            -
              min-width: "0"
    -
      type: "custom:apexcharts-card"
      view_layout:
        grid-area: "trend"
      requires_input: "cumulative_meters"
      header:
        show: true
        title: "Verbrauch · 12 Monate"
        show_states: false
      graph_span: "365d"
      now:
        show: false
      locale: "de"
      stacked: true
      color_list:
        - "#559FD4"
        - "#65BBA6"
        - "#F2B570"
        - "#9685D0"
        - "#DE8982"
        - "#69B8C7"
        - "#D19ABB"
        - "#A9B6C6"
      yaxis:
        -
          min: 0
          decimals: 0
          apex_config:
            title:
              text: "kWh"
      series:
        -
          repeat: "cumulative_meters"
          template:
            entity: "$item.entity$"
            name: "$item.name$"
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "start"
            fill_raw: "null"
            transform: "return x == null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
            show:
              legend_value: false
      apex_config:
        chart:
          height: 300
          stacked: true
          toolbar:
            show: false
        xaxis:
          type: "datetime"
          labels:
            format: "MMM yy"
            datetimeUTC: false
            hideOverlappingLabels: true
          tickAmount: 12
        tooltip:
          x:
            format: "MMMM yyyy"
          shared: true
        plotOptions:
          bar:
            columnWidth: "60%"
            borderRadius: 2
        legend:
          show: false
        dataLabels:
          enabled: false
        grid:
          borderColor: "var(--divider-color)"
          strokeDashArray: 3
        stroke:
          width: 0
    -
      type: "custom:button-card"
      view_layout:
        grid-area: "devices"
      requires_input: "monthly_consumption"
      show_icon: false
      show_name: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update: "[[[ return $json.monthly_consumption$.concat($json.monthly_costs$).map(r=>r.entity); ]]]"
      custom_fields:
        body: "[[[\n const rows=$json.monthly_consumption$;\n const costRows=$json.monthly_costs$;\n const palette=[\"#559FD4\",\"#65BBA6\",\"#F2B570\",\"#9685D0\",\"#DE8982\",\"#69B8C7\",\"#D19ABB\",\"#A9B6C6\"];\n const normalize=x=>String(x||'').toLocaleLowerCase('de-DE').replace(/[^a-z0-9äöüß]/g,'');\n const escape=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const get=id=>{const s=states[id],n=Number(s?.state);return !s||['unknown','unavailable'].includes(s.state)||!Number.isFinite(n)||n<0?null:n;};\n const prices=new Map(costRows.map(r=>[normalize(r.name),get(r.entity)]));\n const data=rows.map((r,i)=>({name:r.name||states[r.entity]?.attributes?.friendly_name||r.entity,energy:get(r.entity),cost:prices.get(normalize(r.name)),color:palette[i%palette.length]}))\n .sort((a,b)=>(b.energy??-1)-(a.energy??-1));\n const max=Math.max(0,...data.map(x=>x.energy??0));\n const fmt=n=>n===null||n===undefined?'–':n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});\n const narrow=window.innerWidth<650;\n const cols=narrow?'minmax(0,1fr) 76px 66px':'minmax(0,1fr) 110px 93px';\n const header='<div style=\"display:grid;grid-template-columns:'+cols+';align-items:center;gap:9px;padding:0 0 12px;border-bottom:1px solid var(--divider-color)\">'+\n '<span style=\"font-size:14px;font-weight:680;color:var(--primary-text-color)\">Geräte · Monat</span>'+\n '<span style=\"font-size:11px;color:var(--secondary-text-color);text-align:right\">kWh</span>'+\n '<span style=\"font-size:11px;color:var(--secondary-text-color);text-align:right\">€</span></div>';\n const html=data.map((row,i)=>{\n   const pct=max>0&&row.energy!==null?100*row.energy/max:0;\n   return '<div style=\"padding:10px 0;border-bottom:'+(i===data.length-1?'0':'1px solid var(--divider-color)')+'\">'+\n    '<div style=\"display:grid;grid-template-columns:'+cols+';gap:9px;align-items:center;min-width:0\">'+\n    '<div style=\"display:flex;gap:8px;align-items:center;min-width:0\">'+\n    '<span style=\"width:8px;height:8px;flex:0 0 8px;border-radius:3px;background:'+row.color+'\"></span>'+\n    '<span title=\"'+escape(row.name)+'\" style=\"min-width:0;font-size:12px;font-weight:500;color:var(--primary-text-color);overflow-wrap:anywhere;line-height:1.3\">'+escape(row.name)+'</span></div>'+\n    '<span style=\"text-align:right;white-space:nowrap;color:var(--primary-text-color);font-size:12px;font-variant-numeric:tabular-nums\">'+fmt(row.energy)+'</span>'+\n    '<span style=\"text-align:right;white-space:nowrap;color:'+(row.cost==null?'var(--secondary-text-color)':'var(--primary-text-color)')+';font-size:12px;font-variant-numeric:tabular-nums\">'+fmt(row.cost)+'</span></div>'+\n    '<div style=\"height:3px;margin-top:7px;border-radius:3px;background:var(--divider-color);overflow:hidden;margin-left:16px\">'+\n    '<div style=\"width:'+pct.toFixed(2)+'%;height:100%;background:'+row.color+'\"></div></div></div>';\n }).join('');\n return '<div style=\"box-sizing:border-box;padding:17px 18px 12px;min-width:0\">'+header+\n (html||'<div style=\"padding:15px 0;color:var(--secondary-text-color)\">Keine Daten</div>')+'</div>';\n]]]"
      styles:
        card:
          -
            background: "var(--ha-card-background,var(--card-background-color))"
          -
            border: "1px solid var(--divider-color)"
          -
            border-radius: "14px"
          -
            box-shadow: "none"
          -
            padding: "0"
          -
            overflow: "hidden"
        grid:
          -
            grid-template-areas: "\"body\""
          -
            grid-template-columns: "1fr"
          -
            grid-template-rows: "auto"
        custom_fields:
          body:
            -
              width: "100%"
            -
              min-width: "0"
