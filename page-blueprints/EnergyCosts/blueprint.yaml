blueprint:
  name: "Energy & Costs"
  name_de: "Energie & Kosten"
  description: "Unified energy/cost dashboard with grouped KPIs, aligned charts and real electricity standing charge."
  description_de: "Vier übersichtliche Kennzahlen, kompakter Monatsverlauf und Kostenverteilung mit Stromgrundpreis."
  icon: "mdi:lightning-bolt-circle"
  type: "page"
  author: "makeflori"
  version: "1.0"
  custom_cards:
    - "button-card"
    - "layout-card"
    - "apexcharts-card"
  input:
    total_energy_month:
      name: "Monthly total consumption"
      name_de: "Monatsverbrauch gesamt"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    base_fee_month:
      name: "Monthly electricity standing charge"
      name_de: "Stromgrundpreis / Monat"
      type: "entity-picker"
      entity_domain: "input_number"
      default: ""
    total_cost_month:
      name: "Monthly total costs"
      name_de: "Monatskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_energy_year:
      name: "Yearly total consumption"
      name_de: "Jahresverbrauch"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    total_cost_year:
      name: "Yearly total costs"
      name_de: "Jahreskosten"
      type: "entity-picker"
      entity_domain: "sensor"
      default: ""
    monthly_consumption:
      name: "Current month energy per device"
      name_de: "Monatsverbrauch je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightning-bolt"
      default: []
    monthly_costs:
      name: "Current month costs per device"
      name_de: "Monatskosten je Gerät"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:currency-eur"
      default: []
    historical_consumption_meters:
      name: "Cumulative meters with long-term statistics"
      name_de: "Kumulierte Zähler mit Langzeitstatistik"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:chart-column"
      default: []
    kitchen:
      name: "Devices in Küche"
      name_de: "Geräte Küche"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:fridge-outline"
      default: []
    office:
      name: "Devices in Büro"
      name_de: "Geräte Büro"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:desktop-classic"
      default: []
    living:
      name: "Devices in Wohnzimmer"
      name_de: "Geräte Wohnzimmer"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:sofa-outline"
      default: []
    bathroom:
      name: "Devices in Bad"
      name_de: "Geräte Bad"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:washing-machine"
      default: []
    other:
      name: "Devices in Raumübergreifend"
      name_de: "Geräte Raumübergreifend"
      type: "entity-list"
      entity_domain: "sensor"
      default_icon: "mdi:lightbulb-group-outline"
      default: []
card:
  type: "vertical-stack"
  cards:
    -
      type: "custom:button-card"
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      tap_action:
        action: "none"
      triggers_update:
        - "$total_energy_month$"
        - "$total_energy_year$"
        - "$total_cost_month$"
        - "$total_cost_year$"
        -
          repeat: "monthly_consumption"
          template: "$item.entity$"
      custom_fields:
        panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst selected=$json.monthly_consumption$;\nconst measured=read(\"$total_energy_month$\");\nconst month=measured===null?selected.reduce((n,a)=>n+(read(a.entity)??0),0):measured;\nconst data=[\n {title:\"Verbrauch · Monat\",number:month,unit:\"kWh\",type:\"energy\"},\n {title:\"Verbrauch · Jahr\",number:read(\"$total_energy_year$\"),unit:\"kWh\",type:\"energy\"},\n {title:\"Kosten · Monat\",number:read(\"$total_cost_month$\"),unit:\"€\",type:\"cost\"},\n {title:\"Kosten · Jahr\",number:read(\"$total_cost_year$\"),unit:\"€\",type:\"cost\"}\n];\nconst icons={energy:'<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4.5 13H11l-1 9L19.5 10H13l0-8Z\"/></svg>',cost:'<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"/><path d=\"M16 12h5\"/><circle cx=\"16\" cy=\"12\" r=\"1\"/></svg>'};\nconst tile=x=>{const color=x.type===\"cost\"?\"#c9952b\":\"var(--primary-color)\";return '<section style=\"position:relative;box-sizing:border-box;min-width:0;min-height:109px;padding:16px 18px;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;text-align:left;overflow:hidden\"><div style=\"position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:'+color+'\"></div><div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\"><div style=\"font-size:13px;font-weight:650;color:var(--secondary-text-color)\">'+x.title+'</div><div aria-hidden=\"true\" style=\"width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;color:'+color+';background:var(--secondary-background-color);border-radius:8px\">'+icons[x.type]+'</div></div><div style=\"display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:12px\"><strong style=\"font-size:clamp(23px,2.4vw,31px);font-weight:720;line-height:1.05;letter-spacing:-.4px;font-variant-numeric:tabular-nums\">'+fmt(x.number)+'</strong><span style=\"font-size:12px;color:var(--secondary-text-color)\">'+x.unit+'</span></div></section>';};\nreturn '<div style=\"box-sizing:border-box;padding:0 9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,218px),1fr));gap:12px;color:var(--primary-text-color);font-family:inherit\">'+data.map(tile).join(\"\")+'</div>';\n]]]"
      styles:
        card:
          - border: "none"
          - box-shadow: "none"
          - padding: "0"
          - background: "transparent"
        grid:
          - grid-template-areas: '"panel"'
          - grid-template-columns: "minmax(0,1fr)"
        custom_fields:
          panel:
            - width: "100%"
            - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(auto-fit,minmax(min(100%,480px),1fr))"
        grid-gap: "12px"
        align-items: "stretch"
      cards:
        -
          type: "custom:apexcharts-card"
          requires_input: "historical_consumption_meters"
          graph_span: "210d"
          span:
            end: "month"
          update_interval: "10min"
          cache: true
          experimental:
            hidden_by_default: true
          header:
            show: false
            title: "Verbrauch · Monatsverlauf"
            standard_format: false
          color_list:
            - "#ca2b76"
            - "#388cce"
            - "#dfaa22"
            - "#43ad93"
            - "#9674c6"
            - "#db7950"
            - "#6c86a6"
            - "#ad62a0"
          yaxis:
            - min: 0
              max: "auto"
              decimals: 0
              apex_config:
                tickAmount: 4
          all_series_config:
            type: "column"
            statistics:
              type: "change"
              period: "month"
              align: "end"
            transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x);"
          apex_config:
            chart:
              height: 225
              fontFamily: "inherit"
            xaxis:
              type: "datetime"
              labels:
                show: true
                rotate: 0
                hideOverlappingLabels: true
                formatter: "EVAL:function(value,timestamp){if(!Number.isFinite(Number(timestamp)))return value;const d=new Date(Number(timestamp));d.setDate(1);d.setMonth(d.getMonth()-1);return d.toLocaleDateString(\"de-DE\",{month:\"short\",year:\"2-digit\"});}"
              axisTicks:
                show: false
            legend:
              show: true
              position: "bottom"
              fontSize: "11px"
              itemMargin:
                horizontal: 7
                vertical: 5
            plotOptions:
              bar:
                columnWidth: "68%"
            tooltip:
              shared: true
          card_mod:
            style: "ha-card { box-sizing: border-box; min-height: 348px; height: 100%; border-radius: 12px; border: 1px solid var(--divider-color); box-shadow: none; background: var(--ha-card-background, var(--card-background-color)); overflow: hidden; } ha-card::before { content: 'Verbrauch · Monatsverlauf'; display: block; padding: 16px 18px 0; font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--primary-text-color); text-align: left; }"
          series:
            -
              repeat: "historical_consumption_meters"
              template:
                entity: "$item.entity$"
                name: "$item.name$"
                unit: "kWh"
                float_precision: 1
                show:
                  legend_value: true
                  in_legend: true
                  hidden_by_default: "$item.hidden_by_default$"
        -
          type: "custom:button-card"
          show_name: false
          show_icon: false
          show_state: false
          show_label: false
          tap_action:
            action: "none"
          triggers_update:
            - "$base_fee_month$"
            - "$total_cost_month$"
            -
              repeat: "monthly_costs"
              template: "$item.entity$"
          custom_fields:
            panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst costs=$json.monthly_costs$,history=$json.historical_consumption_meters$,palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst price=read(\"$total_cost_month$\"),fixed=read(\"$base_fee_month$\");\nconst parts=costs.map(c=>({name:c.name,value:read(c.entity),color:palette[Math.max(0,history.findIndex(h=>h.name===c.name))%palette.length]}));\nconst deviceSum=parts.reduce((s,r)=>s+(r.value??0),0);\nif(fixed!==null)parts.push({name:\"Grundpreis\",value:fixed,color:\"var(--disabled-text-color,#999da5)\"});\nconst assigned=parts.reduce((s,r)=>s+(r.value??0),0);\nconst unexplained=price!==null&&price>assigned+.06?price-assigned:0;\nif(unexplained>.06)parts.push({name:\"Weitere Kosten\",value:unexplained,color:\"#a6aeb6\"});\nconst total=parts.reduce((s,r)=>s+(r.value??0),0);\nconst circle=2*Math.PI*67;let progress=0;\nconst arcs=parts.filter(x=>x.value!==null&&x.value>0).map(x=>{const n=x.value/total*circle;const el='<circle cx=\"110\" cy=\"110\" r=\"67\" fill=\"none\" stroke=\"'+x.color+'\" stroke-width=\"25\" stroke-dasharray=\"'+n+' '+circle+'\" stroke-dashoffset=\"'+(-progress)+'\" transform=\"rotate(-90 110 110)\"><title>'+esc(x.name)+': '+fmt(x.value)+' €</title></circle>';progress+=n;return el;}).join(\"\");\nconst center=total>0?'<text x=\"110\" y=\"106\" text-anchor=\"middle\" fill=\"var(--primary-text-color)\" font-size=\"29\" font-weight=\"720\">'+fmt(total)+'</text><text x=\"110\" y=\"129\" text-anchor=\"middle\" fill=\"var(--secondary-text-color)\" font-size=\"12\">€ / Monat</text>':'';\nconst donut='<svg viewBox=\"0 0 220 220\" style=\"display:block;width:100%;max-width:248px;height:auto;margin:0 auto\" role=\"img\" aria-label=\"Monatliche Kostenverteilung einschließlich Grundpreis\"><circle cx=\"110\" cy=\"110\" r=\"67\" stroke=\"var(--divider-color)\" stroke-width=\"25\" fill=\"none\"/>'+arcs+center+'</svg>';\nconst head='<div style=\"display:grid;grid-template-columns:9px minmax(0,1fr) 44px 58px;gap:6px;font-size:11px;color:var(--secondary-text-color);font-weight:650;padding:0 0 6px;border-bottom:1px solid var(--divider-color)\"><span></span><span>Gerät</span><span style=\"text-align:right\">Anteil</span><span style=\"text-align:right\">Kosten</span></div>';\nconst rows=parts.map(x=>'<div style=\"display:grid;grid-template-columns:9px minmax(0,1fr) 44px 58px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--divider-color);font-size:11px\"><span style=\"width:8px;height:8px;border-radius:2px;background:'+x.color+'\"></span><span style=\"text-align:left;overflow-wrap:anywhere\">'+esc(x.name)+'</span><span style=\"text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap\">'+(x.value===null||total<=0?\"–\":(100*x.value/total).toLocaleString(\"de-DE\",{maximumFractionDigits:1})+\" %\")+'</span><strong style=\"text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap\">'+fmt(x.value)+' €</strong></div>').join(\"\");\nreturn '<section style=\"box-sizing:border-box;min-width:0;min-height:348px;height:100%;padding:16px 18px;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;color:var(--primary-text-color);font-family:inherit;text-align:left\"><div style=\"font-size:16px;font-weight:600;line-height:1.25;margin:0 0 16px\">Kostenverteilung · aktueller Monat</div><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,214px),1fr));gap:12px;align-items:center\">'+(total>0?donut:'<div>Keine Kostendaten</div>')+'<div style=\"min-width:0\">'+head+rows+'</div></div></section>';\n]]]"
          styles:
            card:
              - border: "none"
              - box-shadow: "none"
              - padding: "0"
              - background: "transparent"
            grid:
              - grid-template-areas: '"panel"'
              - grid-template-columns: "minmax(0,1fr)"
            custom_fields:
              panel:
                - width: "100%"
                - min-width: "0"
    -
      type: "custom:layout-card"
      layout_type: "custom:grid-layout"
      layout:
        grid-template-columns: "repeat(5,minmax(0,1fr))"
        grid-gap: "10px"
        align-items: "start"
        mediaquery:
          "(max-width: 460px)":
            grid-template-columns: "minmax(0,1fr)"
          "(max-width: 740px)":
            grid-template-columns: "repeat(2,minmax(0,1fr))"
          "(max-width: 1100px)":
            grid-template-columns: "repeat(3,minmax(0,1fr))"
        align-items: "start"
      cards:
        -
          type: "vertical-stack"
          cards:
            -
              type: "heading"
              heading: "Küche"
              heading_style: "subtitle"
              icon: "mdi:fridge-outline"
            -
              type: "vertical-stack"
              requires_input: "kitchen"
              cards:
                -
                  repeat: "kitchen"
                  template:
                    type: "custom:button-card"
                    entity: "$item.entity$"
                    show_name: false
                    show_icon: false
                    show_state: false
                    show_label: false
                    tap_action:
                      action: "more-info"
                    triggers_update:
                      -
                        repeat: "monthly_consumption"
                        template: "$item.entity$"
                      -
                        repeat: "monthly_costs"
                        template: "$item.entity$"
                    custom_fields:
                      panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst name=\"$item.name$\",costs=$json.monthly_costs$,history=$json.historical_consumption_meters$,palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst color=palette[Math.max(0,history.findIndex(x=>x.name===name))%palette.length];\nconst costItem=costs.find(x=>x.name===name),cost=costItem?read(costItem.entity):null;\nreturn '<div style=\"box-sizing:border-box;min-width:0;min-height:97px;padding:12px 13px;border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));color:var(--primary-text-color);text-align:left;font-family:inherit\"><div style=\"display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:650;margin-bottom:9px\"><span style=\"flex-shrink:0;background:'+color+';width:8px;height:8px;border-radius:2px\"></span><span style=\"overflow-wrap:anywhere\">'+esc(name)+'</span></div><div style=\"display:flex;align-items:baseline;gap:5px;flex-wrap:wrap\"><strong style=\"font-size:22px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums\">'+fmt(read(\"$item.entity$\"))+'</strong><span style=\"font-size:11px;color:var(--secondary-text-color)\">kWh / Monat</span></div><div style=\"margin-top:9px;font-size:11px;color:var(--secondary-text-color)\">Kosten <strong style=\"font-size:12px;color:var(--primary-text-color);font-variant-numeric:tabular-nums\">'+fmt(cost)+' €</strong> / Monat</div></div>';\n]]]"
                    styles:
                      card:
                        - border: "none"
                        - box-shadow: "none"
                        - padding: "0"
                        - background: "transparent"
                      grid:
                        - grid-template-areas: '"panel"'
                        - grid-template-columns: "minmax(0,1fr)"
                      custom_fields:
                        panel:
                          - width: "100%"
                          - min-width: "0"
        -
          type: "vertical-stack"
          cards:
            -
              type: "heading"
              heading: "Büro"
              heading_style: "subtitle"
              icon: "mdi:desktop-classic"
            -
              type: "vertical-stack"
              requires_input: "office"
              cards:
                -
                  repeat: "office"
                  template:
                    type: "custom:button-card"
                    entity: "$item.entity$"
                    show_name: false
                    show_icon: false
                    show_state: false
                    show_label: false
                    tap_action:
                      action: "more-info"
                    triggers_update:
                      -
                        repeat: "monthly_consumption"
                        template: "$item.entity$"
                      -
                        repeat: "monthly_costs"
                        template: "$item.entity$"
                    custom_fields:
                      panel: "[[[\nconst read=id=>{const s=states[id],v=Number(s?.state);return s&&![\"unknown\",\"unavailable\"].includes(s.state)&&Number.isFinite(v)&&v>=0?v:null;};\nconst fmt=n=>n===null?\"–\":n.toLocaleString(\"de-DE\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst esc=s=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\nconst name=\"$item.name$\",costs=$json.monthly_costs$,history=$json.historical_consumption_meters$,palette=[\"#ca2b76\",\"#388cce\",\"#dfaa22\",\"#43ad93\",\"#9674c6\",\"#db7950\",\"#6c86a6\",\"#ad62a0\"];\nconst color=palette[Math.max(0,history.findIndex(x=>x.name===name))%palette.length];\nconst costItem=costs.find(x=>x.name===name),cost=costItem?read(costItem.entity):null;\nreturn '<div style=\"box-sizing:border-box;min-width:0;min-height:97px;padding:12px 13px;border:1px solid var(--divider-color);border-radius:12px;background:var(--ha-card-background,var(--card-background-color));color:var(--primary-text-color);text-align:left;font-family:inherit\"><div style=\"display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:650;margin-bottom:9px\"><span style=\"flex-shrink:0;background:'+color+';width:8px;height:8px;border-radius:2px\"></span><span style=\"overflow-wrap:anywhere\">'+esc(name)+'</span></div><div style=\"display:flex;align-items:baseline;gap:5px;flex-wrap:wrap\"><strong style=\"font-size:22px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums\">'+fmt(read(\"$item.entity$\"))+'</strong><span style=\"font-size:11px;color:var(--secondary-text-color)\">kWh / Monat</span></div><div style=\"margin-top:9px;font-size:11px;color:var(--secondary-text-color)\">Kosten <strong style=\"font-size:12px;color:var(--primary-text-color);font-variant-numeric:tabular-nums\">'+fmt(cost)+' €</strong> / Monat</div></div>';\n]]]"
                    styles:
                      card:
                        - border: "none"
                        - box-shadow: "none"
                        - padding: "0"
                        - background: "transparent"
                      grid:
                        - grid-template-areas: '"panel"'
                        - grid-template-columns: "minmax(0,1fr)"
                      custom_fields:
                        panel:
                          - width: "100%"
                          - min-width: "0"
        -
          type: "vertical-stack"
          cards:
            -
              type: "heading"
              heading: "Wohnzimmer"
              heading_style: "subtitle"
              icon: "mdi:sofa-outline"
            -
              type: "vertical-stack"
              requires_input: "living"
              cards:
                -
                  repeat: "living"
                  template:
                    type: "custom:button-card"
                    entity: "$item.entity$"
                    show_name: false
                    show_icon: false
                    show_state: false
                    show_label: false
                    tap_action:
                      action: "more-info"
                    triggers_update:
                      -
                        repeat: "monthly_consumption"
                        template: "$item.entity$"
                      -
                        repeat: "monthly_costs"
