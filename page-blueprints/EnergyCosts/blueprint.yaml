ipsis;overflow:hidden;color:var(--primary-text-color)\">'+r.name+'</span></div>'+\n '<span style=\"font-size:13px;font-weight:700;white-space:nowrap;color:var(--primary-text-color)\">'+fmt(r.v)+' € <span style=\"font-size:11px;font-weight:400;color:var(--secondary-text-color)\">('+Math.round(share)+' %)</span></span></div>'+\n '<div style=\"height:8px;background:var(--divider-color);border-radius:10px;overflow:hidden\"><div style=\"height:100%;width:'+width.toFixed(2)+'%;background:'+r.color+';border-radius:10px\"></div></div></div>';}).join('');\n return '<div style=\"padding:23px 22px 26px;box-sizing:border-box\">'+\n '<div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\"><div><div style=\"font-size:18px;font-weight:750;letter-spacing:-.25px;color:var(--primary-text-color)\">Gerätekosten</div>'+\n '<div style=\"font-size:12px;color:var(--secondary-text-color);margin-top:5px\">Monat · nur Geräte mit Kostensensor</div></div>'+\n '<ha-icon icon=\"mdi:cash-multiple\" style=\"color:#E4A951;--mdc-icon-size:25px\"></ha-icon></div>'+\n '<div style=\"display:flex;justify-content:center;align-items:center;margin:25px 0 4px\">'+donut+'</div>'+\n '<div style=\"font-size:11px;text-align:center;color:var(--secondary-text-color);margin-bottom:13px\">Summe der ausgewählten Kostensensoren, ohne Grundpreis</div>'+\n (items||'<div style=\"color:var(--secondary-text-color)\">Keine gültigen Daten vorhanden.</div>')+\n '</div>';\n]]]"
      styles:
