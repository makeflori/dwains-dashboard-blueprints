          "template":
            "type": "custom:button-card"
            "variables":
              "slot": "$item.index$"
            "entity": "[[[ const bins=$json.waste_types$; const now=new Date(); const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'); const re=/^\\d{4}-\\d{2}-\\d{2}$/; const items=bins.map(b=>{const s=states[b.entity]; const dates=[]; if(s) for(const [k,v] of Object.entries(s.attributes||{})){if(re.test(k)&&k>=today)dates.push(k);if(typeof v==='string'&&re.test(v)&&v>=today)dates.push(v);} dates.sort(); return {...b,date:dates[0]||'9999-12-31'};}).sort((a,b)=>a.date.localeCompare(b.date)); return items[variables.slot].entity; ]]]"
            "show_icon": false
            "show_name": false
            "show_state": false
            "show_label": false
            "tap_action":
              "action": "more-info"
            "custom_fields":
              "content": "[[[\n  const rows=$json.waste_types$; const chosen=rows.find(b=>b.entity===entity.entity_id)||{}; const itemIcon=chosen.icon||'mdi:trash-can-outline'; const itemName=chosen.name||entity.attributes?.friendly_name||entity.entity_id;\n  const now=new Date();\n  const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');\n  const re=/^\\d{4}-\\d{2}-\\d{2}$/; const dates=[];\n  for(const [k,v] of Object.entries(entity.attributes||{})){\n    if(re.test(k)&&k>=today) dates.push(k);\n    if(typeof v==='string'&&re.test(v)&&v>=today) dates.push(v);\n  }\n  dates.sort();\n  const d=dates[0];\n  const de='$__language\n  if(d){\n    days=Math.round((new Date(d+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);\n    rel=days===0?(de?'Heute':'Today'):(days===1?(de?'Morgen':'Tomorrow'):(de?'in '+days+' Tagen':'in '+days+' days'));\n    dt=new Date(d+'T12:00:00').toLocaleDateString(de?'de-DE':'en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});\n  }\n  const urgent=days===0||days===1;\n  const mobile=window.innerWidth<=520;\n  const circle=urgent?'rgba(255,193,7,.11)':'rgba(33,150,243,.055)';\n  const pill=urgent?'rgba(255,193,7,.18)':'rgba(33,150,243,.09)';\n  const pillColor=urgent?'#c46a00':'var(--primary-color)';\n  const border=urgent?'rgba(255,193,7,.42)':'var(--divider-color)';\n  const bg=urgent?'linear-gradient(180deg, rgba(255,193,7,.075), var(--card-background-color))':'var(--card-background-color)';\n  const circleSize=mobile?108:190;\n  const imgW=mobile?76:128;\n  const imgH=mobile?96:158;\n  const pad=mobile?'8px 6px 8px':'22px 20px 26px';\n  const mbCircle=mobile?'5px':'15px';\n  const nameSize=mobile?'17px':'21px';\n  const nameMb=mobile?'5px':'15px';\n  const pillPad=mobile?'6px 10px':'11px 24px';\n  const pillSize=mobile?'16px':'23px';\n  const iconSize=mobile?'19px':'25px';\n  const gap=mobile?'5px':'10px';\n  const dateSize=mobile?'12.5px':'17px';\n  const dateMt=mobile?'6px':'15px';\n  const radius=mobile?'14px':'16px';\n\n  return '<div style=\"height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:'+pad+';border:1px solid '+border+';border-radius:'+radius+';background:'+bg+';overflow:hidden\">'+\n    '<div style=\"width:'+circleSize+'px;height:'+circleSize+'px;border-radius:50%;background:'+circle+';display:flex;align-items:center;justify-content:center;margin-bottom:'+mbCircle+'\"><ha-icon icon=\\\"'+itemIcon+'\\\" style=\\\"--mdc-icon-size:'+(mobile?54:88)+'px;color:var(--primary-color)\\\"></ha-icon></div>'+\n    '<div style=\"font-size:'+nameSize+';font-weight:700;color:var(--secondary-text-color);line-height:1.1;margin-bottom:'+nameMb+';text-align:center\">'+(itemName||'')+'</div>'+\n    '<div style=\"display:flex;align-items:center;justify-content:center;gap:'+gap+';background:'+pill+';color:'+pillColor+';border-radius:999px;padding:'+pillPad+';font-size:'+pillSize+';font-weight:700;line-height:1;white-space:nowrap\"><ha-icon icon=\"mdi:calendar-month\" style=\"--mdc-icon-size:'+iconSize+'\"></ha-icon><span>'+rel+'</span></div>'+\n    '<div style=\"font-size:'+dateSize+';color:var(--secondary-text-color);margin-top:'+dateMt+';line-height:1.15;text-align:center;white-space:nowrap\">'+dt+'</div>'+\n  '</div>';\n]]]==='de';\n  let rel=de?'Kein Termin':'No date',dt='',days=999;\n  if(d){\n    days=Math.round((new Date(d+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);\n    rel=days===0?'Heute':(days===1?'Morgen':'in '+days+' Tagen');\n    dt=new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});\n  }\n  const urgent=days===0||days===1;\n  const mobile=window.innerWidth<=520;\n  const circle=urgent?'rgba(255,193,7,.11)':'rgba(33,150,243,.055)';\n  const pill=urgent?'rgba(255,193,7,.18)':'rgba(33,150,243,.09)';\n  const pillColor=urgent?'#c46a00':'var(--primary-color)';\n  const border=urgent?'rgba(255,193,7,.42)':'var(--divider-color)';\n  const bg=urgent?'linear-gradient(180deg, rgba(255,193,7,.075), var(--card-background-color))':'var(--card-background-color)';\n  const circleSize=mobile?108:190;\n  const imgW=mobile?76:128;\n  const imgH=mobile?96:158;\n  const pad=mobile?'8px 6px 8px':'22px 20px 26px';\n  const mbCircle=mobile?'5px':'15px';\n  const nameSize=mobile?'17px':'21px';\n  const nameMb=mobile?'5px':'15px';\n  const pillPad=mobile?'6px 10px':'11px 24px';\n  const pillSize=mobile?'16px':'23px';\n  const iconSize=mobile?'19px':'25px';\n  const gap=mobile?'5px':'10px';\n  const dateSize=mobile?'12.5px':'17px';\n  const dateMt=mobile?'6px':'15px';\n  const radius=mobile?'14px':'16px';\n\n  return '<div style=\"height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:'+pad+';border:1px solid '+border+';border-radius:'+radius+';background:'+bg+';overflow:hidden\">'+\n    '<div style=\"width:'+circleSize+'px;height:'+circleSize+'px;border-radius:50%;background:'+circle+';display:flex;align-items:center;justify-content:center;margin-bottom:'+mbCircle+'\"><ha-icon icon=\\\"'+itemIcon+'\\\" style=\\\"--mdc-icon-size:'+(mobile?54:88)+'px;color:var(--primary-color)\\\"></ha-icon></div>'+\n    '<div style=\"font-size:'+nameSize+';font-weight:700;color:var(--secondary-text-color);line-height:1.1;margin-bottom:'+nameMb+';text-align:center\">'+(itemName||'')+'</div>'+\n    '<div style=\"display:flex;align-items:center;justify-content:center;gap:'+gap+';background:'+pill+';color:'+pillColor+';border-radius:999px;padding:'+pillPad+';font-size:'+pillSize+';font-weight:700;line-height:1;white-space:nowrap\"><ha-icon icon=\"mdi:calendar-month\" style=\"--mdc-icon-size:'+iconSize+'\"></ha-icon><span>'+rel+'</span></div>'+\n    '<div style=\"font-size:'+dateSize+';color:var(--secondary-text-color);margin-top:'+dateMt+';line-height:1.15;text-align:center;white-space:nowrap\">'+dt+'</div>'+\n  '</div>';\n]]]"
