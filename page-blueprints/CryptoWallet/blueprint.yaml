"blueprint":
  "name": "Crypto Wallet"
  "name_de": "Krypto-Wallet"
  "description": "Portfolio charts and any number of configurable crypto assets."
  "description_de": "Portfolio-Graphen und beliebig viele konfigurierbare Kryptowährungen."
  "type": "page"
  "version": "1.0.1"
  "icon": "mdi:wallet-outline"
  "author": "makeflori"
  "custom_cards":
    - "button-card"
    - "layout-card"
    - "vertical-stack-in-card"
  "input":
    "portfolio_total":
      "name": "Total portfolio sensor (optional)"
      "name_de": "Gesamtwert-Sensor (optional)"
      "type": "entity-picker"
      "suggest_entity": "sensor.wallet_value_total"
      "default": ""
    "coins":
      "name": "Coins"
      "name_de": "Coins"
      "type": "entity-list"
      "suggest": "coin"
      "entity_domain": "sensor"
      "default_icon": "mdi:circle-multiple"
      "default": []
"card":
  "type": "custom:layout-card"
  "layout_type": "custom:grid-layout"
  "layout":
    "grid-template-columns": "1.25fr 1fr"
    "grid-template-areas": "\"portfolio assets\""
    "grid-gap": "12px"
    "align-items": "start"
    "mediaquery":
      "(max-width: 900px)":
        "grid-template-columns": "1fr"
        "grid-template-areas": "\"portfolio\" \"assets\""
      "(max-width: 520px)":
        "grid-template-columns": "1fr"
        "grid-template-areas": "\"portfolio\" \"assets\""
        "grid-gap": "10px"
  "cards":
    -
      "type": "custom:button-card"
      "entity": "$portfolio_total$"
      "triggers_update": "$entities.coins$"
      "show_icon": false
      "show_name": false
      "show_state": false
      "show_label": false
      "tap_action":
        "action": "more-info"
      "custom_fields":
        "header": "[[[\n  const fromSensor=Number(entity?.state); const sum=$json.coins$.reduce((total,coin)=>total+(Number(states[coin.entity]?.state)||0),0); const shown=Number.isFinite(fromSensor)?fromSensor:sum;\n  const mobile=window.innerWidth<=520;\n  const eur=n=>Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:0})+' €';\n  return '<div style=\"text-align:left\">'+\n    '<div style=\"font-size:'+(mobile?'16px':'18px')+';font-weight:700;line-height:1.2;margin-bottom:'+(mobile?'4px':'6px')+'\">Gesamtwert</div>'+\n    '<div style=\"font-size:'+(mobile?'32px':'39px')+';font-weight:700;line-height:1.08;letter-spacing:-.5px\">'+eur(shown)+'</div>'+\n  '</div>';\n]]]"
        "ranges": "[[[\n  const mobile=window.innerWidth<=520;\n  const hLabel='24 h';\n  const dLabel='7 d';\n\n  const stop=e=>{ e.stopPropagation(); };\n  const activate=(range,e)=>{\n    e.preventDefault();\n    e.stopPropagation();\n\n    if(mobile){\n      const root=this.shadowRoot;\n      const show=(id,on)=>{\n        const el=root?.querySelector('#'+id);\n        if(el) el.style.display=on?'block':'none';\n      };\n      show('graph24',range==='24h');\n      show('footer24',range==='24h');\n      show('graph7',range==='7d');\n      show('footer7',range==='7d');\n\n      const wrap=e.currentTarget.closest('.wallet-range-switch');\n      wrap?.querySelectorAll('button').forEach(btn=>{\n        const active=btn.dataset.range===range;\n        btn.style.background=active?'rgba(33,150,243,.14)':'var(--secondary-background-color)';\n        btn.style.fontWeight=active?'700':'500';\n      });\n      return;\n    }\n\n    const wrap=e.currentTarget.closest('.wallet-range-switch');\n    const input=wrap?.querySelector('#wallet-range-'+range);\n    if(input){\n      input.checked=true;\n      input.dispatchEvent(new Event('change',{bubbles:true}));\n    }\n  };\n\n  return html`\n    <div class=\"wallet-range-switch\"\n      @pointerdown=${stop}\n      @mousedown=${stop}\n      @touchstart=${stop}\n      @click=${stop}\n      style=\"display:flex;justify-content:${mobile?'stretch':'flex-end'};gap:7px;position:relative;z-index:100;pointer-events:auto;touch-action:manipulation;width:100%\">\n      <input id=\"wallet-range-24h\" type=\"radio\" name=\"wallet-range\" checked>\n      <button type=\"button\" data-range=\"24h\"\n        @pointerdown=${e=>mobile?activate('24h',e):stop(e)}\n        @pointerup=${e=>mobile?stop(e):activate('24h',e)}\n        @click=${stop}\n        style=\"${mobile?'flex:1;background:rgba(33,150,243,.14);font-weight:700;':''}\">${hLabel}</button>\n      <input id=\"wallet-range-7d\" type=\"radio\" name=\"wallet-range\">\n      <button type=\"button\" data-range=\"7d\"\n        @pointerdown=${e=>mobile?activate('7d',e):stop(e)}\n        @pointerup=${e=>mobile?stop(e):activate('7d',e)}\n        @click=${stop}\n        style=\"${mobile?'flex:1;':''}\">${dLabel}</button>\n    </div>\n  `;\n]]]"
        "graph24":
          "requires_input": "portfolio_total"
          "card":
            "type": "history-graph"
            "hours_to_show": 24
            "show_names": false
            "entities":
              -
                "entity": "$portfolio_total$"
                "name": "Gesamtwert"
                "color": "#ff9800"
            "card_mod":
              "style": "\n    ha-card {\n      height:210px !important;\n      min-height:210px !important;\n      max-height:210px !important;\n      border:0;\n      box-shadow:none;\n      background:transparent;\n      padding:0;\n      overflow:hidden !important;\n    }\n    @media (max-width:520px){\n      ha-card {\n        height:164px !important;\n        min-height:164px !important;\n        max-height:164px !important;\n      }\n    }\n  "
            "grid_options":
              "rows": 4
        "graph7":
          "requires_input": "portfolio_total"
          "card":
            "type": "history-graph"
            "hours_to_show": 168
            "show_names": false
            "entities":
              -
                "entity": "$portfolio_total$"
                "name": "Gesamtwert"
                "color": "#ff9800"
            "card_mod":
              "style": "\n    ha-card {\n      height:210px !important;\n      min-height:210px !important;\n      max-height:210px !important;\n      border:0;\n      box-shadow:none;\n      background:transparent;\n      padding:0;\n      overflow:hidden !important;\n    }\n    @media (max-width:520px){\n      ha-card {\n        height:164px !important;\n        min-height:164px !important;\n        max-height:164px !important;\n      }\n    }\n  "
            "grid_options":
              "rows": 4
        "footer24": "[[[\n    const coins=$json.coins$.map(c=>[c.name,c.entity,c.price_entity]);\n    let current=0,previous=0,maxVal=-1,maxName='–';\n    coins.forEach(([name,v,p])=>{\n      const value=Number(states[v]?.state||0);\n      const ch=Number(states[p]?.attributes?.['24h_change']);\n      current+=value;\n      previous+=Number.isFinite(ch)&&ch>-99?value/(1+ch/100):value;\n      if(value>maxVal){maxVal=value;maxName=name;}\n    });\n    const diff=current-previous,pct=previous?diff/previous*100:0,pos=diff>=0,sign=pos?'+':'';\n    const share=current>0?maxVal/current*100:0;\n    const mobile=window.innerWidth<=520;\n    const eur=n=>Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:0})+' €';\n    const icon=(mdi,bg,fg,size=50)=>'<div style=\"width:'+size+'px;height:'+size+'px;min-width:'+size+'px;max-width:'+size+'px;min-height:'+size+'px;max-height:'+size+'px;aspect-ratio:1/1;flex:0 0 '+size+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:'+bg+';color:'+fg+';box-sizing:border-box\"><ha-icon icon=\"'+mdi+'\" style=\"--mdc-icon-size:'+(mobile?'19':'25')+'px;color:'+fg+'\"></ha-icon></div>';\n    if(mobile){\n      const stat=(ic,title,val,sub,color,border)=>'<div style=\"min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:0 5px;'+(border?'border-right:1px solid var(--divider-color);':'')+'\">'+\n        ic+\n        '<div style=\"font-size:9px;color:var(--secondary-text-color);margin-top:6px;line-height:1.1;white-space:nowrap\">'+title+'</div>'+\n        '<div style=\"font-size:13px;font-weight:700;margin-top:3px;line-height:1.1;color:'+(color||'var(--primary-text-color)')+';white-space:nowrap\">'+val+'</div>'+\n        '<div style=\"font-size:9px;color:'+(color||'var(--secondary-text-color)')+';margin-top:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">'+sub+'</div>'+\n      '</div>';\n      return '<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;align-items:start\">'+\n        stat(icon(pos?'mdi:trending-up':'mdi:trending-down',pos?'rgba(34,197,94,.10)':'rgba(239,68,68,.10)',pos?'#16a34a':'#dc2626',38),'24 h',sign+eur(diff),sign+pct.toLocaleString('de-DE',{maximumFractionDigits:1})+' %',pos?'#16a34a':'#dc2626',true)+\n        stat(icon('mdi:chart-pie','rgba(59,130,246,.10)','#3b82f6',38),'Assets','7','Coins','',true)+\n        stat(icon('mdi:percent-outline','rgba(139,92,246,.10)','#7c3aed',38),'Größte Position',share.toLocaleString('de-DE',{maximumFractionDigits:1})+' %',maxName,'',false)+\n      '</div>';\n    }\n    return '<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;align-items:center\">'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 18px 0 2px;border-right:1px solid var(--divider-color)\">'+icon(pos?'mdi:trending-up':'mdi:trending-down',pos?'rgba(34,197,94,.10)':'rgba(239,68,68,.10)',pos?'#16a34a':'#dc2626')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">24 h Veränderung</div><div style=\"font-size:18px;font-weight:700;color:'+(pos?'#16a34a':'#dc2626')+'\">'+sign+eur(diff)+' <span style=\"font-size:14px\">('+sign+pct.toLocaleString('de-DE',{maximumFractionDigits:1})+' %)</span></div></div></div>'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 20px;border-right:1px solid var(--divider-color)\">'+icon('mdi:chart-pie','rgba(59,130,246,.10)','#3b82f6')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">Assets</div><div style=\"font-size:18px;font-weight:700\">7</div><div style=\"font-size:12px;color:var(--secondary-text-color)\">verschiedene Coins</div></div></div>'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 2px 0 20px\">'+icon('mdi:percent-outline','rgba(139,92,246,.10)','#7c3aed')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">Größte Position</div><div style=\"font-size:18px;font-weight:700\">'+share.toLocaleString('de-DE',{maximumFractionDigits:1})+' %</div><div style=\"font-size:12px;color:var(--secondary-text-color)\">'+maxName+'</div></div></div>'+\n    '</div>';\n  ]]]"
        "footer7": "[[[\n    const coins=$json.coins$.map(c=>[c.name,c.entity,c.price_entity]);\n    let current=0,previous=0,maxVal=-1,maxName='–';\n    coins.forEach(([name,v,p])=>{\n      const value=Number(states[v]?.state||0);\n      const ch=Number(states[p]?.attributes?.['7d_change']);\n      current+=value;\n      previous+=Number.isFinite(ch)&&ch>-99?value/(1+ch/100):value;\n      if(value>maxVal){maxVal=value;maxName=name;}\n    });\n    const diff=current-previous,pct=previous?diff/previous*100:0,pos=diff>=0,sign=pos?'+':'';\n    const share=current>0?maxVal/current*100:0;\n    const mobile=window.innerWidth<=520;\n    const eur=n=>Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:0})+' €';\n    const icon=(mdi,bg,fg,size=50)=>'<div style=\"width:'+size+'px;height:'+size+'px;min-width:'+size+'px;max-width:'+size+'px;min-height:'+size+'px;max-height:'+size+'px;aspect-ratio:1/1;flex:0 0 '+size+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:'+bg+';color:'+fg+';box-sizing:border-box\"><ha-icon icon=\"'+mdi+'\" style=\"--mdc-icon-size:'+(mobile?'19':'25')+'px;color:'+fg+'\"></ha-icon></div>';\n    if(mobile){\n      const stat=(ic,title,val,sub,color,border)=>'<div style=\"min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:0 5px;'+(border?'border-right:1px solid var(--divider-color);':'')+'\">'+\n        ic+\n        '<div style=\"font-size:9px;color:var(--secondary-text-color);margin-top:6px;line-height:1.1;white-space:nowrap\">'+title+'</div>'+\n        '<div style=\"font-size:13px;font-weight:700;margin-top:3px;line-height:1.1;color:'+(color||'var(--primary-text-color)')+';white-space:nowrap\">'+val+'</div>'+\n        '<div style=\"font-size:9px;color:'+(color||'var(--secondary-text-color)')+';margin-top:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">'+sub+'</div>'+\n      '</div>';\n      return '<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;align-items:start\">'+\n        stat(icon(pos?'mdi:trending-up':'mdi:trending-down',pos?'rgba(34,197,94,.10)':'rgba(239,68,68,.10)',pos?'#16a34a':'#dc2626',38),'7 d',sign+eur(diff),sign+pct.toLocaleString('de-DE',{maximumFractionDigits:1})+' %',pos?'#16a34a':'#dc2626',true)+\n        stat(icon('mdi:chart-pie','rgba(59,130,246,.10)','#3b82f6',38),'Assets','7','Coins','',true)+\n        stat(icon('mdi:percent-outline','rgba(139,92,246,.10)','#7c3aed',38),'Größte Position',share.toLocaleString('de-DE',{maximumFractionDigits:1})+' %',maxName,'',false)+\n      '</div>';\n    }\n    return '<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;align-items:center\">'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 18px 0 2px;border-right:1px solid var(--divider-color)\">'+icon(pos?'mdi:trending-up':'mdi:trending-down',pos?'rgba(34,197,94,.10)':'rgba(239,68,68,.10)',pos?'#16a34a':'#dc2626')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">7 d Veränderung</div><div style=\"font-size:18px;font-weight:700;color:'+(pos?'#16a34a':'#dc2626')+'\">'+sign+eur(diff)+' <span style=\"font-size:14px\">('+sign+pct.toLocaleString('de-DE',{maximumFractionDigits:1})+' %)</span></div></div></div>'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 20px;border-right:1px solid var(--divider-color)\">'+icon('mdi:chart-pie','rgba(59,130,246,.10)','#3b82f6')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">Assets</div><div style=\"font-size:18px;font-weight:700\">7</div><div style=\"font-size:12px;color:var(--secondary-text-color)\">verschiedene Coins</div></div></div>'+\n      '<div style=\"display:flex;align-items:center;gap:13px;padding:0 2px 0 20px\">'+icon('mdi:percent-outline','rgba(139,92,246,.10)','#7c3aed')+'<div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-bottom:3px\">Größte Position</div><div style=\"font-size:18px;font-weight:700\">'+share.toLocaleString('de-DE',{maximumFractionDigits:1})+' %</div><div style=\"font-size:12px;color:var(--secondary-text-color)\">'+maxName+'</div></div></div>'+\n    '</div>';\n  ]]]"
      "styles":
        "card":
          -
            "padding": "[[[ return window.innerWidth <= 520 ? '14px 12px 12px' : '18px 18px 14px'; ]]]"
          -
            "border": "1px solid var(--divider-color)"
          -
            "border-radius": "[[[ return window.innerWidth <= 520 ? '14px' : '16px'; ]]]"
          -
            "box-shadow": "none"
          -
            "overflow": "hidden"
          -
            "cursor": "default"
        "grid":
          -
            "grid-template-areas": "[[[ return window.innerWidth <= 520 ? '\"header header\" \"ranges ranges\" \"graph24 graph24\" \"graph7 graph7\" \"footer24 footer24\" \"footer7 footer7\"' : '\"header ranges\" \"graph24 graph24\" \"graph7 graph7\" \"footer24 footer24\" \"footer7 footer7\"'; ]]]"
          -
            "grid-template-columns": "[[[ return window.innerWidth <= 520 ? '1fr 1fr' : 'minmax(0,1fr) auto'; ]]]"
          -
            "grid-template-rows": "auto auto auto auto auto auto"
          -
            "column-gap": "16px"
          -
            "row-gap": "0"
          -
            "align-items": "start"
        "custom_fields":
          "header":
            -
              "grid-area": "header"
            -
              "align-self": "start"
          "ranges":
            -
              "grid-area": "ranges"
            -
              "align-self": "start"
            -
              "padding-top": "2px"
            -
              "position": "relative"
            -
              "z-index": "100"
            -
              "pointer-events": "auto"
            -
              "overflow": "visible"
          "graph24":
            -
              "grid-area": "graph24"
            -
              "width": "100%"
            -
              "min-width": "0"
            -
              "margin-top": "10px"
            -
              "cursor": "default"
            -
              "z-index": "1"
            -
              "overflow": "hidden"
          "graph7":
            -
              "grid-area": "graph7"
            -
              "width": "100%"
            -
              "min-width": "0"
            -
              "margin-top": "10px"
            -
              "cursor": "default"
            -
              "z-index": "1"
            -
              "overflow": "hidden"
          "footer24":
            -
              "grid-area": "footer24"
            -
              "width": "100%"
            -
              "margin-top": "10px"
            -
              "padding-top": "14px"
            -
              "border-top": "1px solid var(--divider-color)"
          "footer7":
            -
              "grid-area": "footer7"
            -
              "width": "100%"
            -
              "margin-top": "10px"
            -
              "padding-top": "14px"
            -
              "border-top": "1px solid var(--divider-color)"
      "view_layout":
        "grid-area": "portfolio"
      "extra_styles": "\n  #ranges {\n    position: relative !important;\n    z-index: 100 !important;\n    pointer-events: auto !important;\n    overflow: visible !important;\n  }\n  #ranges .wallet-range-switch,\n  #ranges .wallet-range-switch * {\n    pointer-events: auto !important;\n  }\n  #ranges .wallet-range-switch input {\n    position: absolute;\n    opacity: 0;\n    width: 1px;\n    height: 1px;\n    pointer-events: none !important;\n  }\n  #ranges .wallet-range-switch button {\n    position: relative;\n    z-index: 101;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    min-width: 52px;\n    min-height: 34px;\n    box-sizing: border-box;\n    border: 0;\n    border-radius: 999px;\n    padding: 9px 18px;\n    font: inherit;\n    font-size: 13px;\n    line-height: 1;\n    cursor: pointer;\n    background: var(--secondary-background-color);\n    color: var(--primary-text-color);\n    font-weight: 500;\n    white-space: nowrap;\n    user-select: none;\n    -webkit-user-select: none;\n    touch-action: manipulation;\n  }\n  #ranges .wallet-range-switch input:checked + button {\n    background: rgba(33,150,243,.14);\n    font-weight: 700;\n  }\n  #graph7, #footer7 { display: none; }\n  #ranges:has(#wallet-range-7d:checked) ~ #graph24,\n  #ranges:has(#wallet-range-7d:checked) ~ #footer24 { display: none; }\n  #ranges:has(#wallet-range-7d:checked) ~ #graph7,\n  #ranges:has(#wallet-range-7d:checked) ~ #footer7 { display: block; }\n"
      "hold_action":
        "action": "none"
      "double_tap_action":
        "action": "none"
    -
      "type": "custom:vertical-stack-in-card"
      "cards":
        -
          "type": "custom:button-card"
          "show_icon": false
          "show_name": false
          "show_state": false
          "show_label": false
          "tap_action":
            "action": "none"
          "custom_fields":
            "row": "[[[ return '<div style=\"font-size:18px;font-weight:700;line-height:1.2;width:100%;text-align:left\">'+('$__language$'==='de'?'Meine Assets':'My assets')+'</div>'; ]]]"
          "styles":
            "card":
              -
                "height": "[[[ return window.innerWidth <= 520 ? '48px' : '54px'; ]]]"
              -
                "padding": "[[[ return window.innerWidth <= 520 ? '0 14px' : '0 18px'; ]]]"
              -
                "border": "0"
              -
                "border-radius": "0"
              -
                "box-shadow": "none"
            "grid":
              -
                "grid-template-areas": "\"row\""
              -
                "grid-template-columns": "1fr"
            "custom_fields":
              "row":
                -
                  "width": "100%"
        -
          "type": "custom:button-card"
          "show_icon": false
          "show_name": false
          "show_state": false
          "show_label": false
          "tap_action":
            "action": "none"
          "custom_fields":
            "row": "[[[\n  const mobile=window.innerWidth<=520;\n  if(mobile) return '<div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) .72fr 1.08fr;gap:7px;width:calc(100% + 20px);margin-left:-10px;padding:0 10px 10px;box-sizing:border-box;border-bottom:1px solid var(--divider-color);font-size:10px;color:var(--secondary-text-color);font-weight:600;align-items:center\"><div style=\"text-align:left\">Coin</div><div style=\"text-align:right\">Kurs</div><div style=\"text-align:right\">Value / Share</div></div>';\n  return '<div style=\"display:grid;grid-template-columns:minmax(180px,1.45fr) 1fr 1.08fr .88fr;gap:24px;width:calc(100% + 36px);margin-left:-18px;padding:0 18px 11px;box-sizing:border-box;border-bottom:1px solid var(--divider-color);font-size:12px;color:var(--secondary-text-color);font-weight:600;align-items:center\"><div style=\"text-align:left\">Coin</div><div style=\"text-align:right\">Price (1 unit)</div><div style=\"text-align:right\">Value</div><div style=\"text-align:right\">Share</div></div>';\n]]]"
          "styles":
            "card":
              -
                "height": "[[[ return window.innerWidth <= 520 ? '34px' : '38px'; ]]]"
              -
                "padding": "[[[ return window.innerWidth <= 520 ? '0 14px' : '0 18px'; ]]]"
              -
                "border": "0"
              -
                "border-radius": "0"
              -
                "box-shadow": "none"
            "grid":
              -
                "grid-template-areas": "\"row\""
              -
                "grid-template-columns": "1fr"
            "custom_fields":
              "row":
                -
                  "width": "100%"
        -
          "repeat": "coins"
          "template":
            "type": "custom:button-card"
            "entity": "$item.entity$"
            "variables":
              "title": "$item.name$"
              "ticker": ""
              "price_entity": "$item.price_entity$"
              "volume_entity": "$item.amount_entity$"
              "bar_color": "#ff9800"
              "icon": "$item.icon$"
            "show_icon": false
            "show_name": false
            "show_state": false
            "show_label": false
            "tap_action":
              "action": "more-info"
            "custom_fields":
              "row": "[[[\n    const p=states[variables.price_entity], vol=states[variables.volume_entity];\n    const price=Number(p?.state||0), value=Number(entity.state||0), total=Number(states['$portfolio_total$']?.state||0);\n    const share=total>0?value/total*100:0;\n    const change=Number(p?.attributes?.['24h_change']);\n    const img=p?.attributes?.image||'';\n    const amount=Number(vol?.state||0);\n    const eur=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';\n    const ch=Number.isFinite(change)?change:0, pos=ch>=0;\n    const mobile=window.innerWidth<=520;\n\n    if(mobile){\n      const hex=(variables.bar_color||'#888888').replace('#','');\n      const rgb=hex.length===6\n        ? [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]\n        : [136,136,136];\n      const fill=Math.max(0,Math.min(100,share));\n      const tint='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.14)';\n      const fillBg='linear-gradient(90deg,'+tint+' 0%,'+tint+' '+fill+'%,transparent '+fill+'%,transparent 100%)';\n\n      return '<div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) .72fr 1.08fr;gap:7px;align-items:center;width:calc(100% + 20px);margin-left:-10px;padding:8px 10px;box-sizing:border-box;border-bottom:1px solid var(--divider-color)\">'+\n        '<div style=\"display:flex;align-items:center;gap:7px;min-width:0;text-align:left\">'+\n          (img?'<img src=\"'+img+'\" style=\"width:28px;height:28px;object-fit:contain;flex:0 0 28px\">':'<ha-icon icon=\"'+variables.icon+'\" style=\"--mdc-icon-size:24px;color:'+variables.bar_color+'\"></ha-icon>')+\n          '<div style=\"min-width:0;text-align:left\"><div style=\"font-size:12px;font-weight:700;line-height:1.05;white-space:normal;overflow-wrap:anywhere\">'+variables.title+'</div><div style=\"font-size:9px;color:var(--secondary-text-color);margin-top:2px\">'+variables.ticker+'</div></div>'+\n        '</div>'+\n        '<div style=\"text-align:right;min-width:0\"><div style=\"font-size:11px;white-space:nowrap\">'+eur(price)+'</div><div style=\"font-size:9px;margin-top:2px;color:'+(pos?'#16a34a':'#dc2626')+';white-space:nowrap\">'+(pos?'▲ +':'▼ ')+ch.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %</div></div>'+\n        '<div style=\"text-align:right;min-width:0;background:'+fillBg+';border-radius:9px;padding:6px 7px;box-sizing:border-box\">'+\n          '<div style=\"font-size:11px;font-weight:700;white-space:nowrap\">'+eur(value)+'</div>'+\n          '<div style=\"font-size:9px;color:var(--secondary-text-color);margin-top:3px;white-space:nowrap\">'+amount.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})+' '+variables.ticker+'</div>'+\n        '</div>'+\n      '</div>';\n    }\n\n    return '<div style=\"display:grid;grid-template-columns:minmax(180px,1.45fr) 1fr 1.08fr .88fr;gap:24px;align-items:center;width:calc(100% + 36px);margin-left:-18px;padding:10px 18px;box-sizing:border-box;border-bottom:1px solid var(--divider-color)\">'+\n      '<div style=\"display:flex;align-items:center;gap:11px;min-width:0;text-align:left\">'+\n        (img?'<img src=\"'+img+'\" style=\"width:38px;height:38px;object-fit:contain;flex:0 0 38px\">':'<ha-icon icon=\"'+variables.icon+'\" style=\"--mdc-icon-size:30px;color:'+variables.bar_color+'\"></ha-icon>')+\n        '<div style=\"min-width:0;text-align:left\"><div style=\"font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left\">'+variables.title+'</div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-top:2px;text-align:left\">'+variables.ticker+'</div></div>'+\n      '</div>'+\n      '<div style=\"text-align:right\"><div style=\"font-size:14px\">'+eur(price)+'</div><div style=\"font-size:12px;margin-top:3px;color:'+(pos?'#16a34a':'#dc2626')+'\">'+(pos?'▲ +':'▼ ')+ch.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %</div></div>'+\n      '<div style=\"text-align:right\"><div style=\"font-size:14px;font-weight:700\">'+eur(value)+'</div><div style=\"font-size:12px;color:var(--secondary-text-color);margin-top:3px\">'+amount.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})+' '+variables.ticker+'</div></div>'+\n      '<div style=\"text-align:right\"><div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">'+share.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %</div><div style=\"height:8px;background:rgba(120,120,120,.12);border-radius:999px;overflow:hidden\"><div style=\"height:100%;width:'+Math.min(100,share)+'%;background:'+variables.bar_color+';border-radius:999px\"></div></div></div>'+\n    '</div>';\n  ]]]"
            "styles":
              "card":
                -
                  "height": "[[[ return window.innerWidth <= 520 ? '66px' : '66px'; ]]]"
                -
                  "padding": "[[[ return window.innerWidth <= 520 ? '0 10px' : '0 18px'; ]]]"
                -
                  "border": "0"
                -
                  "border-radius": "0"
                -
                  "box-shadow": "none"
                -
                  "cursor": "pointer"
              "grid":
                -
                  "grid-template-areas": "\"row\""
                -
                  "grid-template-columns": "1fr"
              "custom_fields":
                "row":
                  -
                    "width": "100%"
      "card_mod":
        "style": "ha-card {\n  border: 1px solid var(--divider-color) !important;\n  border-radius: 16px !important;\n  box-shadow: none !important;\n  overflow: hidden !important;\n}\n#root {\n  border-radius: 15px !important;\n  overflow: hidden !important;\n}"
      "view_layout":
        "grid-area": "assets"
