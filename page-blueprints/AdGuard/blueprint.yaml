              "tap_action":
                "action": "more-info"
              "state_display": "[[[ return Number(entity.state||0).toLocaleString('de-DE'); ]]]"
              "styles":
                "card":
                  -
                    "height": "74px"
                  -
                    "padding": "0 18px"
                  -
                    "border": "0"
                  -
                    "border-radius": "0"
                  -
                    "box-shadow": "none"
                  -
                    "background": "transparent"
                "grid":
                  -
                    "grid-template-areas": "\"i n s\""
                  -
                    "grid-template-columns": "48px minmax(0,1fr) auto"
                  -
                    "grid-template-rows": "1fr"
                  -
                    "column-gap": "14px"
                  -
                    "align-items": "center"
                "img_cell":
                  -
                    "width": "48px"
                  -
                    "height": "48px"
                  -
                    "border-radius": "50%"
                  -
                    "background": "rgba(33,150,243,.08)"
                  -
                    "justify-self": "center"
                  -
                    "align-self": "center"
                "icon":
                  -
                    "width": "27px"
                  -
                    "color": "var(--primary-color)"
                "name":
