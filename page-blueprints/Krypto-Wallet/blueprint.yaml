"blueprint":
  "name": "Crypto Wallet"
  "name_de": "Krypto-Wallet"
  "description": "Configure any number of cryptocurrencies. Select a sensor for the displayed value of each coin."
  "description_de": "Beliebig viele Kryptowährungen mit einem Sensor für den angezeigten Coin-Wert konfigurieren."
  "type": "page"
  "version": "1.0.0"
  "icon": "mdi:wallet-outline"
  "author": "makeflori"
  "custom_cards":
    - "button-card"
    - "layout-card"
  "input":
    "portfolio_total":
      "name": "Portfolio total"
      "name_de": "Gesamtwert"
      "description": "Entity containing the overall portfolio value."
      "description_de": "Entität mit dem gesamten Portfoliowert."
      "type": "entity-picker"
    "coins":
      "name": "Coins"
      "name_de": "Coins"
      "description": "Each coin has a value sensor, optional price and holdings sensors, editable name and icon."
      "description_de": "Jeder Coin verwendet einen auswählbaren Wertsensor; Name und Icon sind bearbeitbar."
      "type": "entity-list"
      "suggest": "coin"
      "entity_domain": "sensor"
      "default_icon": "mdi:circle-multiple"
      "default": []
"card":
  "type": "vertical-stack"
  "cards":
    -
      "type": "custom:button-card"
      "name":
        "i18n":
          "de": "Krypto-Wallet"
          "en": "Crypto Wallet"
      "show_icon": false
      "styles":
        "card":
          -
            "background": "transparent"
          -
            "box-shadow": "none"
          -
            "border": "0"
        "name":
          -
            "font-size": "25px"
          -
            "justify-self": "start"
    -
      "type": "custom:button-card"
      "entity": "$portfolio_total$"
      "name":
        "i18n":
          "de": "Gesamtwert"
          "en": "Total portfolio value"
      "show_icon": true
      "icon": "mdi:wallet-outline"
      "show_state": true
      "styles":
        "card":
          -
            "padding": "16px"
          -
            "border-radius": "15px"
        "state":
          -
            "font-size": "26px"
          -
            "font-weight": "600"
    -
      "type": "custom:layout-card"
      "layout_type": "custom:grid-layout"
      "layout":
        "grid-template-columns": "repeat(3,minmax(0,1fr))"
        "grid-gap": "12px"
        "mediaquery":
          "(max-width: 850px)":
            "grid-template-columns": "repeat(2,minmax(0,1fr))"
            "grid-gap": "8px"
          "(max-width: 520px)":
            "grid-template-columns": "1fr"
      "cards":
        -
          "repeat": "coins"
          "template":
            "type": "custom:button-card"
            "entity": "$item.entity$"
            "name": "$item.name$"
            "icon": "$item.icon$"
            "show_icon": true
            "show_name": true
            "show_state": true
            "show_label": true
            "label": "[[[const price=states['$item.price_entity
            "styles":
              "card":
                -
                  "border-radius": "14px"
                -
                  "padding": "14px"
              "grid":
                -
                  "grid-template-areas": "\"i n\" \"i s\" \"i l\""
                -
                  "grid-template-columns": "46px 1fr"
              "icon":
                -
                  "width": "28px"
                -
                  "color": "var(--primary-color)"
              "name":
                -
                  "justify-self": "start"
                -
                  "font-size": "15px"
                -
                  "font-weight": "600"
              "state":
                -
                  "justify-self": "start"
                -
                  "font-size": "18px"
                -
                  "font-weight": "600"
              "label":
                -
                  "justify-self": "start"
                -
                  "font-size": "11px"
            "tap_action":
              "action": "more-info"
];const amount=states['$item.amount_entity
            "styles":
              "card":
                -
                  "border-radius": "14px"
                -
                  "padding": "14px"
              "grid":
                -
                  "grid-template-areas": "\"i n\" \"i s\" \"i l\""
                -
                  "grid-template-columns": "46px 1fr"
              "icon":
                -
                  "width": "28px"
                -
                  "color": "var(--primary-color)"
              "name":
                -
                  "justify-self": "start"
                -
                  "font-size": "15px"
                -
                  "font-weight": "600"
              "state":
                -
                  "justify-self": "start"
                -
                  "font-size": "18px"
                -
                  "font-weight": "600"
              "label":
                -
                  "justify-self": "start"
                -
                  "font-size": "11px"
            "tap_action":
              "action": "more-info"
];const p=price?.state && !['unknown','unavailable'].includes(price.state) ? price.state+' '+(price.attributes?.unit_of_measurement||'') : '';const a=amount?.state && !['unknown','unavailable'].includes(amount.state) ? amount.state+' '+(amount.attributes?.unit_of_measurement||'') : '';return [p,a].filter(Boolean).join(' · ') || '—';]]]"
            "styles":
              "card":
                -
                  "border-radius": "14px"
                -
                  "padding": "14px"
              "grid":
                -
                  "grid-template-areas": "\"i n\" \"i s\" \"i l\""
                -
                  "grid-template-columns": "46px 1fr"
              "icon":
                -
                  "width": "28px"
                -
                  "color": "var(--primary-color)"
              "name":
                -
                  "justify-self": "start"
                -
                  "font-size": "15px"
                -
                  "font-weight": "600"
              "state":
                -
                  "justify-self": "start"
                -
                  "font-size": "18px"
                -
                  "font-weight": "600"
              "label":
                -
                  "justify-self": "start"
                -
                  "font-size": "11px"
            "tap_action":
              "action": "more-info"
