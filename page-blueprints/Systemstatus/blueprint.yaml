und:rgba(120,120,120,.14);border-radius:999px;overflow:hidden\"><div style=\"height:100%;width:'+fill+'%;background:#03a9f4;border-radius:999px\"></div></div>'+\n          '<div style=\"font-size:8px;line-height:1;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+detail+'</div>'+\n        '</div>'+\n      '</div>';\n    ]]]"
