"blueprint":
  "icon": "mdi:monitor-dashboard"
  "name": "System Monitor"
  "name_de": "Systemstatus"
  "description": "Home Assistant system metrics, add-on memory and update status."
  "description_de": "Systemkennzahlen, App-Arbeitsspeicher und Update-Status für Home Assistant."
  "version": "1.0.0"
  "type": "page"
  "author": "makeflori"
  "custom_cards":
    - "auto-entities"
    - "button-card"
    - "layout-card"
    - "vertical-stack-in-card"
  "input":
    "sensor_processor_use":
      "name": "Processor Use"
      "description": "Select the entity used for sensor.processor_use."
      "type": "entity-picker"
    "sensor_memory_use_percent":
      "name": "Memory Use Percent"
      "description": "Select the entity used for sensor.memory_use_percent."
      "type": "entity-picker"
    "sensor_disk_use_percent":
      "name": "Disk Use Percent"
      "description": "Select the entity used for sensor.disk_use_percent."
      "type": "entity-picker"
    "sensor_system_monitor_disk_use":
      "name": "System Monitor Disk Use"
      "description": "Select the entity used for sensor.system_monitor_disk_use."
      "type": "entity-picker"
    "sensor_processor_temperature":
      "name": "Processor Temperature"
      "description": "Select the entity used for sensor.processor_temperature."
      "type": "entity-picker"
    "sensor_memory_ha_core":
      "name": "Memory Ha Core"
      "description": "Select the entity used for sensor.memory_ha_core."
      "type": "entity-picker"
    "sensor_memory_ha_mcp":
      "name": "Memory Ha Mcp"
      "description": "Select the entity used for sensor.memory_ha_mcp."
      "type": "entity-picker"
    "sensor_memory_ha_mcp_webhook_proxy":
      "name": "Memory Ha Mcp Webhook Proxy"
      "description": "Select the entity used for sensor.memory_ha_mcp_webhook_proxy."
      "type": "entity-picker"
    "sensor_memory_adguard":
      "name": "Memory Adguard"
      "description": "Select the entity used for sensor.memory_adguard."
      "type": "entity-picker"
    "sensor_memory_appdaemon":
      "name": "Memory Appdaemon"
      "description": "Select the entity used for sensor.memory_appdaemon."
      "type": "entity-picker"
    "sensor_last_boot":
      "name": "Last Boot"
      "description": "Select the entity used for sensor.last_boot."
      "type": "entity-picker"
    "sensor_backup_letztes_erfolgreiches_automatisches_backup":
      "name": "Backup Letztes Erfolgreiches Automatisches Backup"
      "description": "Select the entity used for sensor.backup_letztes_erfolgreiches_automatisches_backup."
      "type": "entity-picker"
    "sensor_backup_nachstes_geplantes_automatisches_backup":
      "name": "Backup Nachstes Geplantes Automatisches Backup"
      "description": "Select the entity used for sensor.backup_nachstes_geplantes_automatisches_backup."
      "type": "entity-picker"
    "update_home_assistant_core_update":
      "name": "Home Assistant Core Update"
      "description": "Select the entity used for update.home_assistant_core_update."
      "type": "entity-picker"
    "update_home_assistant_operating_system_update":
      "name": "Home Assistant Operating System Update"
      "description": "Select the entity used for update.home_assistant_operating_system_update."
      "type": "entity-picker"
    "update_home_assistant_supervisor_update":
      "name": "Home Assistant Supervisor Update"
      "description": "Select the entity used for update.home_assistant_supervisor_update."
      "type": "entity-picker"
"card":
  "type": "vertical-stack"
  "cards":
    -
      "type": "vertical-stack"
      "cards":
        -
          "type": "custom:button-card"
          "name":
            "i18n":
              "de": "Ressourcen"
              "en": "Resources"
          "show_icon": false
          "show_state": false
          "tap_action":
            "action": "none"
          "styles":
            "card":
              -
                "height": "24px"
              -
                "padding": "0 4px"
              -
                "background": "transparent"
              -
                "border": "none"
              -
                "box-shadow": "none"
            "name":
              -
                "justify-self": "start"
              -
                "font-size": "17px"
              -
                "font-weight": "600"
        -
          "type": "custom:layout-card"
          "layout_type": "custom:grid-layout"
          "layout":
            "grid-template-columns": "1fr"
            "grid-template-areas": "\"metrics\" \"graphs\""
            "grid-gap": "12px"
            "align-items": "start"
            "margin": "0"
            "padding": "0"
          "cards":
            -
              "type": "custom:layout-card"
              "layout_type": "custom:grid-layout"
              "layout":
                "grid-template-columns": "repeat(4,minmax(0,1fr))"
                "grid-template-rows": "72px"
                "grid-template-areas": "\"m1 m2 m3 m4\""
                "grid-column-gap": "12px"
                "margin": "0"
                "padding": "0"
              "cards":
                -
                  "type": "custom:button-card"
                  "entity": "$sensor_processor_use$"
                  "name": "CPU"
                  "icon": "mdi:chip"
                  "show_icon": false
                  "show_name": false
                  "show_state": false
                  "tap_action":
                    "action": "more-info"
                  "styles":
                    "card":
                      -
                        "height": "72px"
                      -
                        "padding": "0"
                      -
                        "border": "1px solid var(--divider-color)"
                      -
                        "border-radius": "14px"
                      -
                        "box-shadow": "none"
                      -
                        "background": "var(--card-background-color)"
                      -
                        "overflow": "hidden"
                    "grid":
                      -
                        "grid-template-areas": "\"content\""
                      -
                        "grid-template-columns": "1fr"
                      -
                        "grid-template-rows": "1fr"
                      -
                        "height": "100%"
                    "custom_fields":
                      "content":
                        -
                          "height": "100%"
                        -
                          "width": "100%"
                  "view_layout":
                    "grid-area": "m1"
                  "show_label": false
                  "custom_fields":
                    "content": "[[[\n      const n=Number(entity.state);\n      const unit=entity.attributes.unit_of_measurement||'';\n      const value=Number.isFinite(n)\n        ? n.toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:1})+(unit?' '+unit:'')\n        : '–';\n\n      let detail='';\n      if('$sensor_processor_use$'==='$sensor_processor_use$') detail='Prozessorauslastung';\n      else if('$sensor_processor_use$'==='$sensor_memory_use_percent$') detail='Arbeitsspeicher belegt';\n      else if('$sensor_processor_use$'==='$sensor_disk_use_percent$'){\n        const used=Number(states['$sensor_system_monitor_disk_use$']?.state);\n        detail=Number.isFinite(used)?used.toLocaleString('de-DE',{maximumFractionDigits:1})+' GB belegt':'Massenspeicher belegt';\n      } else if('$sensor_processor_use$'==='$sensor_processor_temperature$'){\n        detail=n<60?'Normal':(n<75?'Erhöht':'Kritisch');\n      }\n\n      const fill=Math.max(0,Math.min(100,n));\n\n      return '<div style=\"height:100%;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:9px;padding:8px 10px;box-sizing:border-box;align-items:center\">'+\n        '<div style=\"width:30px;height:30px;border-radius:50%;background:rgba(3,169,244,.10);display:flex;align-items:center;justify-content:center;color:#03a9f4\"><ha-icon icon=\"mdi:chip\" style=\"--mdc-icon-size:17px\"></ha-icon></div>'+\n        '<div style=\"min-width:0;display:grid;grid-template-rows:auto auto auto;row-gap:4px\">'+\n          '<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0\">'+\n            '<div style=\"font-size:12px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">CPU</div>'+\n            '<div style=\"font-size:18px;font-weight:750;line-height:1;white-space:nowrap;flex:0 0 auto\">'+value+'</div>'+\n          '</div>'+\n          '<div style=\"height:5px;background:rgba(120,120,120,.14);border-radius:999px;overflow:hidden\"><div style=\"height:100%;width:'+fill+'%;background:#03a9f4;border-radius:999px\"></div></div>'+\n          '<div style=\"font-size:9px;line-height:1;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+detail+'</div>'+\n        '</div>'+\n      '</div>';\n    ]]]"
