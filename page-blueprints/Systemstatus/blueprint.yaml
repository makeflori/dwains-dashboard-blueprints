                    "content": "[[[\n      const items=[[\"Home Assistant Core\",\"$update_home_assistant_core_update$\",\"mdi:cube-outline\"],[\"Home Assistant Operating System\",\"$update_home_assistant_operating_system_update$\",\"mdi:memory\"],[\"Supervisor\",\"$update_home_assistant_supervisor_update$\",\"mdi:server\"]];\n      const active=items.filter(([,id])=>states[id]?.state==='on');\n      const open=(id,e)=>{\n        e.stopPropagation();\n        e.currentTarget.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:id},bubbles:true,composed:true}));\n      };\n      return html`\n        <div style=\"border:1px solid var(--divider-color);border-radius:14px;overflow:hidden;background:var(--card-background-color)\">\n          <div style=\"height:36px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;border-bottom:${active.length?'1px solid var(--divider-color)':'0'}\">\n            Verfügbare Updates\n            <span style=\"margin-left:auto;font-size:11px;font-weight:600;color:var(--secondary-text-color)\">${active.length}</span>\n          </div>\n          ${active.length ? active.map(([name,id,icon],i)=>{\n            const s=states[id], installed=s?.attributes?.installed_version||'–', latest=s?.attributes?.latest_version||installed;\n            return html`<div @click=${e=>open(id,e)} style=\"height:42px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;column-gap:9px;padding:0 12px;cursor:pointer;border-top:${i?'1px solid var(--divider-color)':'0'}\">\n              <ha-icon icon=${icon} style=\"--mdc-icon-size:18px;color:#03a9f4\"></ha-icon>\n              <div style=\"font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;justify-self:start\">${name}</div>\n              <div style=\"font-size:12px;color:var(--secondary-text-color);white-space:nowrap\">${installed} → ${latest}</div>\n            </div>`;\n          }) : html`<div style=\"padding:10px 12px 12px;font-size:12px;color:var(--secondary-text-color)\">Keine Updates verfügbar</div>`}\n        </div>\n      `;\n    ]]]"
