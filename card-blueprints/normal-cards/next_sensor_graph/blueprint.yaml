blueprint:
  name: Sensor Card Blueprint
  description: Numeric sensor card with a large value and history graph for Dwains Dashboard Next by makeflori.
  version: "1.0.0"
  type: card
  author: makeflori
  source_url: https://raw.githubusercontent.com/makeflori/dwains-dashboard-blueprints/main/card-blueprints/normal-cards/next_sensor_graph/blueprint.yaml
  custom_cards:
    - card-mod
  input:
    entity:
      name: Sensor
      description: Wähle einen numerischen Sensor mit aufgezeichnetem Verlauf.
      type: entity-picker
    hours_to_show:
      name: Verlauf in Stunden
      description: Zeitraum des Verlaufs. Verwende eine positive Zahl, zum Beispiel 24.
      type: number
      default: 24
    accent_color:
      name: Akzentfarbe
      description: "auto verwendet die DD-Next-Farbe des Sensortyps. Alternativ eine CSS-Farbe wie #7c67c7."
      type: text-field
      default: auto
card:
  type: sensor
  entity: "$entity$"
  graph: line
  hours_to_show: "$hours_to_show$"
  detail: 2
  tap_action:
    action: more-info
  hold_action:
    action: more-info
  card_mod:
    style: |
      {% set requested = "$accent_color$" | trim %}
      {% set dc = state_attr('$entity$', 'device_class') %}
      {% set colors = {'temperature': '#7c67c7', 'humidity': '#34a6d8', 'power': '#d88e20', 'energy': '#d88e20'} %}
      ha-card {
        --dd-sensor-color: {{ colors.get(dc, '#4f79a7') if requested == 'auto' else requested }};
        --accent-color: var(--dd-sensor-color);
        --state-icon-color: var(--dd-sensor-color);
        --state-inactive-color: var(--dd-sensor-color);
        --ha-card-background: var(--card-background-color);
        box-sizing: border-box;
        min-height: 150px;
        border: 0;
        border-radius: 10px;
        background: color-mix(in srgb, var(--card-background-color) 98%, #ffffff);
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.06),
          inset 0 0 0 1px rgba(15, 23, 42, 0.035);
        overflow: hidden;
      }
      .header {
        align-items: flex-start;
        gap: 10px;
        padding: 14px 14px 0;
      }
      .name {
        flex: 1;
        min-width: 0;
        padding-top: 1px;
        color: var(--secondary-text-color);
        font-size: 13px;
        font-weight: 600;
        line-height: 18px;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .icon {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--dd-sensor-color) 12%, transparent);
      }
      ha-state-icon {
        color: var(--dd-sensor-color) !important;
        --mdc-icon-size: 22px;
      }
      .info {
        align-items: baseline;
        gap: 4px;
        margin-top: 0;
        padding: 4px 14px 12px;
      }
      .value {
        color: var(--dd-sensor-color);
        font-size: 28px;
        font-weight: 650;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .measurement {
        color: var(--secondary-text-color);
        font-size: 13px;
      }
      .footer {
        margin-top: auto;
      }
      @media (prefers-color-scheme: dark) {
        ha-card {
          box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18),
            inset 0 0 0 1px color-mix(in srgb, var(--primary-text-color) 6%, transparent);
        }
      }
      
